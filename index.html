<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typewriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   MECHANICAL CONSTANTS — the single source of truth.
   JavaScript reads these values and the measured paper width; the paper's
   visual size, the margins, the scale, and the column logic all derive
   from the same --char-w measurement, so they cannot drift apart.
   ========================================================================== */
:root{
  --paper-cols: 85;        /* 8.5in sheet at pica pitch (10 characters / inch) */
  --margin-left: 10;       /* 1in left margin stop  */
  --margin-right: 10;      /* 1in right margin stop */
  --top-lines: 6;          /* 1in top margin at 6 lines / inch */
  --sheet-lines: 66;       /* 11in sheet */
  --platen-extra: 16;      /* platen overhang beyond the sheet, each side, in columns */
  --bell-warn: 7;          /* bell rings this many columns before the right margin */
  --tab-every: 5;          /* tab stops */

  --font-size: 20px;       /* set by JS from viewport */
  --char-w: 12px;          /* measured glyph advance, set by JS */
  --line-h: calc(var(--char-w) * 5 / 3);            /* 6 lpi relative to 10 cpi */
  --paper-w: calc(var(--char-w) * var(--paper-cols));
  --platen-x: calc(var(--char-w) * var(--platen-extra) * -1);
  --platen-w: calc(var(--char-w) * (var(--paper-cols) + 2 * var(--platen-extra)));
  --knob-w: calc(var(--line-h) * 2.3);
  --flange-w: calc(var(--line-h) * 0.38);
  --paper-lines: 66;

  /* vertical geometry — px values written by JS from viewport height */
  --yp: 700px; --platen-top: 670px; --platen-h: 80px; --platen-bottom: 750px;
  --bail-top: 650px; --table-top: 400px;

  --ink: 26,22,28;
  --chrome: linear-gradient(180deg,#34363a 0%,#8f9398 14%,#eef0f2 28%,#c2c6ca 40%,#6b6f74 58%,#2a2c2f 76%,#7a7e84 90%,#b6babf 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0806}
body{user-select:none;-webkit-user-select:none;cursor:default;-webkit-font-smoothing:antialiased}

/* ---------- desk & room ---------- */
#desk{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 26% -12%, #4d3826 0%, #2a1c11 36%, #140d08 66%, #080504 100%);
}
#desk::after{content:"";position:absolute;inset:0;background-image:var(--desk-grain);opacity:.55;mix-blend-mode:overlay}

#machine{position:fixed;inset:0;z-index:1}

/* ---------- carriage (moves as one rigid body) ---------- */
#carriage{position:absolute;left:0;top:0;width:var(--paper-w);height:100%;will-change:transform}

.table{position:absolute;left:var(--platen-x);width:var(--platen-w);top:var(--table-top);
  height:calc(var(--platen-top) - var(--table-top) + 8px);border-radius:10px 10px 0 0;
  background:
    linear-gradient(90deg, rgba(255,230,200,.05), transparent 30%, transparent 70%, rgba(0,0,0,.25)),
    linear-gradient(180deg,#26221f 0%,#171513 30%,#0e0d0c 75%,#070606 100%);
  box-shadow:0 -1px 0 rgba(255,240,220,.08) inset, 0 -8px 30px rgba(0,0,0,.45)}
.table::before{content:"";position:absolute;left:6px;right:6px;top:0;height:3px;border-radius:3px;background:var(--chrome);opacity:.85}
.guide{position:absolute;left:calc(var(--platen-x) * -1 - 7px);bottom:calc(var(--line-h) * 1.2);width:7px;height:calc(var(--line-h) * 2.6);
  border-radius:2px;background:linear-gradient(90deg,#55585c,#e9ebed 45%,#6b6e73);box-shadow:1px 2px 4px rgba(0,0,0,.6)}

.tail-clip{position:absolute;left:-28px;top:0;width:calc(var(--paper-w) + 56px);height:calc(var(--platen-top) + var(--line-h) * .3);overflow:hidden;pointer-events:none}
#tail{position:absolute;left:28px;top:0;width:var(--paper-w);height:calc(var(--line-h) * var(--sheet-lines));background-color:#ddd4c4;will-change:transform;
  box-shadow:0 0 0 .5px rgba(60,45,30,.2), 0 -6px 22px rgba(0,0,0,.35)}
#tail::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(60,45,28,.16),transparent 4%,transparent 96%,rgba(40,30,20,.2)),
             linear-gradient(0deg,rgba(0,0,0,.55) 0,rgba(0,0,0,.18) calc(var(--line-h) * 1.2),rgba(0,0,0,0) calc(var(--line-h) * 4)),
             linear-gradient(180deg,rgba(70,55,35,.18) 0,transparent 6px)}
.platen{position:absolute;left:var(--platen-x);width:var(--platen-w);top:var(--platen-top);height:var(--platen-h);
  background-image:var(--rubber-grain), linear-gradient(180deg,#060606 0%,#1c1c1d 12%,#303032 22%,#1d1d1e 36%,#121213 60%,#070707 84%,#020202 100%);
  background-size:180px 180px, 100% 100%}

.paper-clip{position:absolute;left:-28px;top:0;width:calc(var(--paper-w) + 56px);height:var(--platen-bottom);overflow:hidden}
#paper{position:absolute;left:28px;top:0;width:var(--paper-w);height:calc(var(--line-h) * var(--paper-lines));will-change:transform}
.sheet{position:absolute;inset:0;background-color:#efe8da;
  box-shadow:0 0 0 .5px rgba(60,45,30,.18), 0 2px 3px rgba(0,0,0,.28), 0 10px 28px rgba(0,0,0,.42)}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(90,70,45,.13) 0, rgba(90,70,45,.04) 1.2%, transparent 3.5%, transparent 96.5%, rgba(90,70,45,.05) 98.8%, rgba(60,45,30,.16) 100%),
    linear-gradient(180deg, rgba(80,62,40,.14) 0, transparent 5px)}
.sheet::after{content:"";position:absolute;right:0;top:0;width:18%;height:calc(var(--line-h)*3);pointer-events:none;
  background:radial-gradient(120% 100% at 100% 0%, rgba(70,52,30,.10), transparent 70%)}

#ink{position:absolute;inset:0;font-family:"Courier Prime","Courier New",Courier,monospace;font-size:var(--font-size);font-weight:400}
.line{position:absolute;left:0;right:0;height:var(--line-h)}
.g{position:absolute;top:calc(var(--line-h) * -.25);padding-top:calc(var(--line-h) * .25);
  width:calc(var(--char-w) * 1.6);height:calc(var(--line-h) * 1.5);line-height:var(--line-h);
  text-align:center;white-space:pre;color:transparent;-webkit-text-fill-color:transparent;
  -webkit-background-clip:text;background-clip:text}

.shade{position:absolute;left:var(--platen-x);width:var(--platen-w);top:var(--platen-top);height:var(--platen-h);pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.24) 8%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.44) 80%,rgba(0,0,0,.85) 100%)}
.gloss{position:absolute;left:var(--platen-x);width:var(--platen-w);top:var(--platen-top);height:var(--platen-h);pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent 7%,rgba(255,244,225,.10) 15%,rgba(255,244,225,.03) 25%,transparent 32%)}
.curl{position:absolute;left:0;width:var(--paper-w);top:calc(var(--platen-top) - var(--line-h) * 1.5);height:calc(var(--line-h) * 1.62);pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(50,35,18,.07) 45%,rgba(0,0,0,.20) 78%,rgba(255,248,235,.20) 91%,rgba(0,0,0,.30) 100%)}

.bail{position:absolute;left:calc(var(--platen-x) + var(--line-h) * 1.1);width:calc(var(--platen-w) - var(--line-h) * 2.2);
  top:var(--bail-top);height:calc(var(--line-h) * .62);border-radius:999px;background:var(--chrome);
  box-shadow:0 calc(var(--line-h) * .18) calc(var(--line-h) * .28) rgba(0,0,0,.45), 0 1px 0 rgba(0,0,0,.6)}
.scale{position:absolute;left:0;width:var(--paper-w);top:var(--bail-top);height:calc(var(--line-h) * .62);pointer-events:none}
.scale::before{content:"";position:absolute;left:0;right:0;bottom:12%;height:30%;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--char-w) / 2 - .5px),rgba(20,20,22,.55) calc(var(--char-w) / 2 - .5px),rgba(20,20,22,.55) calc(var(--char-w) / 2 + .5px),transparent calc(var(--char-w) / 2 + .5px),transparent var(--char-w))}
.scale span{position:absolute;top:4%;transform:translateX(-50%);font:700 calc(var(--line-h) * .3)/1 "Courier Prime","Courier New",monospace;color:rgba(25,24,24,.78);letter-spacing:-.02em}
.mstop{position:absolute;top:calc(var(--bail-top) - var(--line-h) * .3);width:calc(var(--line-h) * .42);height:calc(var(--line-h) * .34);
  transform:translateX(-50%);background:linear-gradient(180deg,#b3322a,#5e1410);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.mstop.l{left:calc(var(--margin-left) * var(--char-w))}
.mstop.r{left:calc((var(--paper-cols) - var(--margin-right)) * var(--char-w))}

.roller{position:absolute;top:calc(var(--bail-top) - var(--line-h) * .2);height:calc(var(--line-h) * 1.02);width:calc(var(--line-h) * 1.9);
  border-radius:38% / 50%;margin-left:calc(var(--line-h) * -.95);
  background:linear-gradient(180deg,#0a0a0a 0%,#3b3937 26%,#242221 45%,#101010 70%,#030303 100%);
  box-shadow:0 calc(var(--line-h) * .15) calc(var(--line-h) * .25) rgba(0,0,0,.5)}
.roller.r1{left:calc(var(--paper-w) * .2)} .roller.r2{left:calc(var(--paper-w) * .8)}

.flange{position:absolute;top:calc(var(--platen-top) - var(--platen-h) * .01);height:calc(var(--platen-h) * 1.02);width:var(--flange-w);
  background:linear-gradient(180deg,#2c2e31 0%,#a9adb2 18%,#f3f4f5 30%,#8d9196 52%,#2e3033 80%,#5e6166 100%);border-radius:2px}
.flange.fl{left:calc(var(--platen-x) - var(--flange-w))}
.flange.fr{left:calc(var(--platen-x) + var(--platen-w))}
.knob{position:absolute;top:calc(var(--platen-top) - var(--platen-h) * .06);height:calc(var(--platen-h) * 1.12);width:var(--knob-w);border-radius:26% / 10%;overflow:hidden;
  background:repeating-linear-gradient(180deg,#0b0b0b 0,#0b0b0b 2px,#34322f 2px,#34322f 3px,#161515 3px,#161515 5px);background-size:100% 5px}
.knob::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.2) 22%,rgba(255,240,220,.12) 32%,rgba(0,0,0,.05) 48%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.95) 100%),
             linear-gradient(90deg,rgba(0,0,0,.5),transparent 20%,transparent 80%,rgba(0,0,0,.5))}
.knob.kl{left:calc(var(--platen-x) - var(--flange-w) - var(--knob-w))}
.knob.kr{left:calc(var(--platen-x) + var(--platen-w) + var(--flange-w))}

.lever{position:absolute;left:calc(var(--platen-x) + var(--line-h) * .9 - var(--line-h) * 7.5);top:calc(var(--platen-top) - var(--line-h) * .78);
  width:calc(var(--line-h) * 7.5);height:calc(var(--line-h) * .42);transform-origin:100% 50%;transform:rotate(-24deg);
  border-radius:calc(var(--line-h) * .2);background:var(--chrome);box-shadow:0 calc(var(--line-h) * .35) calc(var(--line-h) * .4) rgba(0,0,0,.55)}
.lever::before{content:"";position:absolute;left:calc(var(--line-h) * -.6);top:calc(var(--line-h) * -.32);width:calc(var(--line-h) * 1.9);height:calc(var(--line-h) * 1.06);
  border-radius:45%;background:linear-gradient(180deg,#3a3c40,#dfe2e5 30%,#9ea2a7 55%,#35373b 100%);box-shadow:0 2px 5px rgba(0,0,0,.6)}

#mech{position:absolute;left:0;pointer-events:none}

/* ---------- lighting ---------- */
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 85% 75% at 40% 32%, rgba(0,0,0,0) 45%, rgba(0,0,0,.5) 100%),
             linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,0) 28%)}
#lamp{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(ellipse 70% 62% at 24% 8%, rgba(255,210,150,.6), rgba(255,210,150,0) 72%)}

/* ---------- UI ---------- */
#hint{position:fixed;z-index:10;top:22px;left:50%;transform:translateX(-50%);font:400 11px/1 "Courier Prime","Courier New",monospace;
  letter-spacing:.28em;text-transform:uppercase;color:rgba(236,224,204,.42);transition:opacity 1.4s ease;white-space:nowrap}
#hint.gone{opacity:0}
#menuBtn{position:fixed;z-index:11;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,240,220,.1);
  background:rgba(255,255,255,.03);color:rgba(236,224,204,.8);opacity:.28;cursor:pointer;display:grid;place-items:center;padding:0;transition:opacity .25s, background .25s}
#menuBtn:hover,#menuBtn.on{opacity:1;background:rgba(255,255,255,.07)}
#menuBtn:focus-visible{outline:1px solid rgba(236,224,204,.5);outline-offset:2px}
#menu{position:fixed;z-index:11;top:56px;right:14px;width:258px;padding:6px;border-radius:10px;
  background:rgba(20,16,13,.93);border:1px solid rgba(255,240,220,.08);box-shadow:0 18px 40px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-family:"Courier Prime","Courier New",monospace;color:#ebe2d2;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease, transform .18s ease}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu .item{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:7px;cursor:pointer}
#menu .item:hover,#menu .item:focus-visible{background:rgba(255,255,255,.06);outline:none}
#menu .lbl{display:block;font-size:14px;letter-spacing:.04em}
#menu .sub{display:block;font-size:11px;color:rgba(235,226,210,.45);margin-top:3px}
#menu .item.warn .lbl{color:#e7a48f}
#menu hr{border:0;border-top:1px solid rgba(255,240,220,.07);margin:4px 6px}
#menu .keys{font-size:10.5px;line-height:1.65;color:rgba(235,226,210,.38);padding:6px 12px 8px}
#toast{position:fixed;z-index:12;bottom:22px;left:50%;transform:translateX(-50%);font:400 12px/1 "Courier Prime","Courier New",monospace;
  letter-spacing:.12em;color:rgba(236,224,204,.75);background:rgba(20,16,13,.85);padding:9px 14px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#probe{position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:pre;font-family:"Courier Prime","Courier New",Courier,monospace}
#lhProbe{position:absolute;left:-9999px;top:-9999px;visibility:hidden;width:1px;height:var(--line-h)}
</style>
</head>
<body>
<svg id="filters" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="desk"></div>
<div id="machine">
  <div id="carriage">
    <div class="table"><div class="guide"></div></div>
    <div class="tail-clip"><div id="tail"></div></div>
    <div class="platen" id="platen"></div>
    <div class="paper-clip"><div id="paper"><div class="sheet" id="sheet"></div><div id="ink"></div></div></div>
    <div class="shade"></div><div class="gloss"></div><div class="curl"></div>
    <div class="bail"></div><div class="scale" id="scale"></div>
    <div class="mstop l"></div><div class="mstop r"></div>
    <div class="roller r1"></div><div class="roller r2"></div>
    <div class="flange fl"></div><div class="flange fr"></div>
    <div class="knob kl" id="knobL"></div><div class="knob kr" id="knobR"></div>
    <div class="lever" id="lever"></div>
  </div>
  <canvas id="mech"></canvas>
</div>
<div id="vignette"></div><div id="lamp"></div>

<div id="hint">Begin typing &nbsp;·&nbsp; Esc for menu</div>
<button id="menuBtn" aria-label="Menu" title="Menu (Esc)">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h10"/></svg>
</button>
<div id="menu" role="menu" aria-hidden="true">
  <button class="item" data-act="new"><span class="lbl">New Sheet</span><span class="sub">Pull this page, feed a fresh one</span></button>
  <button class="item" data-act="export"><span class="lbl">Export Document</span><span class="sub">Download as plain .txt</span></button>
  <hr>
  <button class="item" data-act="sound"><span class="lbl" id="soundLbl">Sound: On</span><span class="sub">Synthesized in real time</span></button>
  <div class="keys">Enter — carriage return<br>Backspace — back-space (overstrike)<br>Tab — tabulator · ← → carriage<br>↑ ↓ roll platen · Home / End<br>Esc — close</div>
</div>
<div id="toast"></div>
<span id="probe"></span><div id="lhProbe"></div>

<script>
(() => {
'use strict';

/* =========================================================================
   Utilities
   ========================================================================= */
const root = document.documentElement;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const vary = (x, p = 0.03) => x * (1 + (Math.random() * 2 - 1) * p);   // ±3% default
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const now = () => performance.now();
const r2 = (v) => Math.round(v * 100) / 100;
const r4 = (v) => Math.round(v * 10000) / 10000;
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const ease = {
  linear: (p) => p,
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outBack: (p) => { const c1 = 0.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  // "Slam": quick linear velocity ramp, then constant speed straight into a hard stop.
  slam: (a) => (p) => { const n = 1 - a / 2; return p < a ? (p * p / (2 * a)) / n : (a / 2 + p - a) / n; },
};
const RETURN_EASE = ease.slam(0.16);
const TAB_EASE = ease.slam(0.3);
function invert(fn, y) { let lo = 0, hi = 1; for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (fn(m) < y) lo = m; else hi = m; } return (lo + hi) / 2; }

/* =========================================================================
   Geometry (all derived from CSS constants + measured glyph advance)
   ========================================================================= */
const G = { W: 0, H: 0, cw: 12, lh: 20, cols: 85, ml: 10, mr: 10, LM: 10, RM: 75, bellCol: 68, topLines: 6, sheetLines: 66, tabEvery: 5, Xc: 0, Yp: 0, platenTop: 0, platenH: 0, platenBottom: 0 };
const state = { line: 0, col: 10 };
let strikes = [];      // [line, col, char, dx(em), dy(em), rot(deg), a1, a2, angle]
let maxLine = 0;
let busy = false;

const carriageEl = $('#carriage'), paperEl = $('#paper'), inkEl = $('#ink'), sheetEl = $('#sheet');
const tailEl = $('#tail'), platenEl = $('#platen'), knobL = $('#knobL'), knobR = $('#knobR'), leverEl = $('#lever');
const machineEl = $('#machine'), probe = $('#probe'), lhProbe = $('#lhProbe'), scaleEl = $('#scale');

function cssNum(name, fallback) { const v = parseFloat(getComputedStyle(root).getPropertyValue(name)); return isFinite(v) ? v : fallback; }

/* =========================================================================
   Procedural textures (paper grain, fibres, rubber, desk)
   ========================================================================= */
function canvasTex(size, paint) { const c = document.createElement('canvas'); c.width = c.height = size; paint(c.getContext('2d'), size); return c.toDataURL('image/png'); }
function speckle(x, s, dark, light, dA, lA) {
  const im = x.createImageData(s, s), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    if (Math.random() < 0.5) { d[i] = dark[0]; d[i + 1] = dark[1]; d[i + 2] = dark[2]; d[i + 3] = Math.random() * dA; }
    else { d[i] = light[0]; d[i + 1] = light[1]; d[i + 2] = light[2]; d[i + 3] = Math.random() * lA; }
  }
  x.putImageData(im, 0, 0);
}
function genTextures() {
  const grain = canvasTex(256, (x, s) => {
    speckle(x, s, [95, 78, 55], [255, 253, 246], 26, 30);
    // fibres, drawn with wrap-around so the tile is seamless
    for (let i = 0; i < 170; i++) {
      const x0 = Math.random() * s, y0 = Math.random() * s, len = rand(4, 16), a = Math.random() * Math.PI, bend = rand(-3, 3);
      const light = Math.random() < 0.35;
      x.strokeStyle = light ? 'rgba(255,255,250,.22)' : `rgba(125,100,70,${rand(0.05, 0.12).toFixed(3)})`;
      x.lineWidth = rand(0.35, 0.8);
      for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
        x.beginPath(); x.moveTo(x0 + ox, y0 + oy);
        x.quadraticCurveTo(x0 + ox + Math.cos(a) * len / 2 + bend, y0 + oy + Math.sin(a) * len / 2 - bend, x0 + ox + Math.cos(a) * len, y0 + oy + Math.sin(a) * len);
        x.stroke();
      }
    }
  });

    cx.beginPath(); cx.moveTo(0, cTop + 0.5); cx.lineTo(xl - lh * 1.1, cTop + 0.5); cx.moveTo(xr + lh * 1.1, cTop + 0.5); cx.lineTo(G.W, cTop + 0.5);
    cx.strokeStyle = 'rgba(255,245,230,.22)'; cx.lineWidth = 1; cx.stroke();
    const rx = Math.min(G.W * 0.055, xl * 0.3), sy = cTop + (G.H - cTop) * 0.48;
    if (rx > 8) { drawSpool(xl * 0.5, sy, rx, rx * 0.42); drawSpool(xr + (G.W - xr) * 0.5, sy, rx, rx * 0.42); }
  }
  function drawCardHolder() {
    const { Xc, Yp, lh, cw } = G;
    const x0 = Xc - 3.3 * lh, x1 = Xc + 3.3 * lh, y0 = Yp - 0.62 * lh, y1 = Yp + 1.0 * lh;
    rr(x0, y0, x1 - x0, y1 - y0, lh * 0.18);
    cx.fillStyle = 'rgba(225,232,240,.06)'; cx.fill(); cx.strokeStyle = 'rgba(255,255,255,.14)'; cx.lineWidth = 1; cx.stroke();
    cx.beginPath(); cx.moveTo(x0 + lh * 0.2, y0 + 0.5); cx.lineTo(x1 - lh * 0.2, y0 + 0.5); cx.strokeStyle = 'rgba(255,255,255,.42)'; cx.stroke();
    const kmax = Math.floor((x1 - x0) / 2 / cw) - 1;
    for (let k = -kmax; k <= kmax; k++) {
      const x = Math.round(Xc + k * cw) + 0.5, h = (k === 0 ? 0.34 : k % 5 === 0 ? 0.22 : 0.12) * lh;
      cx.beginPath(); cx.moveTo(x, y0 + 1); cx.lineTo(x, y0 + 1 + h);
      cx.strokeStyle = k === 0 ? 'rgba(190,32,24,.92)' : 'rgba(25,25,30,.5)'; cx.lineWidth = k === 0 ? 1.4 : 1; cx.stroke();
    }
    for (const fx of [x0 - lh * 0.42, x1 - lh * 0.02]) {
      rr(fx, Yp + 0.12 * lh, lh * 0.44, lh * 1.1, lh * 0.2); cx.fillStyle = chromeH(fx, fx + lh * 0.44); cx.fill();
      cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.lineWidth = 1; cx.stroke();
    }
  }
  function drawRibbon() {
    const { Xc, Yp, lh } = G, Lf = lift * lh * 1.02;
    const y0 = Yp + 0.6 * lh, h = 0.72 * lh;
    const c0 = Xc - 1.55 * lh, c1 = Xc + 1.55 * lh, s0 = Xc - 4.4 * lh, s1 = Xc + 4.4 * lh;
    const pb = y0 - Lf + h;
    cx.fillStyle = chromeH(Xc - lh * 0.13, Xc + lh * 0.13);           // vibrator stem
    cx.fillRect(Xc - lh * 0.13, pb, lh * 0.26, Math.max(0, G.platenBottom + lh * 0.5 - pb));
    rr(c0 - 0.4 * lh, pb - 0.12 * lh, (c1 - c0) + 0.8 * lh, 0.42 * lh, 0.12 * lh);
    cx.fillStyle = chromeV(pb - 0.12 * lh, pb + 0.3 * lh); cx.fill();
    const pts = [[xl, y0], [s0, y0], [c0, y0 - Lf], [c1, y0 - Lf], [s1, y0], [xr, y0]];
    const band = (o0, o1) => { cx.beginPath(); pts.forEach(([x, y], i) => (i ? cx.lineTo(x, y + o0) : cx.moveTo(x, y + o0))); for (let i = pts.length - 1; i >= 0; i--) cx.lineTo(pts[i][0], pts[i][1] + o1); cx.closePath(); };
    cx.save(); cx.shadowColor = 'rgba(0,0,0,.55)'; cx.shadowBlur = lh * 0.5; cx.shadowOffsetY = lh * 0.12; band(0, h); cx.fillStyle = '#0d0b0c'; cx.fill(); cx.restore();
    band(h * 0.52, h); cx.fillStyle = '#4a1012'; cx.fill();
    band(0, h * 0.52); cx.fillStyle = '#100e0f'; cx.fill();
    cx.save(); band(0, h); cx.clip(); cx.fillStyle = weave; cx.globalAlpha = 0.6; cx.fillRect(xl, y0 - Lf - 2, xr - xl, h + Lf + 4); cx.restore();
    cx.beginPath(); pts.forEach(([x, y], i) => (i ? cx.lineTo(x, y + 0.5) : cx.moveTo(x, y + 0.5))); cx.strokeStyle = 'rgba(255,255,255,.1)'; cx.lineWidth = 1; cx.stroke();
    for (const hx of [c0 - 0.05 * lh, c1 - 0.25 * lh]) {
      rr(hx, y0 - Lf - 0.16 * lh, 0.3 * lh, 0.34 * lh, 0.08 * lh); cx.fillStyle = chromeH(hx, hx + 0.3 * lh); cx.fill();
      rr(hx, y0 - Lf + h - 0.16 * lh, 0.3 * lh, 0.32 * lh, 0.08 * lh); cx.fill();
    }
  }
  function draw(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, -top * dpr);
    cx.clearRect(0, top, G.W, Hc);
    const sy = shift * 0.26 * G.lh;
    const iy = G.platenBottom - 1;
    const g = cx.createLinearGradient(0, iy, 0, G.H);
    g.addColorStop(0, '#020202'); g.addColorStop(0.25, '#0b0a09'); g.addColorStop(1, '#16130f');
    cx.fillStyle = g; cx.fillRect(0, iy, G.W, G.H - iy);
    const act = new Map(); for (const b of active) act.set(b.i, b);
    for (let i = 0; i < N; i++) if (!act.has(i)) drawBar(i, 0, sy, false);
    for (const b of act.values()) if (b.th < 1.1) drawBar(b.i, b.th, sy, true);
    drawSegment(sy);
    drawCovers();
    drawCardHolder();
    drawRibbon();
    for (const b of act.values()) if (b.th >= 1.1) drawBar(b.i, b.th, sy, true);
    for (const g0 of glints) {
      const p = (t - g0) / 90; if (p < 0 || p > 1) continue;
      const r = G.lh * (0.5 + 0.45 * p), y = G.Yp + sy;
      const gr = cx.createRadialGradient(G.Xc, y, 0, G.Xc, y, r);
      gr.addColorStop(0, `rgba(255,246,225,${(1 - p) * 0.5})`); gr.addColorStop(1, 'rgba(255,246,225,0)');
      cx.fillStyle = gr; cx.fillRect(G.Xc - r, y - r, 2 * r, 2 * r);
    }
  }
  return { layout, fire, update, setShift, upTime, markDirty() { dirty = true; kick(); } };
})();

/* =========================================================================
   Layout — measure the type, derive everything from it
   ========================================================================= */
function layout() {
  G.W = window.innerWidth; G.H = window.innerHeight;
  G.ml = cssNum('--margin-left', 10); G.mr = cssNum('--margin-right', 10);
  G.topLines = cssNum('--top-lines', 6); G.sheetLines = cssNum('--sheet-lines', 66);
  G.bellWarn = cssNum('--bell-warn', 7); G.tabEvery = cssNum('--tab-every', 5);
  const target = clamp(Math.min(G.W * 0.0088, G.H * 0.0138), 7.5, 15.5);
  const fs = target / 0.6;
  root.style.setProperty('--font-size', fs + 'px');
  probe.style.fontSize = fs + 'px';
  if (!probe.textContent) probe.textContent = 'M'.repeat(100);
  const adv = probe.getBoundingClientRect().width / 100;
  G.cw = adv > 1 ? adv : target;
  root.style.setProperty('--char-w', G.cw + 'px');
  G.lh = lhProbe.getBoundingClientRect().height || G.cw * 5 / 3;
  // Column count is read back from the paper's actual rendered width.
  G.cols = Math.round(paperEl.getBoundingClientRect().width / G.cw) || cssNum('--paper-cols', 85);
  G.LM = G.ml; G.RM = G.cols - G.mr; G.bellCol = G.RM - G.bellWarn;
  G.Xc = Math.round(G.W / 2);
  G.Yp = Math.round(G.H * 0.79);
  G.platenTop = G.Yp - 1.6 * G.lh; G.platenH = 4.1 * G.lh; G.platenBottom = G.platenTop + G.platenH;
  const px = (v) => v.toFixed(2) + 'px';
  root.style.setProperty('--yp', px(G.Yp));
  root.style.setProperty('--platen-top', px(G.platenTop));
  root.style.setProperty('--platen-h', px(G.platenH));
  root.style.setProperty('--platen-bottom', px(G.platenBottom));
  root.style.setProperty('--bail-top', px(G.platenTop - 1.02 * G.lh));
  root.style.setProperty('--table-top', px(G.platenTop - Math.max(G.H * 0.2, 7 * G.lh)));
  if (scaleEl.dataset.cols !== String(G.cols)) {
    scaleEl.innerHTML = ''; scaleEl.dataset.cols = G.cols;
    for (let k = 0; k <= G.cols; k += 10) { const s = document.createElement('span'); s.textContent = k; s.style.left = `calc(${k + 0.5} * var(--char-w))`; scaleEl.appendChild(s); }
  }
  buildFilters();
  Mech.layout();
  tweens.delete('carX'); tweens.delete('paperY');
  car.x = X(state.col); applyCar(); setPaperY(PY(state.line));
}

/* =========================================================================
   Persistence
   ========================================================================= */
const KEY = 'typewriter.sheet.v1';
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 1, strikes, line: state.line, col: state.col })); } catch (e) { /* storage unavailable — carry on */ }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && d.v === 1 && Array.isArray(d.strikes)) {
      strikes = d.strikes.filter((s) => Array.isArray(s) && s.length === 9 && typeof s[2] === 'string');
      state.line = Number.isFinite(d.line) ? d.line : 0;
      state.col = Number.isFinite(d.col) ? d.col : 10;
    }
  } catch (e) { strikes = []; }
  maxLine = Math.max(state.line, 0, ...strikes.map((s) => s[0]));
}

/* =========================================================================
   Typing actions
   ========================================================================= */
let lastKeyT = 0, ema = 260;
function cadenceForce() {
  const t = now(), dt = clamp(t - lastKeyT, 40, 900); lastKeyT = t;
  ema = ema * 0.65 + dt * 0.35;
  return clamp(1.22 - (ema - 70) / 520, 0.72, 1.22) * rand(0.94, 1.06);
}
function crossBell(prev, next, delay) { if (prev < G.bellCol && next >= G.bellCol) Sound.bell(delay); }
function locked() { Sound.locked(); recoil(0.6); }

function typeChar(ch) {
  hideHint();
  if (state.col >= G.RM || state.col < 0) { locked(); return; }   // keys lock at the right margin
  const f = cadenceForce(), bar = barIndex(ch), up = Mech.upTime(f);
  const l = state.line, c = state.col;
  const s = makeStrike(l, c, ch, f);
  strikes.push(s); maxLine = Math.max(maxLine, l);
  Sound.key(f, barPan(bar), barBias(bar), up / 1000);
  Mech.fire(bar, f, up, () => { renderStrike(s); recoil(f); });
  const prev = state.col; state.col++;
  scheduleStep(up + 14, 56, ease.outBack);        // carriage escapes one tooth as the bar falls away
  crossBell(prev, state.col, up / 1000 + 0.035);
  save();
}
function space() {
  hideHint();
  if (state.col >= G.RM) { locked(); return; }
  const f = cadenceForce();
  Sound.space(f);
  const prev = state.col; state.col++;
  scheduleStep(30, 64, ease.outBack);
  crossBell(prev, state.col, 0.05);
  save();
}
function backspace() {
  if (state.col <= 0) { locked(); return; }
  Sound.backspace();
  state.col--;
  scheduleStep(18, 60, ease.outBack);
  save();
}
function nudge(d) {
  const next = state.col + d;
  if (next < 0 || next > G.RM) { locked(); return; }
  Sound.nudge();
  const prev = state.col; state.col = next;
  scheduleStep(10, 95, ease.outCubic);
  if (d > 0) crossBell(prev, next, 0.03);
  save();
}
function rollPlaten(d) {
  const next = state.line + d;
  if (next < -(G.topLines - 1)) { locked(); return; }
  Sound.knob();
  state.line = next; maxLine = Math.max(maxLine, next); updatePaperLen();
  tween('paperY', paperY, PY(state.line), 110, ease.outCubic, setPaperY);
  save();
}
function slideTo(col) {
  col = clamp(col, 0, G.RM);
  const n = Math.abs(col - state.col);
  if (!n) { Sound.nudge(); return; }
  carEpoch++;
  const prev = state.col; state.col = col;
  const dur = 110 + 3.2 * n;
  Sound.slide(n, dur / 1000);
  crossBell(prev, col, dur / 2000);
  tween('carX', car.x, X(col), dur, ease.inOutCubic, setCarX);
  save();
}
function lineEnd() {
  let m = -1; for (const s of strikes) if (s[0] === state.line && s[1] > m) m = s[1];
  return m >= 0 ? m + 1 : G.LM;
}
function tab() {
  const st = G.tabEvery;
  let next = state.col < G.LM ? G.LM : G.LM + st * (Math.floor((state.col - G.LM) / st) + 1);
  next = Math.min(next, G.RM);
  const n = next - state.col;
  if (n <= 0) { locked(); return; }
  carEpoch++; const ep = carEpoch;
  const prev = state.col; state.col = next;
  const dur = 45 + n * 9;
  Sound.tab(n, dur / 1000, 0.012, TAB_EASE);
  crossBell(prev, next, 0.012 + dur / 1000 * invert(TAB_EASE, (G.bellCol - prev) / n));
  setTimeout(() => {
    if (ep !== carEpoch) return;
    const to = X(next);
    tween('carX', car.x, to, dur, TAB_EASE, setCarX, () => rebound(to, -Math.min(G.cw * 0.12, 0.8 + n * 0.1), 140));
  }, 12);
  save();
}
function carriageReturn() {
  hideHint();
  carEpoch++; const ep = carEpoch;
  const n = Math.max(0, state.col - G.LM);
  const dur = n > 0 ? 95 + 3.4 * n : 0;
  const travelDelay = 55;
  Sound.carriageReturn(n, dur / 1000, travelDelay / 1000, RETURN_EASE);
  if (leverEl.animate && !reduceMotion) {
    const total = travelDelay + dur + 140;
    leverEl.animate([
      { transform: 'rotate(-24deg)' }, { transform: 'rotate(-13deg)', offset: travelDelay / total },
      { transform: 'rotate(-13deg)', offset: (travelDelay + dur) / total }, { transform: 'rotate(-27deg)', offset: (travelDelay + dur + 50) / total },
      { transform: 'rotate(-24deg)' },
    ], { duration: total, easing: 'ease-out' });
  }
  // 1) the lever first indexes the platen one line…
  state.line++; maxLine = Math.max(maxLine, state.line); updatePaperLen();
  tween('paperY', paperY, PY(state.line), 85, ease.outCubic, setPaperY);
  // 2) …then drives the carriage home into the margin stop.
  const target = G.LM; state.col = target;
  setTimeout(() => {
    if (ep !== carEpoch) return;
    const to = X(target);
    if (n > 0) {
      tween('carX', car.x, to, dur, RETURN_EASE, setCarX, () => {
        rebound(to, Math.min(G.cw * 0.3, 1.2 + n * 0.05));
        shudder(0.35 + 0.65 * Math.min(1, n / 40));
      });
    } else {
      tween('carX', car.x, to, 60, ease.outCubic, setCarX);
      shudder(0.2);
    }
  }, travelDelay);
  save();
}

/* =========================================================================
   Sheet management & export
   ========================================================================= */
function clearInk() { inkEl.innerHTML = ''; lineEls.clear(); }
function newSheet() {
  if (busy) return;
  busy = true; closeMenu();
  const outDur = 560;
  Sound.paperOut(outDur / 1000);
  const sheetH = G.lh * Math.max(G.sheetLines, G.topLines + maxLine + 40);
  tween('paperY', paperY, -sheetH - 40, outDur, ease.inCubic, setPaperY, () => {
    clearInk(); strikes = []; maxLine = 0; state.line = 0; wear = 0;
    updatePaperLen(); save();
    setPaperY(G.platenBottom + 4);
    const inDur = 820;
    Sound.paperIn(inDur / 1000);
    tween('paperY', paperY, PY(0), inDur, ease.inOutCubic, setPaperY, () => { busy = false; });
    if (state.col !== G.LM) slideTo(G.LM);
  });
}
function buildText() {
  const rows = new Map();
  for (const s of strikes) { let r = rows.get(s[0]); if (!r) rows.set(s[0], (r = [])); r[s[1]] = s[2]; }   // last strike in a cell wins
  if (!rows.size) return '';
  const ls = [...rows.keys()], minL = Math.min(...ls), maxL = Math.max(...ls);
  let minC = Infinity;
  rows.forEach((r) => r.forEach((ch, c) => { if (ch && ch.trim()) minC = Math.min(minC, c); }));
  const strip = Math.min(minC, G.LM);
  const out = [];
  for (let l = minL; l <= maxL; l++) {
    const r = rows.get(l) || []; let s = '';
    for (let c = strip; c < r.length; c++) s += r[c] || ' ';
    out.push(s.replace(/\s+$/, ''));
  }
  return out.join('\n').replace(/\n+$/, '') + '\n';
}
function exportDoc() {
  const txt = buildText();
  if (!txt) { toast('The sheet is blank'); return; }
  const d = new Date(), pad = (n) => String(n).padStart(2, '0');
  const name = `typewritten-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.txt`;
  try {
    const url = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('Exported ' + name);
  } catch (e) { toast('Export failed'); }
  closeMenu();
}

/* =========================================================================
   UI: menu, hint, toast
   ========================================================================= */
const menuEl = $('#menu'), menuBtn = $('#menuBtn'), hintEl = $('#hint'), toastEl = $('#toast'), soundLbl = $('#soundLbl');
let menuOpen = false, confirmNew = 0, toastT = 0;
function openMenu() { menuOpen = true; menuEl.classList.add('open'); menuBtn.classList.add('on'); menuEl.setAttribute('aria-hidden', 'false'); resetNew(); }
function closeMenu() { menuOpen = false; menuEl.classList.remove('open'); menuBtn.classList.remove('on'); menuEl.setAttribute('aria-hidden', 'true'); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function toggleMenu() { menuOpen ? closeMenu() : openMenu(); }
function resetNew() { confirmNew = 0; const b = menuEl.querySelector('[data-act="new"]'); b.classList.remove('warn'); b.querySelector('.lbl').textContent = 'New Sheet'; b.querySelector('.sub').textContent = 'Pull this page, feed a fresh one'; }
function hideHint() { hintEl.classList.add('gone'); }
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2200); }
function refreshSoundLbl() { soundLbl.textContent = 'Sound: ' + (Sound.enabled ? 'On' : 'Off'); }

menuBtn.addEventListener('click', (e) => { e.stopPropagation(); Sound.init(); toggleMenu(); });
menuEl.addEventListener('click', (e) => {
  e.stopPropagation();
  const b = e.target.closest('.item'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'new') {
    if (!strikes.length || confirmNew) { resetNew(); newSheet(); return; }
    confirmNew = 1; b.classList.add('warn'); b.querySelector('.lbl').textContent = 'Discard this sheet?'; b.querySelector('.sub').textContent = 'Click again to confirm';
    setTimeout(() => { if (confirmNew) resetNew(); }, 3500);
  } else if (act === 'export') exportDoc();
  else if (act === 'sound') { Sound.setEnabled(!Sound.enabled); refreshSoundLbl(); }
});
document.addEventListener('pointerdown', (e) => { Sound.init(); if (menuOpen && !menuEl.contains(e.target) && e.target !== menuBtn) closeMenu(); });

/* =========================================================================
   Keyboard
   ========================================================================= */
let lastRepeatT = 0;
window.addEventListener('keydown', (e) => {
  Sound.init();
  const k = e.key;
  if (k === 'Escape') { e.preventDefault(); toggleMenu(); return; }
  if (menuOpen) return;
  if (e.metaKey || (e.ctrlKey && !e.altKey)) return;            // leave browser shortcuts alone
  const printable = [...k].length === 1;
  const handled = printable || ['Enter', 'Backspace', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(k);
  if (handled) e.preventDefault();
  if (k === 'Shift') { if (!e.repeat) { Mech.setShift(1); Sound.shift(true); } return; }
  if (busy || !handled) return;
  if (e.repeat) {                                                 // a manual machine doesn't auto-repeat type
    if (!['Backspace', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) return;
    const t = now(); if (t - lastRepeatT < 70) return; lastRepeatT = t;
  }
  switch (k) {
    case 'Enter': carriageReturn(); return;
    case 'Backspace': backspace(); return;
    case 'Tab': tab(); return;
    case 'ArrowLeft': nudge(-1); return;
    case 'ArrowRight': nudge(1); return;
    case 'ArrowUp': rollPlaten(-1); return;
    case 'ArrowDown': rollPlaten(1); return;
    case 'Home': slideTo(G.LM); return;
    case 'End': slideTo(lineEnd()); return;
  }
  if (k === ' ') { space(); return; }
  if (printable) typeChar(k);
});
window.addEventListener('keyup', (e) => { if (e.key === 'Shift') { Mech.setShift(0); Sound.shift(false); } });
window.addEventListener('blur', () => Mech.setShift(0));

/* =========================================================================
   Boot
   ========================================================================= */
genTextures();
load();
refreshSoundLbl();
layout();
updatePaperLen();
for (const s of strikes) renderStrike(s);
if (strikes.length) hideHint();
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
if (document.fonts) {
  document.fonts.ready.then(layout).catch(() => {});
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', layout);
}
})();
</script>
</body>
