etter-spacing: 0; font-weight: 500; }\n  #ideaList { flex: 1; overflow-y: auto; padding: 10px 12px 60px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }\n  .idea { background: var(--card); border: 1px dashed rgba(245,158,11,0.5); border-radius: 8px; padding: 9px 10px; cursor: pointer; }\n  .idea .i-top { display: flex; gap: 6px; align-items: flex-start; }\n  .idea .grab { touch-action: none; cursor: grab; color: var(--faint); padding: 2px 6px; font-size: 1.1rem; line-height: 1; border: none; background: none; }\n  .idea .i-title { flex: 1; font-weight: 600; font-size: 0.88rem; line-height: 1.35; padding-top: 2px; }\n  .idea .i-sum { font-size: 0.78rem; color: var(--muted); margin: 4px 0 0 30px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }\n  .idea .i-foot { display: flex; gap: 6px; margin: 8px 0 0 30px; align-items: center; flex-wrap: wrap; }\n  .idea .i-foot .when { margin-left: auto; font-size: 0.68rem; color: var(--faint); }\n  .it-empty { color: var(--faint); font-size: 0.82rem; line-height: 1.55; padding: 14px 4px; }\n  #ghost { position: fixed; z-index: 400; pointer-events: none; display: none; width: 240px; padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--accent); box-shadow: 0 12px 32px rgba(0,0,0,0.6); font-weight: 600; font-size: 0.86rem; transform: translate(-50%, -50%) rotate(-2deg); }\n  #viewport.drop-target { outline: 2px dashed var(--accent); outline-offset: -6px; }\n\n  /* ---------- Card menu (⋯ button, or hold a card) ---------- */\n  #cardMenu { position: fixed; z-index: 320; display: none; flex-direction: column; min-width: 230px; padding: 5px; background: var(--card); border: 1px solid var(--border-hi); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); }\n  #cardMenu.open { display: flex; }\n  #cardMenu > button { background: none; border: none; text-align: left; padding: 10px 12px; font-size: 0.86rem; }\n  #cardMenu > button:hover { background: rgba(255,255,255,0.06); }\n  #cardMenu .sep { height: 1px; background: var(--border); margin: 4px 0; }\n  #cardMenu .seg3 { padding: 4px 6px; }\n  #cardMenu .seg3 button { font-size: 0.72rem; }\n\n  /* ---------- Touch screens (iPad): bigger targets, controls that don't depend on hover ---------- */\n  #viewport { touch-action: none; -webkit-touch-callout: none; }\n  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  @media (pointer: coarse) {\n    #toolbar { height: 56px; }\n    #viewport { top: 56px; height: calc(100vh - 56px); }\n    #ideaTray { top: 56px; }\n    button { min-height: 42px; padding: 8px 14px; font-size: 0.86rem; }\n    select, #statusFilter { min-height: 42px; font-size: 16px; }\n    input[type=\"text\"], textarea { font-size: 16px; }\n    .icon-btn { min-width: 40px; min-height: 40px; }\n    .card .menu-btn { opacity: 1; min-height: 34px; min-width: 40px; }\n    .handle { opacity: 0.9; width: 28px; height: 28px; right: -15px; border-width: 3px; }\n    .card.selected .handle { opacity: 1; }\n    .hud button { width: 46px; height: 46px; }\n    #colHeads .grip { width: 24px; }\n    #rowHeads .grip { height: 24px; }\n    .tb-note { display: none; }\n    .hint-mouse { display: none; }\n    .hint-touch { display: inline; }\n    #cardMenu > button { padding: 13px 14px; font-size: 0.95rem; }\n    .idea .grab { padding: 8px 10px; font-size: 1.3rem; }\n    .seg3 button { min-height: 44px; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<header id=\"toolbar\">\n  <button class=\"primary\" id=\"btnNew\">+ New Scene<\/button>\n  <button id=\"btnIdeas\" title=\"The Idea Bin: ideas that aren't on the board yet. Write, dictate or record them.\">💡 Ideas<span id=\"ideaCount\" class=\"count-badge\"><\/span><\/button>\n  <span class=\"divider\"><\/span>\n  <button id=\"btnUndo\" title=\"Undo (Ctrl+Z)\" disabled>↶ Undo<\/button>\n  <button id=\"btnRedo\" title=\"Redo (Ctrl+Y)\" disabled>↷ Redo<\/button>\n  <span class=\"divider\"><\/span>\n  <button id=\"btnLanes\" title=\"Set up vertical and horizontal swim lanes\">▦ Lanes<\/button>\n  <button id=\"btnSnap\" title=\"Move every scene into the lane that matches its POV / location\">⇲ Snap to Lanes<\/button>\n  <button id=\"btnNumbers\" title=\"Show each scene's number in story order (top to bottom)\"># Numbers<\/button>\n  <button id=\"btnKeystones\" title=\"Highlight the keystone scenes and fade the rest\">◆ Keystones<\/button>\n  <select id=\"statusFilter\" title=\"Fade the scenes that don't have this status\" aria-label=\"Show status\"><option value=\"\">All statuses<\/option><option value=\"open\">Open only<\/option><option value=\"leaning\">Leaning only<\/option><option value=\"locked\">Locked only<\/option><\/select>\n  <span class=\"divider\"><\/span>\n  <button class=\"success\" id=\"btnExport\" title=\"Export the outline as Word or PDF\">Export<\/button>\n  <span class=\"spacer\"><\/span>\n  <span class=\"tb-note\">Story order follows your acts and sequences. Change it in Beats or Write.<\/span>\n<\/header>\n\n<main id=\"viewport\">\n  <div id=\"world\">\n    <div id=\"lanes\"><\/div>\n    <svg id=\"links\">\n      <defs>\n        <marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 1.5 L8 5 L0 8.5z\" fill=\"#8892a8\"/><\/marker>\n        <marker id=\"arrowHot\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 1.5 L8 5 L0 8.5z\" fill=\"#38bdf8\"/><\/marker>\n      <\/defs>\n      <g id=\"linkGroup\"><\/g>\n      <path id=\"draft\" marker-end=\"url(#arrowHot)\"/>\n    <\/svg>\n    <div id=\"cards\"><\/div>\n  <\/div>\n  <div id=\"colHeads\"><\/div>\n  <div id=\"rowHeads\"><\/div>\n  <div id=\"corner\" title=\"Edit lanes\">▦ Lanes<\/div>\n  <div id=\"empty\"><strong>No scenes on the board yet.<\/strong><br>Double-click or double-tap anywhere to add one, or use <strong>+ New Scene<\/strong>.<br>Ideas that aren't placed yet live in <strong>💡 Ideas<\/strong>.<\/div>\n<\/main>\n\n<div id=\"marquee\"><\/div>\n<div id=\"toast\"><\/div>\n\n<div class=\"hint\"><span class=\"hint-mouse\">Double-click: new scene · Drag blue dot: link · Shift+drag: select · Scroll: pan · Ctrl+scroll: zoom · Ctrl+1/2/3: Board, Beats, Write<\/span><span class=\"hint-touch\">Double-tap: new scene or edit · Hold a card: menu · Drag blue dot: link · Pencil on empty board: select · Pinch: zoom<\/span><\/div>\n<div class=\"hud\">\n  <button id=\"btnZoomOut\" title=\"Zoom out\">−<\/button>\n  <span id=\"zoomText\">100%<\/span>\n  <button id=\"btnZoomIn\" title=\"Zoom in\">+<\/button>\n  <button id=\"btnFit\" title=\"Fit all scenes in view\">⤢<\/button>\n<\/div>\n\n<\!-- Scene editor: a panel on the right -->\n<div class=\"overlay\" id=\"sceneModal\">\n  <div class=\"modal\" role=\"dialog\" aria-labelledby=\"sceneHeading\">\n    <div class=\"modal-head\"><h3 id=\"sceneHeading\">New Scene<\/h3><button data-close>Cancel<\/button><button class=\"primary\" id=\"btnSaveScene\" title=\"Ctrl+Enter\">Save<\/button><\/div>\n    <div class=\"modal-body\">\n      <label>Scene Title<input type=\"text\" id=\"fTitle\" placeholder=\"e.g. The Ambush at the River Sidon\" autocomplete=\"off\"><\/label>\n      <div><label style=\"margin-bottom:6px\">Status<\/label>\n        <div class=\"seg3\" id=\"fStatus\"><button type=\"button\" data-st=\"open\">OPEN<\/button><button type=\"button\" data-st=\"leaning\">LEANING<\/button><button type=\"button\" data-st=\"locked\">🔒 LOCKED<\/button><\/div>\n      <\/div>\n      <div id=\"lockRow\">\n        <div class=\"lockinfo\" id=\"lockInfo\"><\/div>\n        <label>Lock note <span class=\"sub\">Who decided it, or where it's from (optional)<\/span><input type=\"text\" id=\"fLockNote\" placeholder=\"e.g. Alex, Oct 24\" autocomplete=\"off\"><\/label>\n      <\/div>\n      <label>Story date <span class=\"sub\">When it happens in the story<\/span><input type=\"text\" id=\"fDate\" placeholder=\"e.g. c. 63 BC, or RJ 18\" autocomplete=\"off\"><\/label>\n      <div class=\"row\">\n        <label>POV Character<input type=\"text\" id=\"fPov\" list=\"povList\" autocomplete=\"off\" placeholder=\"e.g. Coriantumr\"><\/label>\n        <label>Location<input type=\"text\" id=\"fLoc\" list=\"locList\" autocomplete=\"off\" placeholder=\"e.g. Zarahemla\"><\/label>\n      <\/div>\n      <label>Objective <span class=\"sub\">What must this scene accomplish?<\/span><textarea id=\"fObj\" rows=\"2\" placeholder=\"e.g. Force Moroni to choose between the city and the record\"><\/textarea><\/label>\n      <label>Summary<textarea id=\"fSum\" placeholder=\"What happens, what's in conflict, how it ends…\"><\/textarea><\/label>\n      <div class=\"memo-box\" id=\"memoBox\" hidden><button class=\"play\" id=\"btnMemoPlay\" title=\"Play the voice memo\">▶<\/button><span id=\"memoInfo\" style=\"flex:1\"><\/span><button class=\"danger\" id=\"btnMemoRemove\" title=\"Remove the voice memo from this scene\">Remove<\/button><\/div>\n      <label class=\"check\" title=\"A scene the rest of the story is built around\"><input type=\"checkbox\" id=\"fKey\"> Keystone <span class=\"sub\" style=\"font-size:0.74rem\">— a scene the story is built around<\/span><\/label>\n      <label>Filed in <span class=\"sub\">Act and sequence. Unfiled scenes come after the filed ones.<\/span><select id=\"fFile\"><\/select><\/label>\n      <label class=\"check\" title=\"Ideas sit in the Idea Bin: they're not on the board, get no number and are left out of the export\"><input type=\"checkbox\" id=\"fWip\"> In the Idea Bin <span class=\"sub\" style=\"font-size:0.74rem\">— not on the board yet; no number, left out of the export<\/span><\/label>\n      <datalist id=\"povList\"><\/datalist>\n      <datalist id=\"locList\"><\/datalist>\n    <\/div>\n    <div class=\"modal-foot\">\n      <button class=\"danger\" id=\"btnDeleteScene\">Delete<\/button>\n      <button id=\"btnOpenBeats\" title=\"Save and open this scene's beats\">Beats ↗<\/button>\n      <span class=\"spacer\"><\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- The Idea Bin -->\n<aside id=\"ideaTray\" aria-label=\"Idea Bin\">\n  <div class=\"it-head\"><h3>💡 Idea Bin<\/h3><button class=\"icon-btn\" id=\"btnIdeasClose\" aria-label=\"Close the Idea Bin\">✕<\/button><\/div>\n  <div class=\"it-cap\">\n    <textarea id=\"ideaText\" placeholder=\"Write, Scribble or dictate an idea. The first line becomes its title.\"><\/textarea>\n    <div class=\"it-row\"><button class=\"primary\" id=\"btnAddIdea\">+ Add idea<\/button><button id=\"btnRec\" title=\"Record a voice memo\">🎙 Record<\/button><\/div>\n    <div id=\"recBox\" role=\"status\">\n      <div class=\"rec-top\"><span class=\"rec-dot\"><\/span><span id=\"recTime\">0:00<\/span><button id=\"btnRecCancel\">Discard<\/button><button class=\"primary\" id=\"btnRecStop\">■ Stop &amp; save<\/button><\/div>\n      <div id=\"recText\"><\/div>\n      <div class=\"lockinfo\" id=\"recNote\"><\/div>\n    <\/div>\n    <label class=\"rec-opt\" id=\"recLiveRow\"><input type=\"checkbox\" id=\"recLive\" checked> Turn speech into text while recording (if this device can)<\/label>\n  <\/div>\n  <div id=\"ideaList\"><\/div>\n<\/aside>\n<div id=\"ghost\"><\/div>\n\n<\!-- Card menu -->\n<div id=\"cardMenu\" role=\"menu\">\n  <button data-do=\"edit\">✎ Edit details<\/button>\n  <div class=\"seg3\"><button type=\"button\" data-st=\"open\">OPEN<\/button><button type=\"button\" data-st=\"leaning\">LEANING<\/button><button type=\"button\" data-st=\"locked\">🔒 LOCKED<\/button><\/div>\n  <button data-do=\"keystone\">◆ Keystone<\/button>\n  <button data-do=\"link\">→ Link to another scene…<\/button>\n  <button data-do=\"bin\">💡 Move to the Idea Bin<\/button>\n  <button data-do=\"beats\" class=\"desk\">Open beats ↗<\/button>\n  <button data-do=\"write\" class=\"desk\">Write this scene ↗<\/button>\n  <div class=\"sep\"><\/div>\n  <button data-do=\"delete\" style=\"color:#fb7185\">Delete scene<\/button>\n<\/div>\n\n<\!-- Link editor -->\n<div class=\"overlay\" id=\"linkModal\">\n  <div class=\"modal\" style=\"width:400px\">\n    <div class=\"modal-head\"><h3>Scene Link<\/h3><button class=\"icon-btn\" data-close>✕<\/button><\/div>\n    <div class=\"modal-body\">\n      <div class=\"link-route\" id=\"linkRoute\"><\/div>\n      <label>How are they connected? <span class=\"sub\">(optional)<\/span><input type=\"text\" id=\"fLinkLabel\" placeholder=\"e.g. causes, sets up, pays off, foreshadows\"><\/label>\n    <\/div>\n    <div class=\"modal-foot\">\n      <button class=\"danger\" id=\"btnDeleteLink\">Delete Link<\/button>\n      <span class=\"spacer\"><\/span>\n      <button id=\"btnReverseLink\" title=\"Flip the arrow direction\">⇄ Reverse<\/button>\n      <button class=\"primary\" id=\"btnSaveLink\">Save<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- Lanes editor -->\n<div class=\"overlay\" id=\"lanesModal\">\n  <div class=\"modal\" style=\"width:600px\">\n    <div class=\"modal-head\"><h3>Swim Lanes<\/h3><button class=\"icon-btn\" data-close>✕<\/button><\/div>\n    <div class=\"modal-body\" id=\"lanesBody\"><\/div>\n    <div class=\"modal-foot\">\n      <span class=\"help\" style=\"align-self:center\">Ctrl+Z undoes lane changes.<\/span>\n      <span class=\"spacer\"><\/span>\n      <button data-close>Cancel<\/button>\n      <button class=\"primary\" id=\"btnSaveLanes\">Save Lanes<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- Export -->\n<div class=\"overlay\" id=\"exportModal\">\n  <div class=\"modal\" style=\"width:520px\">\n    <div class=\"modal-head\"><h3>Export Outline<\/h3><button class=\"icon-btn\" data-close>✕<\/button><\/div>\n    <div class=\"modal-body\">\n      <label>Document Title<input type=\"text\" id=\"expTitle\" value=\"Keepers of the Word — Scene Outline\"><\/label>\n      <div class=\"seg\" id=\"expFormat\">\n        <button data-fmt=\"docx\" class=\"on\">Word (.docx)<\/button>\n        <button data-fmt=\"pdf\">PDF<\/button>\n      <\/div>\n      <label class=\"check\"><input type=\"checkbox\" id=\"expLinks\" checked> Include scene links<\/label>\n      <div>\n        <div class=\"help\" style=\"margin-bottom:6px\">Story order, by act and sequence. Reorder scenes in Beats or Write.<\/div>\n        <div class=\"order-list\" id=\"orderList\"><\/div>\n      <\/div>\n      <p class=\"help\" id=\"pdfNote\" style=\"display:none\">PDF opens Chrome's print window — choose <b>Save as PDF<\/b> as the destination.<\/p>\n    <\/div>\n    <div class=\"modal-foot\">\n      <span class=\"spacer\"><\/span>\n      <button data-close>Cancel<\/button>\n      <button class=\"success\" id=\"btnDoExport\">Export<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ---------- The shared story ----------\n   Every scene, link and lane lives in the studio's one shared save. This view reads it and reports changes. */\nconst Story = parent.Story, Shell = parent.Shell;\nconst IPAD = parent.APP_MODE === 'ipad';   // the iPad app has only the Board\nconst CARD_W = 280;\nconst COL_W = 340, ROW_H = 300, LANE_MIN = 140;\nconst PAD = 30, GAP = 24;\nconst AXES = ['cols', 'rows'];\nconst TYPE_NAMES = { off: 'Off', pov: 'POV Character', location: 'Location', custom: 'Custom' };\n\nconst emptyLanes = () => ({ cols: { type: 'off', label: '', items: [] }, rows: { type: 'off', label: '', items: [] } });\n// \"board\" is a window onto the story: archived scenes stay off the board\nconst board = {\n  // only the book you're working on\n  get cards() { const b = Story.bookId; return Story.data.scenes.filter(s => !s.archived && s.bookId === b); },\n  // on the board itself (ideas wait in the Idea Bin)\n  get placed() { return this.cards.filter(s => !s.wip); },\n  get links() { return Story.data.links; }, set links(v) { Story.data.links = v; },\n  get lanes() { return Story.data.lanes; }, set lanes(v) { Story.data.lanes = v; },\n  get view() { return Story.data.board.view; }, set view(v) { Story.data.board.view = v; },\n  get showNumbers() { return Story.data.board.showNumbers; }, set showNumbers(v) { Story.data.board.showNumbers = v; }\n};\nlet selected = new Set();\nlet undoStack = [], redoStack = [];\nlet drag = null, staleWhileDragging = false;\nlet editingCardId = null, pendingPos = null, pendingPrefill = null, editingLinkId = null;\nlet laneDraft = null;\nlet exportFormat = 'docx';\nlet keystonesOnly = false;\nlet statusOnly = '';\n\nconst $ = (id) => document.getElementById(id);\nconst viewport = $('viewport'), world = $('world'), cardsEl = $('cards'), linkGroup = $('linkGroup'), draft = $('draft'), lanesEl = $('lanes');\n\n/* ---------- Helpers ---------- */\nconst uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\nconst str = (v) => (v === null || v === undefined) ? '' : String(v).trim();\nconst num = (v, d = 0) => Number.isFinite(Number(v)) ? Number(v) : d;\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst getCard = (id) => board.cards.find(c => c.id === id);\nconst stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');\nconst clone = (o) => JSON.parse(JSON.stringify(o));\nconst same = (a, b) => (a || '').toLowerCase() === (b || '').toLowerCase();\n\nfunction download(data, name, type = 'application/json') {\n  const blob = data instanceof Blob ? data : new Blob([data], { type });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 2000);\n}\n\nlet toastTimer = null;\nfunction toast(msg, withUndo) {\n  const t = $('toast');\n  t.innerHTML = `<span>${esc(msg)}<\/span>` + (withUndo ? '<button id=\"toastUndo\">Undo<\/button>' : '');\n  t.style.display = 'flex';\n  if (withUndo) $('toastUndo').onclick = () => { undo(); t.style.display = 'none'; };\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);\n}\n\n/* ---------- Data ---------- */\nfunction normLanes(L) {\n  const axis = (a, def) => {\n    const type = ['off', 'pov', 'location', 'custom'].includes(a?.type) ? a.type : 'off';\n    const items = (Array.isArray(a?.items) ? a.items : [])\n      .filter(i => i && str(i.name))\n      .map(i => ({ id: String(i.id || 'ln-' + uid()), name: str(i.name), size: Math.max(LANE_MIN, num(i.size, def)) }));\n    return { type, label: str(a?.label), items };\n  };\n  const out = { cols: axis(L?.cols, COL_W), rows: axis(L?.rows, ROW_H) };\n  if (out.cols.type === out.rows.type && (out.cols.type === 'pov' || out.cols.type === 'location')) out.rows.type = 'custom';\n  return out;\n}\n\n// Positions and view changes only matter to the board; structural changes matter to every view.\nfunction save(info = {}) { Story.changed('board', info); }\nfunction saveView() { Story.changed('board', { view: true }); }\n\n/* ---------- Undo / redo ----------\n   A snapshot keeps each scene (with its beats) plus the board fields that can change here.\n   Changes made in another view clear the history so an undo here can't wipe them out. */\nconst FIELDS = ['title', 'pov', 'location', 'objective', 'summary', 'wip', 'keystone', 'x', 'y', 'seqId', 'bookId', 'archived', 'status', 'storyDate', 'lock', 'lockLog', 'memo'];\nfunction snapshot() {\n  return {\n    scenes: Story.data.scenes.map(sc => ({ ref: sc, f: Object.fromEntries(FIELDS.map(k => [k, sc[k]])) })),\n    links: JSON.parse(JSON.stringify(Story.data.links)),\n    lanes: JSON.parse(JSON.stringify(Story.data.lanes))\n  };\n}\nfunction commit(before) {\n  undoStack.push(before || snapshot());\n  if (undoStack.length > 80) undoStack.shift();\n  redoStack = [];\n  updateUndo();\n}\nfunction restore(snap) {\n  Story.data.scenes = snap.scenes.map(({ ref, f }) => Object.assign(ref, f));\n  Story.data.links = snap.links;\n  Story.data.lanes = normLanes(snap.lanes);\n  Story.sortAll();\n  selected = new Set([...selected].filter(id => getCard(id)));\n  render(); save({ structure: true, order: true });\n}\nfunction undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); updateUndo(); }\nfunction redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); updateUndo(); }\nfunction updateUndo() { $('btnUndo').disabled = !undoStack.length; $('btnRedo').disabled = !redoStack.length; }\n\n/* ---------- View ---------- */\nfunction applyView() {\n  const v = board.view;\n  world.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.zoom})`;\n  $('zoomText').textContent = Math.round(v.zoom * 100) + '%';\n  renderHeads();\n}\nfunction toWorld(cx, cy) {\n  const r = viewport.getBoundingClientRect(), v = board.view;\n  return { x: (cx - r.left - v.x) / v.zoom, y: (cy - r.top - v.y) / v.zoom };\n}\nfunction zoomAt(factor, cx, cy) {\n  const r = viewport.getBoundingClientRect(), v = board.view;\n  const mx = (cx ?? r.left + r.width / 2) - r.left, my = (cy ?? r.top + r.height / 2) - r.top;\n  const z = Math.min(2.5, Math.max(0.2, v.zoom * factor));\n  v.x = mx - (mx - v.x) * (z / v.zoom);\n  v.y = my - (my - v.y) * (z / v.zoom);\n  v.zoom = z;\n  applyView(); saveView();\n}\nfunction fitView() {\n  if (!board.placed.length) { board.view = { x: 160, y: 60, zoom: 1 }; applyView(); saveView(); return; }\n  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;\n  board.placed.forEach(c => { const s = size(c); x1 = Math.min(x1, c.x); y1 = Math.min(y1, c.y); x2 = Math.max(x2, c.x + s.w); y2 = Math.max(y2, c.y + s.h); });\n  if (axisOn('cols')) { x1 = Math.min(x1, 0); x2 = Math.max(x2, totalSize('cols')); }\n  if (axisOn('rows')) { y1 = Math.min(y1, 0); y2 = Math.max(y2, totalSize('rows')); }\n  const padL = axisOn('rows') ? 160 : 60, padT = axisOn('cols') ? 50 : 40;\n  const W = viewport.clientWidth - padL - 40, H = viewport.clientHeight - padT - 60;\n  const z = Math.max(0.2, Math.min(W / (x2 - x1), H / (y2 - y1), 1.2));\n  board.view = { zoom: z, x: padL - x1 * z, y: padT - y1 * z };\n  applyView(); saveView();\n}\n\n/* ---------- Swim lane geometry ---------- */\nconst fieldOf = (axis) => ['pov', 'location'].includes(board.lanes[axis].type) ? board.lanes[axis].type : null;\nconst axisOn = (axis) => board.lanes[axis].type !== 'off' && board.lanes[axis].items.length > 0;\nconst totalSize = (axis) => board.lanes[axis].items.reduce((s, l) => s + l.size, 0);\nfunction laneStarts(axis) {\n  let p = 0;\n  return board.lanes[axis].items.map(l => { const o = { l, start: p, end: p + l.size }; p += l.size; return o; });\n}\nfunction laneIndexAt(axis, v) {\n  if (!axisOn(axis)) return -1;\n  return laneStarts(axis).findIndex(o => v >= o.start && v < o.end);\n}\n// The point of a card used to decide which lane it sits in\nconst ax = (c) => c.x + CARD_W / 2;\nconst ay = (c) => c.y + 40;\n\n// Moving a card sets its POV / location from the lanes it lands in\nfunction assignFromPosition(c, onlyBlank) {\n  if (c.wip) return; // WIP scenes are never changed by lanes\n  AXES.forEach(axis => {\n    const f = fieldOf(axis);\n    if (!f || (onlyBlank && c[f])) return;\n    const i = laneIndexAt(axis, axis === 'cols' ? ax(c) : ay(c));\n    if (i >= 0) c[f] = board.lanes[axis].items[i].name;\n  });\n}\n\n// Remember where each card sits inside its lanes, so lanes can be resized/reordered without losing scenes\nfunction captureCells() {\n  const m = new Map();\n  const cs = laneStarts('cols'), rs = laneStarts('rows');\n  board.cards.forEach(c => {\n    const ci = laneIndexAt('cols', ax(c)), ri = laneIndexAt('rows', ay(c));\n    m.set(c.id, {\n      col: ci >= 0 ? cs[ci].l.id : null, dx: ci >= 0 ? c.x - cs[ci].start : 0,\n      row: ri >= 0 ? rs[ri].l.id : null, dy: ri >= 0 ? c.y - rs[ri].start : 0\n    });\n  });\n  return m;\n}\nfunction reapplyCells(m) {\n  const cs = new Map(laneStarts('cols').map(o => [o.l.id, o]));\n  const rs = new Map(laneStarts('rows').map(o => [o.l.id, o]));\n  board.cards.forEach(c => {\n    const r = m.get(c.id);\n    if (!r) return;\n    if (r.col) {\n      const o = cs.get(r.col);\n      if (o) c.x = Math.round(o.start + Math.min(r.dx, Math.max(0, o.l.size - CARD_W)));\n      else c.x = totalSize('cols') + 80; // its lane was deleted\n    }\n    if (r.row) {\n      const o = rs.get(r.row);\n      if (o) c.y = Math.round(o.start + Math.min(r.dy, Math.max(0, o.l.size - 60)));\n      else c.y = totalSize('rows') + 80;\n    }\n  });\n}\n\n// Place every scene in the lane matching its POV / location (custom lanes keep current lane)\nfunction arrange() {\n  const cOn = axisOn('cols'), rOn = axisOn('rows');\n  if (!cOn && !rOn) return;\n  const nC = board.lanes.cols.items.length, nR = board.lanes.rows.items.length;\n  const pick = (axis, c) => {\n    if (!axisOn(axis)) return 0;\n    const n = axis === 'cols' ? nC : nR;\n    const f = fieldOf(axis);\n    const i = f ? board.lanes[axis].items.findIndex(l => same(l.name, c[f]))\n                : laneIndexAt(axis, axis === 'cols' ? ax(c) : ay(c));\n    return i < 0 ? n : i; // n = \"unassigned\" overflow lane\n  };\n  const groups = new Map();\n  let unassigned = 0;\n  board.cards.forEach(c => {\n    if (c.wip) return; // WIP scenes stay where you put them\n    const ci = pick('cols', c), ri = pick('rows', c);\n    if ((cOn && ci === nC) || (rOn && ri === nR)) unassigned++;\n    const k = ci + '|' + ri;\n    if (!groups.has(k)) groups.set(k, []);\n    groups.get(k).push(c);\n  });\n  groups.forEach(list => list.sort((a, b) => (a.y - b.y) || (a.x - b.x)));\n  const H = (c) => size(c).h;\n\n  if (cOn) board.lanes.cols.items.forEach(col => { col.size = Math.max(col.size, CARD_W + 40); });\n  if (rOn) {\n    board.lanes.rows.items.forEach((row, ri) => {\n      let need = 0;\n      groups.forEach((list, k) => {\n        if (Number(k.split('|')[1]) !== ri) return;\n        need = Math.max(need, cOn ? list.reduce((s, c) => s + H(c) + GAP, 0) + PAD : Math.max(...list.map(H)) + PAD * 2);\n      });\n      row.size = Math.max(row.size, need);\n    });\n  }\n\n  const starts = (axis) => { const s = laneStarts(axis).map(o => o.start); s.push(totalSize(axis) + 80); return s; };\n  const colStart = starts('cols'), rowStart = starts('rows');\n  const colX = (ci) => Math.round(colStart[ci] + (ci < nC ? (board.lanes.cols.items[ci].size - CARD_W) / 2 : 0));\n\n  groups.forEach((list, k) => {\n    const [ci, ri] = k.split('|').map(Number);\n    if (cOn) {\n      let y = rOn ? rowStart[ri] + PAD : 40;\n      list.forEach(c => { c.x = colX(ci); c.y = y; y += H(c) + GAP; });\n    } else {\n      list.sort((a, b) => a.x - b.x);\n      let x = 40;\n      list.forEach(c => { c.x = x; c.y = rowStart[ri] + PAD; x += CARD_W + GAP * 2; });\n    }\n  });\n  return unassigned;\n}\n\n// After editing a scene's POV / location in the editor, move it into the matching lane (adding the lane if new)\nfunction placeIntoLanes(card) {\n  let moved = false;\n  const added = [];\n  if (card.wip) return added;\n  AXES.forEach(axis => {\n    const f = fieldOf(axis);\n    if (!f || !card[f]) return;\n    const items = board.lanes[axis].items;\n    let i = items.findIndex(l => same(l.name, card[f]));\n    if (i < 0) { items.push({ id: 'ln-' + uid(), name: card[f], size: axis === 'cols' ? COL_W : ROW_H }); i = items.length - 1; added.push(card[f]); }\n    if (laneIndexAt(axis, axis === 'cols' ? ax(card) : ay(card)) !== i) {\n      const o = laneStarts(axis)[i];\n      if (axis === 'cols') card.x = Math.round(o.start + (o.l.size - CARD_W) / 2);\n      else card.y = o.start + PAD;\n      moved = true;\n    }\n  });\n  if (moved) {\n    let guard = 0;\n    while (guard++ < 200 && board.placed.some(o => o !== card && Math.abs(o.x - card.x) < CARD_W && o.y < card.y + 140 && o.y + size(o).h + GAP > card.y)) card.y += 40;\n    const ri = laneIndexAt('rows', ay(card));\n    if (ri >= 0) { const o = laneStarts('rows')[ri]; o.l.size = Math.max(o.l.size, card.y - o.start + 240); }\n  }\n  return added;\n}\n\n/* ---------- Story order: acts, then sequences, then scenes; unfiled scenes last ---------- */\nfunction storyOrder() {\n  const b = Story.bookId;\n  return Story.data.scenes.filter(c => !c.wip && !c.archived && c.bookId === b);\n}\n\n/* ---------- Rendering ---------- */\nfunction size(c) {\n  const el = $(c.id);\n  return el && el.offsetWidth ? { w: el.offsetWidth, h: el.offsetHeight } : { w: CARD_W, h: 160 };\n}\n\nfunction render() {\n  renderCards();\n  renderLanes();\n  renderLinks();\n  renderHeads();\n  $('empty').style.display = board.placed.length ? 'none' : 'block';\n  renderIdeas();\n  $('statusFilter').value = statusOnly;\n  $('btnSnap').disabled = !(axisOn('cols') || axisOn('rows'));\n  $('btnLanes').classList.toggle('on', axisOn('cols') || axisOn('rows'));\n  $('btnNumbers').classList.toggle('on', board.showNumbers);\n  $('btnKeystones').classList.toggle('on', keystonesOnly);\n  $('btnKeystones').textContent = '◆ Keystones' + (board.cards.some(c => c.keystone) ? ` (${board.cards.filter(c => c.keystone).length})` : '');\n  updateLists();\n}\n\nfunction renderCards() {\n  cardsEl.innerHTML = '';\n  const order = board.showNumbers ? Story.numbers().scene : null;\n  board.placed.forEach(c => {\n    const d = document.createElement('div');\n    const st = c.status || 'open';\n    d.className = 'card st-' + st + (c.keystone ? ' keystone' : '') + ((keystonesOnly && !c.keystone) || (statusOnly && st !== statusOnly) ? ' dim' : '') + (selected.has(c.id) ? ' selected' : '');\n    d.id = c.id;\n    d.style.left = c.x + 'px';\n    d.style.top = c.y + 'px';\n    const chips = (c.storyDate ? `<span class=\"chip\"><b>DATE<\/b>${esc(c.storyDate)}<\/span>` : '') +\n                  (c.pov ? `<span class=\"chip\"><b>POV<\/b>${esc(c.pov)}<\/span>` : '') +\n                  (c.location ? `<span class=\"chip\"><b>LOC<\/b>${esc(c.location)}<\/span>` : '') +\n                  (c.memo ? `<span class=\"chip\" title=\"Has a voice memo\">🎙 ${fmtDur(c.memo.dur)}<\/span>` : '');\n    const badge = order ? `<span class=\"scene-no\">${order.get(c.id)}<\/span>` : '';\n    d.innerHTML = `\n      <div class=\"card-top\">${badge}<div class=\"card-title\">${c.keystone ? '<span class=\"ks-mark\" title=\"Keystone scene\"><\/span>' : ''}${esc(c.title)}<\/div><button class=\"icon-btn menu-btn\" title=\"Scene menu\" aria-label=\"Scene menu\">⋯<\/button><\/div>\n      <div class=\"sub-line\">${statusPill(c)}${filedLine(c)}<\/div>\n      ${c.objective ? `<div class=\"objective\"><span>🎯<\/span><span>${esc(c.objective)}<\/span><\/div>` : ''}\n      <div class=\"summary${c.summary ? '' : ' empty'}\">${c.summary ? esc(c.summary) : 'Double-click or double-tap to write the summary…'}<\/div>\n      ${chips ? `<div class=\"meta\">${chips}<\/div>` : ''}\n      <div class=\"handle\" title=\"Drag to another scene to link them\"><\/div>`;\n    cardsEl.appendChild(d);\n  });\n}\n\nfunction renderLanes() {\n  lanesEl.innerHTML = '';\n  const cOn = axisOn('cols'), rOn = axisOn('rows');\n  if (!cOn && !rOn) return;\n  let x1 = 0, y1 = 0, x2 = 2400, y2 = 2400;\n  board.placed.forEach(c => { const s = size(c); x1 = Math.min(x1, c.x - 300); y1 = Math.min(y1, c.y - 300); x2 = Math.max(x2, c.x + s.w + 600); y2 = Math.max(y2, c.y + s.h + 600); });\n  const top = rOn ? 0 : y1, bottom = rOn ? totalSize('rows') : y2;\n  const left = cOn ? 0 : x1, right = cOn ? totalSize('cols') : x2;\n  const band = (cls, l, t, w, h) => {\n    const b = document.createElement('div');\n    b.className = 'band ' + cls;\n    Object.assign(b.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px' });\n    lanesEl.appendChild(b);\n  };\n  if (rOn) laneStarts('rows').forEach((o, i) => band('row' + (i % 2 ? ' alt' : ''), left, o.start, right - left, o.l.size));\n  if (cOn) laneStarts('cols').forEach((o, i) => band('col' + (i % 2 ? ' alt' : ''), o.start, top, o.l.size, bottom - top));\n}\n\nfunction renderHeads() {\n  const ch = $('colHeads'), rh = $('rowHeads'), corner = $('corner');\n  const cOn = axisOn('cols'), rOn = axisOn('rows'), v = board.view;\n  ch.innerHTML = ''; rh.innerHTML = '';\n  ch.style.display = cOn ? 'block' : 'none';\n  rh.style.display = rOn ? 'block' : 'none';\n  corner.style.display = cOn && rOn ? 'flex' : 'none';\n  const counts = (axis) => {\n    const n = board.lanes[axis].items.map(() => 0);\n    board.cards.forEach(c => { if (c.wip) return; const i = laneIndexAt(axis, axis === 'cols' ? ax(c) : ay(c)); if (i >= 0) n[i]++; });\n    return n;\n  };\n  const kind = (axis) => board.lanes[axis].type === 'custom' ? (board.lanes[axis].label || 'Lane') : TYPE_NAMES[board.lanes[axis].type];\n  if (cOn) {\n    const n = counts('cols');\n    laneStarts('cols').forEach((o, i) => {\n      const left = v.x + o.start * v.zoom, w = o.l.size * v.zoom;\n      if (left + w < 0 || left > viewport.clientWidth) return;\n      const h = document.createElement('div');\n      h.className = 'lane-head';\n      h.title = `${kind('cols')}: ${o.l.name} — double-click to edit lanes`;\n      Object.assign(h.style, { left: left + 'px', width: w + 'px' });\n      h.innerHTML = `<span class=\"nm\">${esc(o.l.name)}<\/span><span class=\"count\">${n[i]}<\/span>`;\n      ch.appendChild(h);\n      const g = document.createElement('div');\n      g.className = 'grip'; g.dataset.axis = 'cols'; g.dataset.id = o.l.id; g.title = 'Drag to resize';\n      g.style.left = (left + w - 5) + 'px';\n      ch.appendChild(g);\n    });\n  }\n  if (rOn) {\n    const n = counts('rows');\n    laneStarts('rows').forEach((o, i) => {\n      const top = v.y + o.start * v.zoom, h = o.l.size * v.zoom;\n      if (top + h < 0 || top > viewport.clientHeight) return;\n      const d = document.createElement('div');\n      d.className = 'lane-head';\n      d.title = `${kind('rows')}: ${o.l.name} — double-click to edit lanes`;\n      Object.assign(d.style, { top: top + 'px', height: h + 'px' });\n      d.innerHTML = `<span class=\"nm\">${esc(o.l.name)}<\/span><span class=\"count\">${n[i]} scene${n[i] === 1 ? '' : 's'}<\/span>`;\n      rh.appendChild(d);\n      const g = document.createElement('div');\n      g.className = 'grip'; g.dataset.axis = 'rows'; g.dataset.id = o.l.id; g.title = 'Drag to resize';\n      g.style.top = (top + h - 5) + 'px';\n      rh.appendChild(g);\n    });\n  }\n}\n\nfunction filedLine(c) {\n  const w = Story.where(c);\n  if (!w) return '';\n  return `<div class=\"filed\" title=\"${esc(Story.partLabel(w.part) + ' › ' + Story.actLabel(w.act) + ' › ' + Story.seqLabel(w.seq))}\"><b>Part ${w.partNo} · Act ${w.actNo}<\/b> · Seq ${w.seqNo}${w.seq.name ? ': ' + esc(w.seq.name) : ''}<\/div>`;\n}\n\nfunction anchors(a, b) {\n  const sa = size(a), sb = size(b);\n  const ca = { x: a.x + sa.w / 2, y: a.y + sa.h / 2 }, cb = { x: b.x + sb.w / 2, y: b.y + sb.h / 2 };\n  const dx = cb.x - ca.x, dy = cb.y - ca.y;\n  const horiz = Math.abs(dx) > Math.abs(dy);\n  const s = { ...ca }, e = { ...cb };\n  if (horiz) { s.x = dx > 0 ? a.x + sa.w : a.x; e.x = dx > 0 ? b.x : b.x + sb.w; }\n  else { s.y = dy > 0 ? a.y + sa.h : a.y; e.y = dy > 0 ? b.y : b.y + sb.h; }\n  return { s, e, horiz };\n}\n\nfunction curve(s, e, horiz) {\n  if (horiz) { const k = (e.x - s.x) * 0.5; return `M${s.x} ${s.y} C${s.x + k} ${s.y}, ${e.x - k} ${e.y}, ${e.x} ${e.y}`; }\n  const k = (e.y - s.y) * 0.5; return `M${s.x} ${s.y} C${s.x} ${s.y + k}, ${e.x} ${e.y - k}, ${e.x} ${e.y}`;\n}\n\nfunction renderLinks() {\n  const NS = 'http://www.w3.org/2000/svg';\n  linkGroup.innerHTML = '';\n  board.links.forEach(l => {\n    const a = getCard(l.from), b = getCard(l.to);\n    if (!a || !b || a.wip || b.wip) return;\n    const hot = selected.has(a.id) || selected.has(b.id);\n    const { s, e, horiz } = anchors(a, b);\n    const d = curve(s, e, horiz);\n    const g = document.createElementNS(NS, 'g');\n    g.dataset.link = l.id;\n    const hit = document.createElementNS(NS, 'path');\n    hit.setAttribute('d', d); hit.setAttribute('class', 'link-hit');\n    const p = document.createElementNS(NS, 'path');\n    p.setAttribute('d', d); p.setAttribute('class', 'link-path' + (hot ? ' hot' : ''));\n    p.setAttribute('marker-end', hot ? 'url(#arrowHot)' : 'url(#arrow)');\n    g.append(hit, p);\n    linkGroup.appendChild(g);\n    if (l.label) {\n      const lg = document.createElementNS(NS, 'g');\n      lg.setAttribute('class', 'link-label' + (hot ? ' hot' : ''));\n      lg.setAttribute('transform', `translate(${(s.x + e.x) / 2}, ${(s.y + e.y) / 2})`);\n      const rect = document.createElementNS(NS, 'rect');\n      const text = document.createElementNS(NS, 'text');\n      text.textContent = l.label;\n      lg.append(rect, text);\n      g.appendChild(lg);\n      const w = Math.max(text.getComputedTextLength() + 18, 36);\n      rect.setAttribute('x', -w / 2); rect.setAttribute('y', -11);\n      rect.setAttribute('width', w); rect.setAttribute('height', 22); rect.setAttribute('rx', 5);\n    }\n  });\n}\n\nfunction refreshSelection() {\n  document.querySelectorAll('.card').forEach(el => el.classList.toggle('selected', selected.has(el.id)));\n  renderLinks();\n}\n\nfunction updateLists() {\n  const uniq = (f, axisNames) => {\n    const m = new Map();\n    board.cards.forEach(c => { if (c[f]) m.set(c[f].toLowerCase(), c[f]); });\n    axisNames.forEach(n => { if (!m.has(n.toLowerCase())) m.set(n.toLowerCase(), n); });\n    return [...m.values()].sort();\n  };\n  const laneNames = (f) => AXES.filter(a => fieldOf(a) === f).flatMap(a => board.lanes[a].items.map(l => l.name));\n  $('povList').innerHTML = uniq('pov', laneNames('pov')).map(v => `<option value=\"${esc(v)}\">`).join('');\n  $('locList').innerHTML = uniq('location', laneNames('location')).map(v => `<option value=\"${esc(v)}\">`).join('');\n}\n\n/* ---------- Planning status ---------- */\nconst ST_LABEL = { open: 'OPEN', leaning: 'LEANING', locked: '🔒 LOCKED' };\nconst fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };\nconst fmtDur = (sec) => { sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };\nfunction statusPill(c) {\n  const st = c.status || 'open';\n  const tip = st === 'locked' && c.lock ? `Locked ${fmtDate(c.lock.at)}${c.lock.note ? ' — ' + c.lock.note : ''}` : st === 'leaning' ? 'Leaning: the current working direction' : 'Open: undecided';\n  return `<span class=\"st-pill ${st}\" title=\"${esc(tip)}\">${ST_LABEL[st]}<\/span>`;\n}\n// Locking stamps today's date and a note; unlocking keeps the history\nfunction applyStatus(c, st, note) {\n  const was = c.status || 'open', now = new Date().toISOString();\n  if (st === 'locked' && was !== 'locked') {\n    c.lock = { at: now, note: note || '' };\n    c.lockLog = [...(c.lockLog || []), { at: now, note: note || '', action: 'locked' }].slice(-20);\n  } else if (st !== 'locked' && was === 'locked') {\n    c.lockLog = [...(c.lockLog || []), { at: now, note: c.lock ? c.lock.note : '', action: 'unlocked' }].slice(-20);\n    c.lock = null;\n  } else if (st === 'locked' && note !== undefined && c.lock && c.lock.note !== note) {\n    c.lock = { ...c.lock, note };\n    const log = [...(c.lockLog || [])], last = log.map(x => x.action).lastIndexOf('locked');\n    if (last >= 0) { log[last] = { ...log[last], note }; c.lockLog = log; }\n  }\n  c.status = st;\n}\n\n/* ---------- Scenes ---------- */\nlet panelStatus = 'open', panelMemoRemoved = false;\nfunction setPanelStatus(st) {\n  panelStatus = st;\n  document.querySelectorAll('#fStatus button').forEach(b => b.classList.toggle('on', b.dataset.st === st));\n  const c = editingCardId ? getCard(editingCardId) : null;\n  $('lockRow').classList.toggle('on', st === 'locked');\n  if (st === 'locked') {\n    const hist = (c && c.lockLog || []).slice(-3).reverse().map(x => `${x.action === 'locked' ? 'Locked' : 'Unlocked'} ${fmtDate(x.at)}${x.note ? ' — ' + esc(x.note) : ''}`);\n    $('lockInfo').innerHTML = (c && c.status === 'locked' && c.lock ? `Locked on <b>${fmtDate(c.lock.at)}<\/b>.` : `Saving stamps it as locked <b>today, ${fmtDate(new Date().toISOString())}<\/b>.`) +\n      (hist.length > 1 || (hist.length && !(c && c.status === 'locked')) ? '<br>' + hist.join('<br>') : '');\n  }\n}\nfunction openScene(id, pos) {\n  closeCardMenu();\n  editingCardId = id; pendingPos = pos || null; panelMemoRemoved = false;\n  let c = id ? getCard(id) : { title: '', pov: '', location: '', objective: '', summary: '', status: 'open', storyDate: '' };\n  if (!id && pos) {\n    // Pre-fill POV / location from the lanes you double-clicked in\n    c = { ...c };\n    AXES.forEach(axis => {\n      const f = fieldOf(axis);\n      if (!f) return;\n      const i = laneIndexAt(axis, axis === 'cols' ? pos.x : pos.y);\n      if (i >= 0) c[f] = board.lanes[axis].items[i].name;\n    });\n  }\n  $('sceneHeading').textContent = id ? (c.wip ? 'Edit Idea' : 'Edit Scene') : 'New Scene';\n  $('fTitle').value = c.title === 'Untitled Scene' ? '' : c.title;\n  $('fPov').value = c.pov; $('fLoc').value = c.location;\n  $('fObj').value = c.objective; $('fSum').value = c.summary;\n  $('fDate').value = c.storyDate || '';\n  $('fLockNote').value = c.lock ? c.lock.note : '';\n  $('fWip').checked = !!c.wip;\n  $('fKey').checked = !!c.keystone;\n  $('fFile').innerHTML = '<option value=\"\">Unfiled<\/option>' + Story.filingOptions().map(o => `<option value=\"${esc(o.value)}\">${esc(o.label)}<\/option>`).join('');\n  $('fFile').value = (id && c.seqId) || '';\n  $('btnOpenBeats').style.display = id && !IPAD ? '' : 'none';\n  $('memoBox').hidden = !c.memo;\n  if (c.memo) { $('memoInfo').textContent = `Voice memo · ${fmtDur(c.memo.dur)} · ${fmtDate(c.memo.at)}`; $('btnMemoPlay').textContent = '▶'; }\n  pendingPrefill = id ? null : { pov: c.pov, location: c.location };\n  $('btnDeleteScene').style.display = id ? '' : 'none';\n  setPanelStatus(c.status || 'open');\n  $('sceneModal').classList.add('open');\n  $('sceneModal').querySelector('.modal-body').scrollTop = 0;\n  // on a touch screen, don't throw the keyboard up: you may want to write with the Pencil\n  if (!(window.matchMedia && matchMedia('(pointer: coarse)').matches)) $('fTitle').focus();\n}\n// has the open panel been changed?\nfunction panelDirty() {\n  const c = editingCardId ? getCard(editingCardId) : null;\n  const v = (id) => $(id).value.trim();\n  if (!c) return !!(v('fTitle') || v('fSum') || v('fObj') || v('fDate'));\n  return v('fTitle') !== (c.title === 'Untitled Scene' ? '' : c.title) || v('fPov') !== c.pov || v('fLoc') !== c.location || v('fObj') !== c.objective ||\n    v('fSum') !== c.summary || v('fDate') !== (c.storyDate || '') || panelStatus !== (c.status || 'open') || $('fWip').checked !== !!c.wip ||\n    $('fKey').checked !== !!c.keystone || ($('fFile').value || null) !== (c.seqId || null) || panelMemoRemoved || (panelStatus === 'locked' && v('fLockNote') !== (c.lock ? c.lock.note : ''));\n}\n\nfunction saveScene() {\n  const vals = {\n    title: $('fTitle').value.trim() || 'Untitled Scene',\n    pov: $('fPov').value.trim(), location: $('fLoc').value.trim(),\n    objective: $('fObj').value.trim(), summary: $('fSum').value.trim(),\n    storyDate: $('fDate').value.trim(),\n    wip: $('fWip').checked,\n    keystone: $('fKey').checked\n  };\n  const lockNote = $('fLockNote').value.trim();\n  const fileTo = $('fFile').value || null;\n  commit();\n  let card, promoted = false, binned = false;\n  if (editingCardId) {\n    card = getCard(editingCardId);\n    promoted = card.wip && !vals.wip;\n    binned = !card.wip && vals.wip;\n    Object.assign(card, vals);\n    if (panelMemoRemoved) card.memo = null;\n    if ((card.seqId || null) !== fileTo) Story.moveScene(card.id, fileTo, null, 'board');\n    if (promoted) { const p = viewCenter(); card.x = Math.round(p.x - CARD_W / 2); card.y = Math.round(p.y - 40); freeSpot(card); }\n  } else {\n    // A new idea doesn't keep POV / location that were only pre-filled from the lanes\n    if (vals.wip && pendingPrefill) ['pov', 'location'].forEach(f => { if (vals[f] && vals[f] === pendingPrefill[f]) vals[f] = ''; });\n    const p = pendingPos || viewCenter();\n    const pos = { x: Math.round(p.x - CARD_W / 2), y: Math.round(p.y - 40) };\n    while (board.placed.some(c => Math.abs(c.x - pos.x) < 20 && Math.abs(c.y - pos.y) < 20)) { pos.x += 30; pos.y += 30; }\n    // a new scene joins the end of its sequence, or Unfiled in board order (top to bottom)\n    card = Story.addScene({ ...vals, ...pos, status: 'open' }, { seqId: fileTo, byPosition: true }, 'board');\n    if (!vals.wip) selected = new Set([card.id]);\n  }\n  applyStatus(card, panelStatus, lockNote);\n  closeModals();\n  render(); // render first so card sizes are known\n  // Blank POV / location are filled from the lanes the scene sits in; typed values move it to their lane\n  let added = [];\n  if (!card.wip) { assignFromPosition(card, true); added = placeIntoLanes(card); }\n  render(); save({ structure: true, order: true, fields: true });\n  const notes = [];\n  if (promoted) notes.push(`\"${card.title}\" is now on the board as Scene ${Story.numbers().scene.get(card.id)}.`);\n  if (binned || (!editingCardId && vals.wip)) notes.push(`\"${card.title}\" is in the Idea Bin.`);\n  if (added.length) notes.push(`Added lane: ${added.join(', ')}.`);\n  if (notes.length) toast(notes.join(' '), promoted || binned);\n}\n\n// nudge a card down until it doesn't sit on top of another one\nfunction freeSpot(c) {\n  const H = (o) => Math.max(140, size(o).h);\n  for (let i = 0; i < 80 && board.placed.some(o => o !== c && c.x < o.x + CARD_W + 16 && c.x + CARD_W + 16 > o.x && c.y < o.y + H(o) + 16 && c.y + 150 > o.y); i++) c.y += 40;\n}\n// the middle of what you can see (to the right of the Idea Bin when it's open)\nfunction viewCenter() {\n  const r = viewport.getBoundingClientRect();\n  const left = $('ideaTray').classList.contains('open') ? Math.min(r.right - 100, $('ideaTray').getBoundingClientRect().right) : r.left;\n  return toWorld((left + r.right) / 2, r.top + r.height / 2);\n}\n\nfunction newSceneAtCenter() { openScene(null, viewCenter()); }\n\nfunction deleteScenes(ids) {\n  if (!ids.length) return;\n  const withBeats = ids.map(getCard).filter(c => c && c.beats.length).length;\n  if (withBeats && !confirm(`Delete ${ids.length === 1 ? 'this scene' : ids.length + ' scenes'}? ${withBeats === 1 && ids.length === 1 ? 'Its beats' : 'Their beats'} in the Beat Sheet go too. You can undo right after.`)) return;\n  commit();\n  Story.deleteScenes(ids, 'board');\n  ids.forEach(id => selected.delete(id));\n  render();\n  toast(ids.length === 1 ? 'Scene deleted.' : `${ids.length} scenes deleted.`, true);\n}\n\nfunction snapToLanes() {\n  if (!axisOn('cols') && !axisOn('rows')) return;\n  commit();\n  render();\n  const un = arrange();\n  render(); save({ positions: true, fields: true });\n  toast(un ? `Scenes arranged. ${un} with no matching lane went to the right/bottom edge.` : 'Scenes arranged into lanes.', true);\n}\n\n/* ---------- Links ---------- */\nfunction openLink(id) {\n  const l = board.links.find(x => x.id === id);\n  if (!l) return;\n  editingLinkId = id;\n  $('linkRoute').innerHTML = `<b>${esc(getCard(l.from).title)}<\/b> → <b>${esc(getCard(l.to).title)}<\/b>`;\n  $('fLinkLabel').value = l.label;\n  $('linkModal').classList.add('open');\n  $('fLinkLabel').focus();\n}\nfunction saveLink() {\n  const l = board.links.find(x => x.id === editingLinkId);\n  const label = $('fLinkLabel').value.trim();\n  if (l && l.label !== label) { commit(); l.label = label; save(); }\n  closeModals(); renderLinks();\n}\nfunction reverseLink() {\n  const l = board.links.find(x => x.id === editingLinkId);\n  if (!l) return;\n  commit();\n  const label = $('fLinkLabel').value.trim();\n  board.links = board.links.filter( const loaded = new Set();
let current = null;

function ui() { try { return JSON.parse(localStorage.getItem(UI_KEY) || '{}'); } catch (e) { return {}; } }
function setUi(patch) { try { localStorage.setItem(UI_KEY, JSON.stringify({ ...ui(), ...patch })); } catch (e) {} }

function load(view) {
  if (loaded.has(view)) return;
  loaded.add(view);
  $(VIEWS[view]).srcdoc = SOURCES[view];
}
const frame = (view) => $(VIEWS[view]).contentWindow;

const Shell = {
  show(view, opts = {}) {
    if (!VIEWS[view]) return;
    if (APP_MODE === 'ipad' && view !== 'board') { shellToast('Beats and the writing room are in the studio on your computer. Everything you do here syncs to it.', 6000); return; }
    load(view);
    current = view;
    for (const [v, id] of Object.entries(VIEWS)) $(id).classList.toggle('active', v === view);
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
    document.body.classList.toggle('writing', view === 'write');
    if (view !== 'write') document.body.classList.remove('quiet');
    setUi({ view });
    const focus = () => { try { const w = frame(view); w.focus(); w.__view && w.__view.shown && w.__view.shown(opts); } catch (e) {} };
    if ($(VIEWS[view]).contentWindow?.__view) focus(); else $(VIEWS[view]).addEventListener('load', () => setTimeout(focus, 50), { once: true });
  },
  // open a scene's manuscript at the typewriter
  write(sceneId) { Shell.show('write', { sceneId }); },
  // open a scene in the beat sheet
  beats(sceneId) { Shell.show('beats', { sceneId }); },
  setQuiet(q) { document.body.classList.toggle('quiet', !!q && current === 'write'); },
  get current() { return current; },
  toast: shellToast
};

};
window.addEventListener('pagehide', () => Story.flush());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Story.flush(); });

(async () => {
  if (APP_MODE === 'ipad') { document.body.classList.add('ipad'); document.querySelector('.brand').textContent = 'Scene Board'; document.title = 'Scene Board — Keepers of the Word'; }
  const r = await Story.init();
  if (r.unreadable) {
    if (confirm(`Your saved story couldn't be read (${r.unreadable.message}). Nothing was overwritten and saving is paused.\n\nDownload a copy of the unreadable data now? Then use Restore to load a backup.`))
      download(JSON.stringify(r.raw), `story-unreadable-${stamp()}.json`);
  }
  FileSync.restore();
  renderBooks();
  Story.subscribe((src, info) => { if (info.structure || info.book || info.replaced || src === 'remote') renderBooks(); });
  $('loading').remove();
  const hash = location.hash.replace('#', '');
  if (APP_MODE === 'ipad') {
    Shell.show('board');
    // ask the iPad to keep this app's data (Home Screen apps are exempt from Safari's 7-day clean-up)
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  } else {
    Shell.show(VIEWS[hash] ? hash : (ui().view && VIEWS[ui().view] ? ui().view : 'board'));
    // have the other views ready in the background
    setTimeout(() => { load('board'); load('beats'); }, 400);
    setTimeout(() => load('write'), 1500);
  }
  try { const t = sessionStorage.getItem('kotw_toast'); if (t) { sessionStorage.removeItem('kotw_toast'); shellToast(t, 5000); } } catch (e) {}
  CloudSync.start();
  if (r.migrated) shellToast(`Brought in ${r.migrated.scenes} scenes and ${r.migrated.beats} beats from your Scene Board and Beat Sheet. Your old files are untouched.`, 8000);
})();
</script>
</body>
