<style>
  :root {
    --bg: #0c0e14; --surface: #161922; --card: #1e222e; --border: rgba(255,255,255,0.08); --border-hi: rgba(255,255,255,0.22);
    --text: #f1f3f9; --muted: #9aa2b6; --faint: #636b80; --accent: #38bdf8; --danger: #f43f5e;
    --bar: 46px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
  button { font: inherit; font-size: 0.78rem; font-weight: 500; cursor: pointer; padding: 6px 11px; border-radius: 6px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  button:hover { background: var(--card); border-color: var(--border-hi); }
  button.synced { border-color: #10b981; background: rgba(16,185,129,0.15); color: #6ee7b7; }
  button.reconnect { border-color: #f59e0b; background: rgba(245,158,11,0.15); color: #fcd34d; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: #090b10; border-bottom: 1px solid var(--border); }
  .brand { font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: 0.05em; white-space: nowrap; margin-right: 14px; }
  #tabs { display: flex; gap: 2px; height: 100%; }
  #tabs button { background: none; border: none; border-radius: 0; height: 100%; padding: 0 16px; color: var(--muted); font-size: 0.84rem; font-weight: 600;
    border-bottom: 2px solid transparent; }
  #tabs button:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  #tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  #tabs kbd { font: 500 0.66rem 'Inter', sans-serif; color: var(--faint); margin-left: 6px; }
  .spacer { flex: 1; }
  #bookSel { margin-left: 12px; font: 600 0.8rem 'Inter', sans-serif; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; max-width: 280px; }
  #bookSel:focus { outline: none; border-color: var(--accent); }
  .status { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--faint); white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
  .dot.saving { background: #f59e0b; } .dot.error { background: var(--danger); }

  .view { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar); width: 100%; height: calc(100% - var(--bar)); border: 0; visibility: hidden; pointer-events: none; background: var(--bg); }
  .view.active { visibility: visible; pointer-events: auto; }
  body.writing #bar { display: none; }
  body.writing #viewWrite { top: 0; height: 100%; }

  /* In the writing room the tabs float at the top and fade with the room's own controls */
  #pill { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; gap: 2px; padding: 3px;
    background: rgba(24,19,13,0.82); border: 1px solid rgba(200,173,120,0.22); border-radius: 18px; transition: opacity .6s ease; }
  body.writing #pill { display: flex; }
  body.writing.quiet #pill { opacity: 0; pointer-events: none; }
  #pill button { background: none; border: none; border-radius: 14px; padding: 4px 12px; font: 12px Georgia, serif; color: #bfae8d; }
  #pill button:hover { background: rgba(200,173,120,0.12); color: #efe2c4; }
  #pill button[aria-selected="true"] { background: rgba(200,173,120,0.18); color: #f3e6c8; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem; z-index: 50; background: var(--bg); }
  #shellToast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--card); border: 1px solid var(--border-hi);
    border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 90vw; }
  #cloudMenu { position: fixed; z-index: 40; background: var(--card); border: 1px solid var(--border-hi); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  #cloudMenu[hidden], #cloudDlg[hidden] { display: none; }
  #cloudMenu button { background: none; border: none; text-align: left; padding: 8px 10px; }
  #cloudMenu button:hover { background: rgba(255,255,255,0.06); }
  #cloudDlg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  #cloudDlg .box { background: var(--surface); border: 1px solid var(--border-hi); border-radius: 12px; padding: 20px 22px; max-width: 460px; width: 92vw; box-shadow: 0 16px 48px rgba(0,0,0,0.6); }
  #cloudDlg h3 { font-size: 1rem; margin-bottom: 10px; }
  #cloudDlg p { color: var(--muted); font-size: 0.84rem; line-height: 1.5; white-space: pre-line; margin-bottom: 16px; }
  #cloudDlg .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #cloudDlg button.primary { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 700; }
  @media (max-width: 720px) { .brand { display: none; } #tabs kbd { display: none; } }
  /* the iPad app: just the Board */
  body.ipad #tabs, body.ipad #btnPublish, body.ipad #btnSync, body.ipad #btnRestore, body.ipad #pill { display: none; }
  body.ipad .brand { display: inline; }
  @media (pointer: coarse) {
    :root { --bar: 54px; }
    #bar button { min-height: 40px; padding: 8px 13px; font-size: 0.86rem; }
    #bookSel { min-height: 40px; font-size: 16px; }
    #cloudMenu button { padding: 13px 14px; font-size: 0.95rem; }
    #cloudDlg button { min-height: 44px; }
  }
</style>
</head>
<body>
<header id="bar">
  <span class="brand">Keepers of the Word</span>
  <nav id="tabs" role="tablist">
    <button role="tab" data-view="board" aria-selected="false">Board<kbd>Ctrl 1</kbd></button>
    <button role="tab" data-view="beats" aria-selected="false">Beats<kbd>Ctrl 2</kbd></button>
    <button role="tab" data-view="write" aria-selected="false">Write<kbd>Ctrl 3</kbd></button>
  </nav>
  <select id="bookSel" title="The book you're working on. Board, Beats and Write show this book." aria-label="Book"></select>
  <span class="spacer"></span>
  <button id="btnCloud" title="Sign in with Google to keep your story in the cloud">☁ Sign in</button>
  <button id="btnPublish" title="Create or update Google Docs in your Drive: scene outline, beat outline and scene manuscripts, filed by part and act">⇪ Publish</button>
  <button id="btnSync" title="Older option for one computer: pick a file and the story (not the manuscripts) saves to it automatically">Sync to File</button>
  <button id="btnBackup" title="Download a copy of the whole story: scenes, acts, sequences, beats and images">Backup</button>
  <button id="btnRestore" title="Load a story backup">Restore</button>
  <input type="file" id="restoreInput" accept=".json" hidden>

  <button data-view="board">Board</button><button data-view="beats">Beats</button><button data-view="write" aria-selected="true">Write</button>
</nav>
<iframe class="view" id="viewBoard" title="Scene Board" allow="microphone"></iframe>
<iframe class="view" id="viewBeats" title="Beat Sheet"></iframe>
<iframe class="view" id="viewWrite" title="Writing room" allow="fullscreen"></iframe>
<div id="loading">Opening your story…</div>
<div id="shellToast" role="status"></div>
<div id="cloudMenu" hidden><button data-do="now">Sync now</button><button data-do="out">Sign out of cloud sync</button><button data-do="id">Use a different Client ID…</button></div>
<div id="cloudDlg" hidden role="dialog" aria-modal="true"><div class="box"><h3 id="cdTitle"></h3><p id="cdBody"></p><div class="row" id="cdRow"></div></div></div>

<script>
/* =====================================================================
   The story: one shared save for every view.
   Acts → Sequences → Scenes. The scenes array is always kept in story order:
   by act, then sequence, then position in the sequence; unfiled scenes come last.
   Scenes are numbered with one running count (WIP and archived scenes get no number);
   sequences are numbered with one running count across all acts.
   ===================================================================== */
const STORY_DB = 'kotw_story';
const OLD_BOARD_KEY = 'kotw_scene_blocking_v1';
const OLD_BOARD_KEYS = ['kotw_scene_board_novel_data_v4', 'kotw_scene_board_novel_data_v3', 'kotw_scene_board_novel_data_v2', 'storyplot_board_novel_data_v1'];
const OLD_BEATS_DB = 'kotw_beat_sheet';
const OLD_BEAT_OPS_KEY = 'kotw_beat_updates';
const UI_KEY = 'kotw_studio_ui';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const str = (v) => (v === null || v === undefined) ? '' : String(v).trim();
const num = (v, d = 0) => Number.isFinite(Number(v)) ? Number(v) : d;
const $ = (id) => document.getElementById(id);
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
const WIN = uid();

function idbOpen(name, create) {
  return new Promise((resolve, reject) => {
    const r = create ? indexedDB.open(name, 1) : indexedDB.open(name);
    r.onupgradeneeded = () => { if (create) r.result.createObjectStore('kv'); else r.transaction.abort(); };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error('could not open ' + name));
  });
}
async function idbGet(db, key) {
  if (!db.objectStoreNames.contains('kv')) return undefined;
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(val, key);
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('save aborted'));
  });
}

const Story = (() => {
  let data = null, db = null, saveTimer = null, saving = null, again = false, blocked = false, numCache = null;
  const subs = new Set();

  const emptyLanes = () => ({ cols: { type: 'off', label: '', items: [] }, rows: { type: 'off', label: '', items: [] } });
  function blank() {
    return { app: 'kotw-story', version: 2, rev: 0, books: [], parts: [], acts: [], sequences: [], scenes: [], links: [], lanes: emptyLanes(),
             board: { view: { x: 80, y: 80, zoom: 1 }, showNumbers: true }, templates: [], drafts: {} };
  }
  function normBeat(b) {
    return {
      id: str(b.id) || 'b-' + uid(), label: str(b.label), prompt: str(b.prompt), text: String(b.text ?? ''), done: !!b.done, notes: String(b.notes ?? ''),
      dialogue: (Array.isArray(b.dialogue) ? b.dialogue : []).filter(Boolean).map(x => ({ id: str(x.id) || 'd-' + uid(), speaker: str(x.speaker), line: String(x.line ?? '') })),
      images: (Array.isArray(b.images) ? b.images : []).filter(x => x && /^data:image\//.test(x.src)).map(x => ({ id: str(x.id) || 'i-' + uid(), src: x.src, caption: str(x.caption) }))
    };
  }
  function normScene(s) {
    return { id: str(s.id) || 's-' + uid(), title: str(s.title) || 'Untitled Scene', pov: str(s.pov), location: str(s.location),
      objective: str(s.objective), summary: String(s.summary ?? '').trim(), wip: !!s.wip, archived: !!s.archived, keystone: !!s.keystone,
      seqId: s.seqId ? String(s.seqId) : null, bookId: s.bookId ? String(s.bookId) : null, x: num(s.x), y: num(s.y), type: str(s.type) || 'free',
      // planning status (OPEN / LEANING / LOCKED), the date inside the story, when and why it was locked, and an attached voice memo
      status: ['open', 'leaning', 'locked'].includes(s.status) ? s.status : 'open',
      storyDate: str(s.storyDate),
      lock: s.lock && typeof s.lock === 'object' && s.lock.at ? { at: String(s.lock.at), note: str(s.lock.note) } : null,
      lockLog: (Array.isArray(s.lockLog) ? s.lockLog : []).filter(x => x && x.at).slice(-20).map(x => ({ at: String(x.at), note: str(x.note), action: x.action === 'unlocked' ? 'unlocked' : 'locked' })),
      memo: s.memo && typeof s.memo === 'object' && /^[\w-]+$/.test(String(s.memo.id || '')) ? { id: String(s.memo.id), mime: str(s.memo.mime), dur: num(s.memo.dur), at: String(s.memo.at || ''), size: num(s.memo.size) } : null,
      beats: (Array.isArray(s.beats) ? s.beats : []).filter(Boolean).map(normBeat) };
  }
  // keeps ids unique within a list
  function uniq(list, prefix) {
    const seen = new Set();
    return list.map(x => { let id = str(x.id) || prefix + uid(); if (seen.has(id)) id = prefix + uid(); seen.add(id); return { ...x, id }; });
  }
  function normalize(d) {
    if (!d || !Array.isArray(d.scenes)) throw new Error('no scene list found');
    const o = blank();
    o.rev = num(d.rev);
    o.books = uniq((Array.isArray(d.books) ? d.books : []).filter(Boolean), 'bk-').map(b => ({ id: b.id, name: str(b.name) }));
    // a story saved before books existed becomes Book 1
    if (!o.books.length) o.books.push({ id: 'bk-' + uid(), name: '' });
    const bookIds = new Set(o.books.map(b => b.id));
    o.parts = uniq((Array.isArray(d.parts) ? d.parts : []).filter(p => p && bookIds.has(String(p.bookId))), 'pt-').map(p => ({ id: p.id, bookId: String(p.bookId), name: str(p.name) }));
    const partIds = new Set(o.parts.map(p => p.id));
    let fallbackPart = null;
    const partFor = () => {
      if (!fallbackPart) { fallbackPart = { id: 'pt-' + uid(), bookId: o.books[0].id, name: '' }; o.parts.unshift(fallbackPart); partIds.add(fallbackPart.id); }
      return fallbackPart.id;
    };
    // acts saved before parts existed go into Part 1 of Book 1
    o.acts = uniq((Array.isArray(d.acts) ? d.acts : []).filter(Boolean), 'a-').map(a => ({ id: a.id, partId: partIds.has(String(a.partId)) ? String(a.partId) : partFor(), name: str(a.name) }));
    const actIds = new Set(o.acts.map(a => a.id));
    o.sequences = uniq((Array.isArray(d.sequences) ? d.sequences : []).filter(q => q && actIds.has(String(q.actId))), 'q-').map(q => ({ id: q.id, actId: String(q.actId), name: str(q.name) }));
    const seqIds = new Set(o.sequences.map(q => q.id));
    const ids = new Set();
    o.scenes = d.scenes.filter(Boolean).map(s => {
      const n = normScene(s);
      if (ids.has(n.id)) n.id = 's-' + uid();
      ids.add(n.id);
      if (n.seqId && !seqIds.has(n.seqId)) n.seqId = null;
      if (!n.bookId || !bookIds.has(n.bookId)) n.bookId = o.books[0].id;
      return n;
    });
    const seen = new Set();
    o.links = (Array.isArray(d.links) ? d.links : []).filter(l => l && ids.has(l.from) && ids.has(l.to) && l.from !== l.to && !seen.has(l.from + '>' + l.to) && seen.add(l.from + '>' + l.to))
      .map(l => ({ id: str(l.id) || 'l-' + uid(), from: l.from, to: l.to, label: str(l.label) }));
    if (d.lanes && typeof d.lanes === 'object') o.lanes = d.lanes;
    if (d.board && typeof d.board === 'object') {
      const v = d.board.view || {};
      o.board = { view: { x: num(v.x, 80), y: num(v.y, 80), zoom: Math.min(2.5, Math.max(0.2, num(v.zoom, 1))) }, showNumbers: d.board.showNumbers !== false };
    }
    o.templates = (Array.isArray(d.templates) ? d.templates : []).filter(t => t && str(t.name) && Array.isArray(t.beats))
      .map(t => ({ id: str(t.id) || 'tpl-' + uid(), name: str(t.name), desc: str(t.desc) || 'Your template', custom: true, beats: t.beats.map(b => ({ label: str(b.label), prompt: str(b.prompt) })) }));
    if (d.drafts && typeof d.drafts === 'object') for (const [k, v] of Object.entries(d.drafts)) if (Number.isFinite(+v)) o.drafts[k] = +v;
    sortAll(o);
    return o;
  }

  /* ---------- order and numbering ----------
     Book → Part → Act → Sequence → Scene. Everything is kept in story order.
     Within a book: filed scenes by part, act, sequence and position; that book's unfiled scenes come last.
     Parts are numbered within their book, acts within their part; sequences and scenes run through each book. */
  function sortAll(d = data) {
    const stable = (list, key) => list.map((x, i) => [x, i]).sort((a, b) => (key(a[0]) - key(b[0])) || (a[1] - b[1])).map(x => x[0]);
    const bIdx = new Map(d.books.map((b, i) => [b.id, i]));
    d.parts = stable(d.parts, p => bIdx.get(p.bookId) ?? 1e9);
    const pIdx = new Map(d.parts.map((p, i) => [p.id, i]));
    d.acts = stable(d.acts, a => pIdx.get(a.partId) ?? 1e9);
    const aIdx = new Map(d.acts.map((a, i) => [a.id, i]));
    d.sequences = stable(d.sequences, q => aIdx.get(q.actId) ?? 1e9);
    const qIdx = new Map(d.sequences.map((q, i) => [q.id, i]));
    // a filed scene belongs to its sequence's book
    const bookOfSeq = new Map(d.sequences.map(q => { const a = d.acts.find(x => x.id === q.actId); const p = a && d.parts.find(x => x.id === a.partId); return [q.id, p ? p.bookId : null]; }));
    d.scenes.forEach(s => { if (s.seqId && bookOfSeq.get(s.seqId)) s.bookId = bookOfSeq.get(s.seqId); });
    d.scenes = d.scenes.map((s, i) => [s, i]).sort((a, b) => {
      const ka = (bIdx.get(a[0].bookId) ?? 1e9) * 1e6 + (a[0].seqId && qIdx.has(a[0].seqId) ? qIdx.get(a[0].seqId) : 999999);
      const kb = (bIdx.get(b[0].bookId) ?? 1e9) * 1e6 + (b[0].seqId && qIdx.has(b[0].seqId) ? qIdx.get(b[0].seqId) : 999999);
      return (ka - kb) || (a[1] - b[1]);
    }).map(x => x[0]);
    numCache = null;
  }
  function numbers() {
    if (numCache && numCache.rev === data.rev && numCache.len === data.scenes.length) return numCache;
    const book = new Map(), part = new Map(), act = new Map(), seq = new Map(), scene = new Map();
    data.books.forEach((b, i) => book.set(b.id, i + 1));
    const count = new Map(), next = (k) => { const n = (count.get(k) || 0) + 1; count.set(k, n); return n; };
    data.parts.forEach(p => part.set(p.id, next('p:' + p.bookId)));
    data.acts.forEach(a => act.set(a.id, next('a:' + a.partId)));
    const bookOfAct = new Map(data.acts.map(a => [a.id, (data.parts.find(p => p.id === a.partId) || {}).bookId]));
    data.sequences.forEach(q => seq.set(q.id, next('q:' + bookOfAct.get(q.actId))));
    data.scenes.forEach(s => { if (!s.archived && !s.wip) scene.set(s.id, next('s:' + s.bookId)); });
    numCache = { rev: data.rev, len: data.scenes.length, book, part, act, seq, scene };
    return numCache;
  }
  const book = (id) => data.books.find(b => b.id === id) || null;
  const part = (id) => data.parts.find(p => p.id === id) || null;
  const act = (id) => data.acts.find(a => a.id === id) || null;
  const seq = (id) => data.sequences.find(q => q.id === id) || null;
  const scene = (id) => data.scenes.find(s => s.id === id) || null;
  const named = (word, n, name) => `${word} ${n}${name ? ': ' + name : ''}`;
  function bookLabel(b) { return named('Book', numbers().book.get(b.id), b.name); }
  function partLabel(p) { return named('Part', numbers().part.get(p.id), p.name); }
  function actLabel(a) { return named('Act', numbers().act.get(a.id), a.name); }
  function seqLabel(q) { return named('Sequence', numbers().seq.get(q.id), q.name); }
  const partOfAct = (a) => a ? part(a.partId) : null;
  const bookOfPart = (p) => p ? book(p.bookId) : null;
  function where(s) {
    const q = s && s.seqId ? seq(s.seqId) : null;
    if (!q) return null;
    const a = act(q.actId), p = partOfAct(a), b = bookOfPart(p), N = numbers();
    return { book: b, part: p, act: a, seq: q, bookNo: N.book.get(b.id), partNo: N.part.get(p.id), actNo: N.act.get(a.id), seqNo: N.seq.get(q.id) };
  }
  // the book this window is working on (each window can show a different one)
  let currentBook = null;
  function bookId() {
    if (currentBook && book(currentBook)) return currentBook;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(UI_KEY) || '{}').book; } catch (e) {}
    currentBook = saved && book(saved) ? saved : data.books[0].id;
    return currentBook;
  }
  function setBook(id) {
    if (!book(id) || id === bookId()) return;
    currentBook = id;
    try { const u = JSON.parse(localStorage.getItem(UI_KEY) || '{}'); u.book = id; localStorage.setItem(UI_KEY, JSON.stringify(u)); } catch (e) {}
    for (const fn of [...subs]) { try { fn('shell', { book: true }); } catch (e) { console.error(e); } }
  }
  const scenesOf = (bId = bookId()) => data.scenes.filter(s => s.bookId === bId);

        const useFile = fileStory && confirm(`"${h.name}" holds a story with ${fileStory.scenes.length} scenes. This browser has ${Story.data.scenes.length}.\n\nOK = load the file's story\nCancel = keep this one and overwrite the file (a copy of the file downloads first)`);

})();

/* ---------- The writing room's own storage (the typewriter manuscripts) ---------- */
const WritingStore = (() => {
  const NAME = 'underwood-quiet-v1';
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(NAME, 2);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('state')) d.createObjectStore('state'); if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('close other copies of the studio first'));
    });
  }
  // → { meta, pages: {id: page} } for everything the typewriter has stored here
  async function read() {
    const db = await open();
    try {
      const meta = await rq(db.transaction('state').objectStore('state').get('meta'));
      if (!meta || meta.format !== 6) return { meta: null, pages: {} };
      const ids = (meta.manuscripts || []).flatMap(m => m.pageIds || []);
      const store = db.transaction('pages').objectStore('pages');
      const got = await Promise.all(ids.map(id => rq(store.get(id))));
      const pages = {}; ids.forEach((id, i) => { if (got[i]) pages[id] = got[i]; });
      return { meta, pages };
    } finally { db.close(); }
  }
  async function write(meta, pages, removeIds, clearMeta) {
    const db = await open();
    try {
      await new Promise((res, rej) => {
        const t = db.transaction(['state', 'pages'], 'readwrite'), s = t.objectStore('state'), p = t.objectStore('pages');
        if (meta) s.put(meta, 'meta'); else if (clearMeta) s.delete('meta');
        for (const id of Object.keys(pages || {})) p.put(pages[id], id);
        for (const id of (removeIds || [])) p.delete(id);
        t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('could not write the manuscripts'));
      });
    } finally { db.close(); }
  }
  // a short fingerprint of some text (to tell whether a sheet changed)
  function hash(s) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + '.' + s.length.toString(36);
  }
  return { read, write, hash };
})();

/* the whole studio in one object: story + manuscripts (used by Backup, Restore and Cloud) */
async function exportAll() {
  await Story.flush();
  const w = await WritingStore.read();
  return { app: 'kotw-studio-backup', version: 1, savedAt: new Date().toISOString(), story: JSON.parse(Story.serialize()), meta: w.meta, pages: w.pages };
}
async function importAll(raw, source) {
  const story = Story.normalize(raw.story);
  const pages = raw.pages || {};
  const cur = await WritingStore.read();
  await WritingStore.write(raw.meta || null, pages, Object.keys(cur.pages).filter(id => !(id in pages)), !raw.meta);
  Story.replace(story, source || 'shell');
  await Story.flush();
}
function reloadWithToast(msg) { try { sessionStorage.setItem('kotw_toast', msg); } catch (e) {} location.reload(); }

/* ---------- Voice memos: audio kept on this device, and in the cloud folder as separate files ---------- */
const MediaStore = (() => {
  const NAME = 'kotw_media';
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(NAME, 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('memos')) r.result.createObjectStore('memos'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function op(mode, fn) { const db = await open(); try { return await rq(fn(db.transaction('memos', mode).objectStore('memos'))); } finally { db.close(); } }
  // Safari stores Blobs in IndexedDB; keep the bytes and type separately so any browser can read them back
  async function put(id, blob) { const buf = await blob.arrayBuffer(); await op('readwrite', s => s.put({ type: blob.type || '', buf }, id)); }
  async function get(id) { try { const v = await op('readonly', s => s.get(id)); return v ? new Blob([v.buf], { type: v.type || '' }) : null; } catch (e) { return null; } }
  async function del(id) { try { await op('readwrite', s => s.delete(id)); } catch (e) {} }
  return { put, get, del };
})();
// memo ids the story refers to
const memoIds = (story) => [...new Set((story.scenes || []).map(sc => sc.memo && sc.memo.id).filter(Boolean))];

/* ---------- Cloud sync: your story and manuscripts, kept in a hidden folder in your own Google Drive ---------- */

    offline: 'No connection. Your work is safe on this computer and will sync when you are back online.', conflict: 'The cloud copy and this computer differ. Click to choose.',

  function setMode(m, msg) {

    const c = remote.counts || {};
    const choice = await ask('Two different copies',
      `The cloud copy (saved ${when}) has ${n(c.scenes || 0, 'scene')} and ${n(c.manuscripts || 0, 'manuscript')}.\nThis computer has ${n(here, 'scene')} with changes the cloud has not seen.\n\nWhichever you do not pick is downloaded to your Downloads folder as a backup first, so nothing is lost.`,

    } catch (e) { fail(e); }
    finally { busy = false; if (again) { again = false; schedule(1000); } }
  }
  function fail(e) {
    if (e && e.code === 'race') { schedule(1500); setMode('syncing'); return; }
    if (e && e.name === 'NeedSignIn') { needGesture = true; setMode('reconnect'); return; }
    if (!navigator.onLine || e instanceof TypeError) { setMode('offline'); schedule(30000); return; }
    setMode('error', (e && e.message) || 'Google Drive problem');
    shellToast('Cloud sync problem: ' + ((e && e.message) || 'unknown'), 9000);
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(() => { firstAt = 0; cycle('change'); }, ms); }

  /* ----- what the buttons do ----- */
  async function signIn() {
    if (!webOk()) { alert('Cloud sync needs the studio opened from its web address (https://…). A file opened from your computer cannot sign in to Google.'); return; }
    if (!clientId()) {
      const v = prompt('Paste your Google Client ID (it ends in .apps.googleusercontent.com):', '');
      if (!v) return;
      if (!/\.apps\.googleusercontent\.com\s*$/.test(v.trim())) { alert('That does not look like a Client ID. It should end in .apps.googleusercontent.com'); return; }
      cfg.clientId = v.trim(); saveCfg();
    }
    try { await requestToken(''); } catch (e) {
      shellToast('Sign-in was cancelled or blocked. Allow pop-ups for this page and try again.', 7000);
      // a Client ID that was typed in (not built in) may be the wrong one: let it be replaced
      if (!(typeof CLOUD_CLIENT_ID === 'string' && CLOUD_CLIENT_ID) && cfg.clientId && confirm('Sign-in did not complete.\n\nOK = enter a different Google Client ID\nCancel = keep the current one and try again later')) { cfg.clientId = ''; tokenClient = null; saveCfg(); }
      return;
    }
    needGesture = false; cfg.signedIn = true; saveCfg();
    await cycle('signin');
  }
  async function signOut() {
    try { if (token && window.google && google.accounts) google.accounts.oauth2.revoke(token, () => {}); } catch (e) {}
    token = null; tokenExp = 0; cfg.signedIn = false; saveCfg(); try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    clearTimeout(timer); needGesture = false; setMode('signedout');
  }
  function menu() {
    const m = $('cloudMenu'), b = $('btnCloud');
    if (!m.hidden) { m.hidden = true; return; }
    const r = b.getBoundingClientRect(); m.style.top = (r.bottom + 6) + 'px'; m.style.right = Math.max(8, innerWidth - r.right) + 'px';
    m.hidden = false; m.firstChild.focus();
  }
  function click() {
    if (mode === 'other') { shellToast('Cloud sync is running in another studio window. Use that one, or close it and reload this one.', 6000); return; }
    if (!signedIn() || mode === 'reconnect') { signIn(); return; }
    if (mode === 'conflict') { cycle('now'); return; }
    menu();
  }
  function changed() {
    seq++;
    if (!st.dirty) { st.dirty = true; saveSt(); }
    if (!started || !leader || !signedIn()) return;
    if (!busy) setMode(needGesture ? 'reconnect' : 'waiting');
    if (!firstAt) firstAt = Date.now();
    clearTimeout(timer);
    timer = setTimeout(() => { firstAt = 0; cycle('change'); }, Math.min(4000, Math.max(0, 60000 - (Date.now() - firstAt))));
  }

  async function start() {
    loadCfg();
    await loadSt();
    $('btnCloud').onclick = click;
    $('cloudMenu').onclick = (e) => {
      const a = e.target.closest('button'); if (!a) return; $('cloudMenu').hidden = true;
      if (a.dataset.do === 'now') cycle('now'); else if (a.dataset.do === 'out') signOut(); else if (a.dataset.do === 'id') { cfg.clientId = ''; saveCfg(); tokenClient = null; signOut(); }
    };
    document.addEventListener('pointerdown', (e) => {
      if (!$('cloudMenu').hidden && !e.target.closest('#cloudMenu,#btnCloud')) $('cloudMenu').hidden = true;
      if (needGesture && mode === 'reconnect' && !pending && !e.target.closest('#cloudDlg')) { needGesture = false; requestToken('').then(() => cycle('signin')).catch(() => { needGesture = true; setMode('reconnect'); }); }
    }, true);
    try { Story.subscribe((src, info) => {
      if (src === 'cloud') return;
      if (info && Object.keys(info).length && Object.keys(info).every(k => k === 'view')) return;
      changed();
    }); } catch (e) {}
    try { const w = new BroadcastChannel('underwood-quiet-v1'); w.onmessage = (e) => { if (e.data && e.data.owner) changed(); }; } catch (e) {}
    try { bc = new BroadcastChannel('kotw_cloud'); bc.onmessage = (e) => { if (e.data && e.data.reload) location.reload(); }; } catch (e) {}
    window.addEventListener('online', () => { if (signedIn()) cycle('now'); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && signedIn() && !needGesture) cycle('focus'); });
    setInterval(() => { if (document.visibilityState === 'visible' && signedIn() && !needGesture && !busy) cycle('poll'); }, 60000);
    const begin = () => { started = true; if (!signedIn()) { setMode('signedout'); return; } setMode(st.dirty ? 'waiting' : 'idle'); cycle('start'); };
    if (navigator.locks) {
      navigator.locks.request('kotw_cloud_sync', { ifAvailable: true }, (lock) => {
        if (!lock) { leader = false; started = true; setMode('other'); return; }
        begin();
        return new Promise(() => {});
      });
    } else begin();
  }
  /* ----- the list of Drive files Publish has made, kept in the same private cloud folder so every computer shares it ----- */
  const PUBMAP = 'studio-publish-map.json';
  async function readMap() {
    const f = (await listFiles()).get(PUBMAP);
    if (!f) return null;
    try { return JSON.parse(await gunzip(await getFile(f))); } catch (e) { return null; }
  }
  async function writeMap(obj) {
    const files = await listFiles();
    await putFile(PUBMAP, await gz(JSON.stringify(obj)), files.get(PUBMAP));
  }
  // a memo recorded on another device: download it the first time it is played
  async function fetchMemo(id) {
    if (!signedIn()) throw new Error('Sign in with the ☁ button to get memos from your other devices.');
    const f = (await listFiles()).get(memoName(id));
    if (!f) throw new Error('That memo is not in the cloud yet. Open the device that recorded it so it can sync.');
    const blob = await getFile(f);
    await MediaStore.put(id, blob);
    return blob;
  }
  return { start, changed, signIn, signOut, cycle, ask, readMap, writeMap, fetchMemo, gis: loadGis, clientId, signedIn, get mode() { return mode; }, get state() { return st; } };
})();

/* ---------- Publish to Google Docs: real, shareable files in your Drive, kept in step with the studio ---------- */
const Publisher = (() => {
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';   // only files this app creates
  const DOCX = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const GDOC = 'application/vnd.google-apps.document', GFOLDER = 'application/vnd.google-apps.folder';
  const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
  const TOK = 'kotw_cloud_ftoken';
  const ROOT_NAME = 'Keepers of the Word';
  let tok = null, exp = 0, client = null, cb = null, running = false;
  try { const t = JSON.parse(localStorage.getItem(TOK) || 'null'); if (t && t.exp > Date.now() + 60000) { tok = t.t; exp = t.exp; } } catch (e) {}
  const tokenOk = () => tok && Date.now() < exp - 60000;
  const fail = (msg, extra) => Object.assign(new Error(msg), extra || {});

  /* ----- permission to create files (asked for once, when you first publish) ----- */
  async function token() {
    if (tokenOk()) return tok;
    await CloudSync.gis();
    return new Promise((res, rej) => {
      if (!client) client = google.accounts.oauth2.initTokenClient({
        client_id: CloudSync.clientId(), scope: SCOPE,
        callback: (r) => {
          const c = cb; cb = null; if (!c) return;
          if (!r || r.error) c.rej(fail(r && r.error ? r.error : 'declined'));
          else { tok = r.access_token; exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; try { localStorage.setItem(TOK, JSON.stringify({ t: tok, exp })); } catch (e) {} c.res(tok); }
        },
        error_callback: (e) => { const c = cb; cb = null; c && c.rej(fail((e && e.type) || 'closed')); }
      });
      cb = { res, rej };
      client.requestAccessToken({ prompt: '' });
    });
  }
  async function api(url, opts = {}) {
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + tok } });
    if (r.status === 401) { tok = null; exp = 0; try { localStorage.removeItem(TOK); } catch (e) {} throw fail('Google asked you to sign in again. Click Publish once more.', { retry: true }); }
    if (!r.ok) { let b = ''; try { b = await r.text(); } catch (e) {} throw fail('Google Drive said ' + r.status + (b ? ': ' + b.slice(0, 220) : ''), { status: r.status }); }
    return r;
  }

  /* ----- what this app has already made in Drive ----- */
  async function listApp() {
    const out = new Map(); let pt = '';
    do {
      const q = encodeURIComponent(`trashed=false and (mimeType='${GFOLDER}' or mimeType='${GDOC}')`);
      const u = `${API}/files?q=${q}&pageSize=1000&fields=${encodeURIComponent('nextPageToken,files(id,name,mimeType,parents)')}` + (pt ? '&pageToken=' + encodeURIComponent(pt) : '');
      const j = await (await api(u)).json();
      for (const f of j.files || []) out.set(f.id, f);
      pt = j.nextPageToken;
    } while (pt);
    return out;
  }
  const jsonHead = { 'Content-Type': 'application/json; charset=UTF-8' };
  async function folder(ctx, key, name, parentId) {
    const rec = ctx.map.folders[key], ex = rec && ctx.existing.get(rec.id);
    if (ex) {
      const move = parentId && !(ex.parents || []).includes(parentId);
      if (ex.name !== name || move) {
        const q = move ? `&addParents=${parentId}&removeParents=${(ex.parents || [])[0] || ''}` : '';
        await api(`${API}/files/${rec.id}?fields=id${q}`, { method: 'PATCH', headers: jsonHead, body: JSON.stringify({ name }) });
        ex.name = name; if (move) ex.parents = [parentId];
      }
      return rec.id;
    }
    const meta = { name, mimeType: GFOLDER }; if (parentId) meta.parents = [parentId];
    const r = await (await api(`${API}/files?fields=id`, { method: 'POST', headers: jsonHead, body: JSON.stringify(meta) })).json();
    ctx.map.folders[key] = { id: r.id };
    ctx.existing.set(r.id, { id: r.id, name, mimeType: GFOLDER, parents: parentId ? [parentId] : [] });
    return r.id;
  }
  function multipart(meta, blob) {
    const b = 'kotw' + Math.random().toString(36).slice(2);
    return { ct: `multipart/related; boundary=${b}`, body: new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${DOCX}\r\n\r\n`, blob, `\r\n--${b}--`]) };
  }
  // upload a Word file and let Google turn it into a Google Doc (on an update, the whole document is replaced)
  async function sendDoc(id, meta, blob, addParent, removeParent) {
    const base = id ? `${UP}/files/${id}` : `${UP}/files`;
    const q = id && addParent ? `&addParents=${addParent}&removeParents=${removeParent || ''}` : '';
    const method = id ? 'PATCH' : 'POST';
    if (blob.size <= 4.5e6) {
      const m = multipart(meta, blob);
      return (await api(`${base}?uploadType=multipart&fields=id${q}`, { method, headers: { 'Content-Type': m.ct }, body: m.body })).json();
    }
    const r = await api(`${base}?uploadType=resumable&fields=id${q}`, { method, headers: { ...jsonHead, 'X-Upload-Content-Type': DOCX, 'X-Upload-Content-Length': String(blob.size) }, body: JSON.stringify(meta) });
    const loc = r.headers.get('Location'); if (!loc) throw fail('Google did not accept the large upload');
    return (await api(loc, { method: 'PUT', headers: { 'Content-Type': DOCX }, body: blob })).json();
  }

  /* ----- what gets published ----- */
  const clean = (s) => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled';
  const sceneName = (s) => { const n = Story.numbers().scene.get(s.id); return (n ? `Scene ${n}` : s.wip ? 'WIP' : 'Scene') + ' - ' + clean(s.title); };
  const lineOf = (s) => { const w = Story.where(s); return w ? [Story.partLabel(w.part), Story.actLabel(w.act), Story.seqLabel(w.seq)] : ['Unfiled']; };
  const sigScenes = (bookLabel, list, withBeats) => WritingStore.hash(JSON.stringify([bookLabel, list.map(s => [s.id, s.title, s.pov, s.location, s.objective, s.summary, s.keystone, s.wip, Story.numbers().scene.get(s.id), lineOf(s), withBeats ? s.beats : 0])]));

  async function views() {
    for (const v of ['board', 'beats', 'write']) load(v);
    const t0 = Date.now();
    while (Date.now() - t0 < 20000) {
      try { if (['board', 'beats', 'write'].every(v => frame(v) && frame(v).__view) && frame('write').__tw) break; } catch (e) {}
      await new Promise(r => setTimeout(r, 200));
    }
    await Promise.resolve(frame('write').__tw.ready);
  }

  async function plan(ctx) {
    const book = Story.book(Story.bookId), label = Story.bookLabel(book), tree = Story.tree(book.id);
    const items = [];
    const root = () => folder(ctx, 'root', ROOT_NAME, null);
    const bookF = async () => folder(ctx, 'b:' + book.id, label, await root());
    const std = Story.scenesOf(book.id).filter(s => !s.archived && !s.wip);
    if (std.length) {
      items.push({ key: 'outline:' + book.id, name: 'Scene Outline', parent: bookF, sig: sigScenes(label, std, false), build: async () => (await frame('board').__view.buildDoc()).blob });
      items.push({ key: 'beats:' + book.id, name: 'Beat Outline', parent: bookF, sig: sigScenes(label, std, true), build: async () => (await frame('beats').__view.buildDoc()).blob });
    }
    const W = frame('write').__view;
    const groups = [];
    for (const p of tree.parts) for (const a of p.acts) {
      const scenes = a.sequences.flatMap(q => q.scenes);
      if (scenes.length) groups.push({ scenes, parent: async () => folder(ctx, 'a:' + a.act.id, clean(Story.actLabel(a.act)), await folder(ctx, 'p:' + p.part.id, clean(Story.partLabel(p.part)), await bookF())) });
    }
    if (tree.unfiled.length) groups.push({ scenes: tree.unfiled, parent: async () => folder(ctx, 'u:' + book.id, 'Unfiled', await bookF()) });
    for (const g of groups) for (const s of g.scenes) {
      const info = await W.driveInfo(s.id);
      if (!info) continue;   // nothing typed yet
      let built = null;
      items.push({ key: 'ms:' + s.id, name: sceneName(s), parent: g.parent, sig: info.sig, book: book.id,
        build: async () => { built = await W.driveBuild(s.id); return built.blob; }, after: () => { if (built) W.driveMark(s.id, built.d); } });
    }
    return { book, label, items, rootFolder: root };
  }

  /* ----- the button ----- */
  async function publish() {
    if (running) return;
    if (!CloudSync.signedIn()) { alert('Sign in with the ☁ button first. That is how the studio remembers, on every computer, which Drive files belong to which scenes.'); return; }
    running = true;
    const bar = $('btnPublish'), was = bar.textContent;
    try {
      await views();
      await Story.flush();
      const probe = { map: { folders: {}, files: {} }, existing: new Map() };
      const pre = await plan(probe);   // counts only: nothing is created yet
      const ms = pre.items.filter(i => i.key.startsWith('ms:')).length;
      const go = await CloudSync.ask('Publish to Google Docs',
        `${pre.label}\n\nThis creates or updates ${pre.items.length} Google Docs in a "${ROOT_NAME}" folder in your Drive: the scene outline, the beat outline and ${ms} scene manuscript${ms === 1 ? '' : 's'}, filed by part and act.\n\nDocuments that have not changed since the last publish are left alone. A document you edit directly in Google Docs is replaced the next time its scene changes here, so make edits in the studio.`,
        ['Publish', 'Cancel']);
      if (go !== 0) return;
      try { await token(); } catch (e) { shellToast('Publishing needs the Google permission to create files. Click Publish and choose Allow.', 8000); return; }
      bar.disabled = true;
      const map = (await CloudSync.readMap()) || {}; map.folders = map.folders || {}; map.files = map.files || {};
      const ctx = { map, existing: await listApp() };
      const { items, rootFolder, label } = await plan(ctx);
      let made = 0, updated = 0, same = 0, bad = [];
      let n = 0;
      for (const it of items) {
        n++; bar.textContent = `Publishing ${n}/${items.length}…`;
        try {
          const parentId = await it.parent();
          const rec = map.files[it.key], ex = rec && ctx.existing.get(rec.id);
          if (ex) {
            const move = !(ex.parents || []).includes(parentId), rename = ex.name !== it.name;
            if (rec.sig === it.sig) {
              if (move || rename) await api(`${API}/files/${rec.id}?fields=id${move ? `&addParents=${parentId}&removeParents=${(ex.parents || [])[0] || ''}` : ''}`, { method: 'PATCH', headers: jsonHead, body: JSON.stringify({ name: it.name }) });
              same++; continue;
            }
            await sendDoc(rec.id, { name: it.name, mimeType: GDOC }, await it.build(), move ? parentId : null, (ex.parents || [])[0]);
            ex.name = it.name; if (move) ex.parents = [parentId];
            map.files[it.key] = { id: rec.id, sig: it.sig, book: it.book || null }; updated++;
          } else {
            const r = await sendDoc(null, { name: it.name, mimeType: GDOC, parents: [parentId] }, await it.build());
            ctx.existing.set(r.id, { id: r.id, name: it.name, mimeType: GDOC, parents: [parentId] });
            map.files[it.key] = { id: r.id, sig: it.sig, book: it.book || null }; made++;
          }
          if (it.after) it.after();
        } catch (e) { if (e.retry) throw e; bad.push(`${it.name}: ${e.message}`); }
      }
      await CloudSync.writeMap(map);
      const rootId = await rootFolder();
      const stale = Object.entries(map.files).filter(([k, v]) => k.startsWith('ms:') && v.book === Story.bookId && !items.some(i => i.key === k)).length;
      const lines = [`${made} created, ${updated} updated, ${same} unchanged.`];
      if (stale) lines.push(`${stale} older document${stale === 1 ? '' : 's'} in Drive no longer ${stale === 1 ? 'matches' : 'match'} a scene here (moved, archived or deleted). They were left alone.`);
      if (bad.length) lines.push(`\n${bad.length} could not be published:\n` + bad.slice(0, 4).join('\n'));
      const open = await CloudSync.ask(bad.length ? 'Published, with problems' : 'Published', `${label}\n\n${lines.join('\n')}`, ['Open the folder in Drive', 'Close']);
      if (open === 0) window.open(`https://drive.google.com/drive/folders/${rootId}`, '_blank', 'noopener');
    } catch (e) {
      shellToast('Publish stopped: ' + (e.name === 'NeedSignIn' ? 'click ☁ Reconnect first, then Publish again.' : e.message), 10000);
    } finally { running = false; bar.disabled = false; bar.textContent = was; }
  }
  return { publish };
})();

function download(content, name, type = 'application/json') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
let toastTimer = null;
function shellToast(msg, ms = 4500) {
  const t = $('shellToast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
}
