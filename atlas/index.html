<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keeper’s Codex</title>
<meta name="description" content="An illustrated timeline of the Book of Mormon, from the first year of the judges to Coriantumr’s attack on Zarahemla.">
<meta name="theme-color" content="#03060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keeper’s Codex">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* Keeper's Codex: a timeline first. The colours and type are Just Write's (near-black navy, warm cream, gold for what is
   active); the one Nephite element is the cut-stone corner, two small steps where a rounded corner would be. */
:root {
  --bg: #03060d; --raise: #090e18; --card: #0e1421; --card-hi: #172031; --line: #182131; --line-hi: #283346;
  --ink: #f2ead9; --muted: #a49b88; --faint: #686251; --accent: #f3b72f; --gold-soft: rgba(243,183,47,.14); --gold-line: rgba(243,183,47,.5);
  --war: #e8876a; --faith: #7fbf9a; --rule: #e2ad3b; --journey: #7fa6d9;
  --serif: 'Literata', 'Iowan Old Style', Palatino, Georgia, serif; --ui: 'Inter', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
  --top: calc(54px + env(safe-area-inset-top)); --step: 7px; --list-w: 400px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.stone { clip-path: polygon(0 calc(var(--step) * 2), var(--step) calc(var(--step) * 2), var(--step) var(--step), calc(var(--step) * 2) var(--step), calc(var(--step) * 2) 0,
  calc(100% - var(--step) * 2) 0, calc(100% - var(--step) * 2) var(--step), calc(100% - var(--step)) var(--step), calc(100% - var(--step)) calc(var(--step) * 2), 100% calc(var(--step) * 2),
  100% calc(100% - var(--step) * 2), calc(100% - var(--step)) calc(100% - var(--step) * 2), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step) * 2) calc(100% - var(--step)), calc(100% - var(--step) * 2) 100%,
  calc(var(--step) * 2) 100%, calc(var(--step) * 2) calc(100% - var(--step)), var(--step) calc(100% - var(--step)), var(--step) calc(100% - var(--step) * 2), 0 calc(100% - var(--step) * 2)); }

/* ---------- top bar ---------- */
#top { position: fixed; inset: 0 0 auto 0; height: var(--top); padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; background: var(--bg); z-index: 20; border-bottom: 1px solid var(--line); }
#brand { display: flex; align-items: center; gap: 10px; font: 500 19px var(--serif); letter-spacing: .01em; white-space: nowrap; text-decoration: none; }
#brand svg { width: 26px; height: 26px; flex: none; }
#brand b { font-weight: 500; color: var(--accent); }
.spacer { flex: 1; }
.seg { display: flex; background: var(--raise); border-radius: 11px; padding: 3px; gap: 2px; }
.seg > * { height: 34px; padding: 0 15px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; text-decoration: none; }
.seg > [aria-current="true"] { background: var(--card-hi); color: var(--accent); }
.tb { height: 40px; min-width: 40px; border-radius: 10px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.tb:active { background: var(--card); color: var(--ink); }
.tb svg, .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- the two panes: the timeline, and one event ---------- */
#timeline, #event { position: fixed; top: var(--top); bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#timeline { left: 0; width: 100%; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
#event { left: 0; right: 0; background: var(--bg); z-index: 10; }
@media (min-width: 900px) {
  #timeline { width: var(--list-w); border-right: 1px solid var(--line); }
  #event { left: var(--list-w); }
}
@media (max-width: 899px) { body:not(.reading) #event { display: none; } body.reading #timeline { visibility: hidden; } }

/* the timeline */
.who { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--raise); border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.who b { color: var(--accent); font: 500 16px var(--serif); }
.who button { margin-left: auto; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card-hi); color: var(--ink); font-size: 13px; }
.yh { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 8px; background: linear-gradient(var(--bg) 72%, transparent); font: 600 11.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.who + .yh, .who ~ .yh { top: 53px; }
.yh span { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--faint); font-size: 12.5px; }
.ev { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 8px 16px 8px 18px; position: relative; }
.ev::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: transparent; }
.ev.on { background: var(--raise); } .ev.on::before { background: var(--accent); }
.ev:active { background: var(--raise); }
.ev img { width: 96px; height: 64px; object-fit: cover; display: block; background: var(--card); --step: 3px; }
.ev .t { font: 500 16.5px/1.3 var(--serif); }
.ev .m { margin-top: 3px; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.count { padding: 22px 18px 0; font-size: 12.5px; color: var(--faint); }

/* one event */
.page { max-width: 820px; margin: 0 auto; padding: 0 0 calc(110px + env(safe-area-inset-bottom)); }
.hero { position: relative; margin: 18px 18px 0; aspect-ratio: 3 / 2; background: var(--card); --step: 10px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .lo { filter: blur(6px); transform: scale(1.03); }
.hero .hi { opacity: 0; transition: opacity .35s; } .hero .hi.in { opacity: 1; }
.body { padding: 22px 24px 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 600 11.5px var(--ui); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
.meta .cat { color: var(--c); display: inline-flex; align-items: center; gap: 7px; }
h1 { font: 500 clamp(27px, 4.2vw, 38px)/1.16 var(--serif); margin: 10px 0 14px; letter-spacing: -.005em; text-wrap: balance; }
.sum { font: 400 clamp(17px, 2vw, 19px)/1.62 var(--serif); color: var(--ink); text-wrap: pretty; }
.note { margin-top: 16px; padding: 12px 14px; border-left: 2px solid var(--line-hi); font-size: 13.5px; line-height: 1.55; color: var(--muted); }
h2 { font: 600 11.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 26px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--card); font: 15px var(--serif); display: inline-flex; align-items: center; }
button.chip:active { background: var(--card-hi); }
button.chip.on { background: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold-line) inset; color: var(--accent); }
.refs { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.refs a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 16px; background: var(--card); text-decoration: none; font: 500 16px var(--serif); color: var(--accent); --step: 5px; }
.refs a small { font: 12px var(--ui); color: var(--faint); }
.refs a:active { background: var(--card-hi); }

/* moving between events */
#bar { position: fixed; z-index: 12; bottom: 0; right: 0; left: 0; padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 8px; background: linear-gradient(transparent, var(--bg) 38%); pointer-events: none; }
#bar > * { pointer-events: auto; }
@media (min-width: 900px) { #bar { left: var(--list-w); } }
body:not(.reading) #bar { display: none; }
.nav { flex: 1 1 0; min-width: 0; height: 52px; padding: 0 14px; background: var(--card); display: flex; align-items: center; gap: 10px; --step: 5px; }
.nav:disabled { opacity: .3; }
.nav:active { background: var(--card-hi); }
.nav span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 15px var(--serif); color: var(--muted); }
.nav.next { justify-content: flex-end; text-align: right; }
.nav svg { flex: none; color: var(--accent); }
.rnd { width: 52px; height: 52px; flex: none; border-radius: 50%; background: var(--card); color: var(--muted); display: grid; place-items: center; }
.rnd.on { background: var(--gold-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--gold-line) inset; }
#back { height: 40px; padding: 0 10px 0 4px; border-radius: 10px; color: var(--muted); display: none; align-items: center; gap: 2px; font-size: 15px; }
@media (max-width: 899px) { body.reading #back { display: inline-flex; } body.reading #brand span { display: none; } }
@media (max-width: 520px) { .nav span { display: none; } .nav { flex: 0 0 64px; justify-content: center !important; } #bar { justify-content: space-between; } .seg > * { padding: 0 12px; } #brand { font-size: 17px; } }

/* about, and the small message */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; }
#about { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 28px)); max-height: calc(100% - 60px); overflow-y: auto; background: var(--raise); padding: 26px 26px 30px; --step: 9px; }
#about h3 { font: 500 24px var(--serif); margin-bottom: 12px; }
#about h4 { font: 600 11.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 20px 0 6px; }
#about p { font: 15.5px/1.6 var(--serif); color: var(--muted); }
#about a { color: var(--ink); }
#about .x { position: absolute; right: 16px; top: 16px; }
#toast { position: fixed; z-index: 50; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--card-hi); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 60; color: var(--faint); font: italic 18px var(--serif); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header id="top">
  <button id="back" aria-label="Back to the timeline"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Timeline</button>
  <a id="brand" href="./" aria-label="Keeper’s Codex">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2h4v4h4v4h4v4h2v4h-2v4h-4v4h-4v4h-8v-4H8v-4H4v-4H2v-4h2v-4h4V6h4V2z" fill="none" stroke="#f3b72f" stroke-width="1.6"/><path d="M16 9l4 7-4 7-4-7z" fill="#f3b72f"/></svg>
    <span>Keeper’s <b>Codex</b></span>
  </a>
  <span class="spacer"></span>
  <nav class="seg" aria-label="View"><a href="./" aria-current="true">Timeline</a><a href="annals-v1.html">Map</a></nav>
  <button class="tb" id="aboutBtn" aria-label="About and sources"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</header>

<main id="timeline" aria-label="Timeline"></main>
<article id="event" aria-live="polite"></article>
<div id="bar">
  <button class="nav prev stone" id="prev" aria-label="Previous event"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span></span></button>
  <button class="rnd" id="play" aria-label="Play through the events" aria-pressed="false"></button>
  <button class="rnd" id="share" aria-label="Share this event"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg></button>
  <button class="nav next stone" id="next" aria-label="Next event"><span></span><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div id="scrim" hidden></div>
<section id="about" class="stone" hidden role="dialog" aria-label="About and sources"></section>
<div id="toast" hidden role="status"></div>
<div id="load">Keeper’s Codex</div>

<script>
'use strict';
/* =====================================================================
   Keeper's Codex: the timeline of events, and one event at a time.
   Everything shown comes from data/register.json (the events) — add eras there and they appear here.
   An event's address is its id after the #, e.g. …/atlas/#W03, so any event can be linked to.
   ===================================================================== */
const VERSION = 'Nov 11 · c1a';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAT = { Warfare: ['War', 'var(--war)'], Faith: ['Faith', 'var(--faith)'], Government: ['Rule', 'var(--rule)'], Migration: ['Journeys', 'var(--journey)'] };
const cat = (e) => CAT[e.category] || [e.category, 'var(--muted)'];
const art = (e, size) => `assets/scenes/${size ? size + '/' : ''}${e.id}.webp`;
const wide = () => matchMedia('(min-width: 900px)').matches;
const PLAY = '<svg class="ic" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg>', PAUSE = '<svg class="ic" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="2.2"/></svg>';

let EVENTS = [], byId = new Map(), cur = null, who = '', playT = 0;
const shown = () => (who ? EVENTS.filter((e) => e.people.includes(who)) : EVENTS);

/* ---------- the timeline ---------- */
// the heading an event sits under: its year of the judges, with the approximate BC date beside it
function group(e) {
  if (e.year === null && !e.sortYear) return ['Before the years', 'the transition to judges'];
  if (e.year === null) return [`About year ${e.sortYear}`, 'mission account, undated'];
  return [e.yearEnd && e.yearEnd !== e.year ? `Years ${e.year}–${e.yearEnd}` : `Year ${e.year}`, (e.dateLabel.match(/about [^·]*/i) || [''])[0]];
}
function renderTimeline() {
  const list = shown(); let h = '', last = '';
  if (who) h += `<div class="who"><span><b>${esc(who)}</b> · ${list.length} event${list.length === 1 ? '' : 's'}</span><button id="whoX">Show all</button></div>`;
  for (const e of list) {
    const [g, sub] = group(e);
    if (g !== last) { h += `<div class="yh">${esc(g)}<span>${esc(sub)}</span></div>`; last = g; }
    h += `<button class="ev${e === cur ? ' on' : ''}" data-id="${e.id}" style="--c:${cat(e)[1]}"><img class="stone" loading="lazy" decoding="async" width="96" height="64" src="${art(e, 'sm')}" alt=""><span><span class="t">${esc(e.title)}</span><span class="m"><i class="dot"></i>${esc(cat(e)[0])}</span></span></button>`;
  }
  h += `<p class="count">${who ? '' : `${EVENTS.length} events · Mosiah 29 to Helaman 1`}</p>`;
  $('timeline').innerHTML = h;
}
function markTimeline(scroll) {
  const on = $('timeline').querySelector('.ev.on'); if (on) on.classList.remove('on');
  const el = cur && $('timeline').querySelector(`.ev[data-id="${cur.id}"]`); if (!el) return;
  el.classList.add('on');
  if (scroll) { const r = el.getBoundingClientRect(), t = $('timeline').getBoundingClientRect(); if (r.top < t.top + 60 || r.bottom > t.bottom - 20) $('timeline').scrollTop += r.top - t.top - t.height / 3; }
}
$('timeline').addEventListener('click', (ev) => {
  if (ev.target.closest('#whoX')) { setWho(''); return; }
  const b = ev.target.closest('.ev'); if (b) go(b.dataset.id);
});

/* ---------- one event ---------- */
function renderEvent() {
  const e = cur, el = $('event'); if (!e) { el.innerHTML = ''; return; }
  const [label, color] = cat(e);
  el.innerHTML = `<div class="page" style="--c:${color}">
    <div class="hero stone"><img class="lo" src="${art(e, 'sm')}" alt=""><img class="hi" alt="${esc(e.scene || e.title)}" src="${art(e, 'md')}" srcset="${art(e, 'md')} 900w, ${art(e)} 1536w" sizes="(min-width: 900px) min(820px, calc(100vw - 440px)), 100vw"></div>
    <div class="body">
      <div class="meta"><span class="cat"><i class="dot"></i>${esc(label)}</span><span>${esc(e.dateLabel)}</span></div>
      <h1>${esc(e.title)}</h1>
      <p class="sum">${esc(e.summary)}</p>
      ${e.chronologyNote ? `<p class="note">${esc(e.chronologyNote)}</p>` : ''}
      ${e.refs.length ? `<h2>Scripture</h2><div class="refs">${e.refs.map((r) => `<a class="stone" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}<small>Read ↗</small></a>`).join('')}</div>` : ''}
      ${e.people.length ? `<h2>People</h2><div class="chips">${e.people.map((p) => `<button class="chip${p === who ? ' on' : ''}" data-who="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}
      ${e.places.length ? `<h2>Places</h2><div class="chips">${e.places.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}</div>` : ''}
    </div></div>`;
  const hi = el.querySelector('.hi'); const done = () => hi.classList.add('in'); if (hi.complete && hi.naturalWidth) done(); else hi.addEventListener('load', done, { once: true });
  el.scrollTop = 0;
  const list = shown(), i = list.indexOf(e), p = list[i - 1], n = list[i + 1];
  $('prev').disabled = !p; $('next').disabled = !n;
  $('prev').querySelector('span').textContent = p ? p.title : ''; $('next').querySelector('span').textContent = n ? n.title : '';
  document.title = e.title + ' · Keeper’s Codex';
  // the next illustration is fetched ahead, so stepping forward doesn't wait on it
  if (n) { const im = new Image(); im.src = art(n, 'md'); }
}
function step(d) { const list = shown(), t = list[list.indexOf(cur) + d]; if (t) go(t.id); return !!t; }
$('event').addEventListener('click', (ev) => { const c = ev.target.closest('[data-who]'); if (c) setWho(c.dataset.who === who ? '' : c.dataset.who); });
$('prev').onclick = () => { stop(); step(-1); };
$('next').onclick = () => { stop(); step(1); };
$('back').onclick = () => { stop(); if (history.state && history.state.inApp) history.back(); else { history.replaceState(null, '', location.pathname + location.search); route(); } };
// a sideways swipe on the event moves to the next or the previous one
(() => { let x = 0, y = 0, on = false;
  $('event').addEventListener('touchstart', (e) => { on = e.touches.length === 1; if (on) { x = e.touches[0].clientX; y = e.touches[0].clientY; } }, { passive: true });
  $('event').addEventListener('touchend', (e) => { if (!on) return; on = false; const t = e.changedTouches[0], dx = t.clientX - x, dy = t.clientY - y; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) { stop(); step(dx < 0 ? 1 : -1); } }, { passive: true });
})();
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if (!$('about').hidden) closeAbout(); else if (!wide() && document.body.classList.contains('reading')) $('back').click(); return; }
  if (!$('about').hidden || !cur) return;
  if (e.key === 'ArrowRight') { stop(); step(1); } else if (e.key === 'ArrowLeft') { stop(); step(-1); }
});

/* ---------- playing through the events ---------- */
function paintPlay() { $('play').innerHTML = playT ? PAUSE : PLAY; $('play').classList.toggle('on', !!playT); $('play').setAttribute('aria-pressed', String(!!playT)); $('play').setAttribute('aria-label', playT ? 'Pause' : 'Play through the events'); }
function stop() { if (!playT) return; clearInterval(playT); playT = 0; paintPlay(); }
$('play').onclick = () => { if (playT) { stop(); return; } playT = setInterval(() => { if (document.hidden) return; if (!step(1)) stop(); }, 9000); paintPlay(); };
$('event').addEventListener('pointerdown', stop);

/* ---------- a person's events ---------- */
function setWho(name) {
  stop(); who = name || '';
  renderTimeline(); $('timeline').scrollTop = 0;
  if (who && cur && !cur.people.includes(who)) { if (wide()) go(shown()[0].id, true); else { cur = null; } }
  if (who && !wide() && document.body.classList.contains('reading')) { history.replaceState(null, '', location.pathname + location.search); route(); return; }
  if (cur) { renderEvent(); markTimeline(true); }
}

/* ---------- which event is open is the address after the # ---------- */
function go(id, replace) {
  if (cur && cur.id === id && document.body.classList.contains('reading')) return;
  const url = '#' + id;
  if (replace || (wide() ? false : document.body.classList.contains('reading'))) history.replaceState(history.state, '', url); else history.pushState({ inApp: true }, '', url);
  route();
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)), e = byId.get(id);
  if (e) { if (who && !e.people.includes(who)) { who = ''; renderTimeline(); } cur = e; document.body.classList.add('reading'); }
  else if (wide()) { cur = cur || shown()[0]; document.body.classList.add('reading'); }
  else { cur = null; document.body.classList.remove('reading'); document.title = 'Keeper’s Codex'; }
  renderEvent(); markTimeline(true);
}
addEventListener('popstate', () => { stop(); route(); });
addEventListener('hashchange', route);
let wasWide = wide();
addEventListener('resize', () => { if (wide() !== wasWide) { wasWide = wide(); route(); } });

/* ---------- sharing an event ---------- */
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }
$('share').onclick = async () => {
  if (!cur) return; stop();
  const url = location.origin + location.pathname + '#' + cur.id;
  try { if (navigator.share) { await navigator.share({ title: cur.title + ' · Keeper’s Codex', url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { toast(url); }
};

/* ---------- about and sources ---------- */
function openAbout() {
  $('about').innerHTML = `<button class="tb x" id="aboutX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3>About &amp; sources</h3>
    <p>Keeper’s Codex follows <b>Mosiah 29, Alma 1–63 and Helaman 1:1–34</b>: from the change to judges through Coriantumr’s capture of Zarahemla and its recovery. It holds ${EVENTS.length} major events, each written from, and linked to, its scripture passage.</p>
    <h4>Dates</h4><p>Years of the reign of the judges come first; BC dates are approximate (year 1 is about 91 BC). The mission accounts in Alma 17–27 overlap earlier chapters and have no exact year, so they sit by their nearest year and are marked “about”.</p>
    <h4>Illustrations</h4><p>Generated, interpretive images. Faces, clothing and buildings are artistic choices, not claims about Nephite life.</p>
    <h4>The map</h4><p>An interpretive model, not an archaeological reconstruction.</p>
    <h4>The data</h4><p><a href="data/register.json" download>Events with scripture references</a> · <a href="data/source-notes.md" download>Source and date notes</a></p>
    <p style="margin-top:22px;font:12px var(--ui);color:var(--faint)">${esc(VERSION)}</p>`;
  $('about').hidden = false; $('scrim').hidden = false; $('aboutX').onclick = closeAbout; $('aboutX').focus();
}
function closeAbout() { $('about').hidden = true; $('scrim').hidden = true; }
$('aboutBtn').onclick = openAbout; $('scrim').onclick = closeAbout;

/* ---------- start ---------- */
(async () => {
  try {
    const r = await fetch('data/register.json?v=c1a'); if (!r.ok) throw new Error(r.status);
    EVENTS = await r.json(); byId = new Map(EVENTS.map((e) => [e.id, e]));
  } catch (e) { $('load').textContent = 'The codex couldn’t load. Check the connection and open it again.'; return; }
  renderTimeline(); paintPlay(); route(); $('load').remove();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}); });
</script>
