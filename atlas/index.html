<script>
'use strict';
/* =====================================================================
   The Nephite Annals: one map, one timeline, one event at a time.
   Data (events, places, routes, city control) is filled in by build.py.
   ===================================================================== */
const EVENTS = [{"id":"E01","title":"The reign of judges begins","year":null,"dateLabel":"About 92–91 BC · transition to judges","category":"Government","summary":"With his sons unwilling to inherit the kingdom, Mosiah proposes judges chosen by the people, with higher and lower judges reviewing unjust judgments. The people accept, and Alma the younger becomes the first chief judge while retaining the high priesthood. Mosiah and Alma the elder die, ending the Nephite monarchy.","people":["Mosiah","Alma the younger","Alma the elder","Aaron"],"places":["Zarahemla"],"refs":[{"label":"Mosiah 29:1–47","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/29?lang=eng&id=p1#p1"}],"scene":"The people of Zarahemla gather in separate groups across a vast plaza to cast their voices for judges, while the aged King Mosiah watches from a high terrace.","chronologyNote":"Mosiah says he will remain king for the rest of his life (verse 11); this is a transition, not a violent deposition. It precedes the numbered years of the judges.","sortYear":0},{"id":"E02","title":"Nehor is tried for killing Gideon","year":1,"dateLabel":"Year 1 · about 91 BC","category":"Government","summary":"Nehor promotes paid religious leadership and kills the elderly teacher Gideon during a dispute. Brought before Alma, he is condemned under Mosiah’s law and executed on the hill Manti; his teaching continues to spread.","people":["Nehor","Gideon","Alma the younger"],"places":["Hill Manti"],"refs":[{"label":"Alma 1:1–17","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/1?lang=eng&id=p1#p1"}],"scene":"Nehor, a large, powerful man in costly clothing, stands bound before Alma's judgment seat after killing the aged Gideon.","chronologyNote":"The hill Manti is not identified here as the city or land of Manti; do not merge these locations."},{"id":"M01","title":"The sons of Mosiah depart","year":1,"dateLabel":"Year 1 · about 91 BC","category":"Faith","summary":"Having refused the kingdom, the sons of Mosiah leave Zarahemla to preach among the Lamanites. After prayer and fasting in the wilderness, they separate to begin their ministries.","people":["Ammon","Aaron","Omner","Himni"],"places":["Zarahemla","Nephi"],"refs":[{"label":"Alma 17:6–18","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/17?lang=eng&id=p6#p6"},{"label":"Alma 22:35","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/22?lang=eng&id=p35#p35"}],"scene":"On a misty mountain ridge at the edge of Lamanite lands, Ammon lays his hands on a brother's head to bless him before the four brothers take separate trails.","chronologyNote":"Alma 17:6 explicitly places their departure in the first year of the judges; the account is a flashback."},{"id":"M02","title":"Ammon defends the flocks","year":null,"dateLabel":"About 91 BC · mission begins","category":"Faith","summary":"Ammon becomes Lamoni’s servant in the land of Ishmael. At the waters of Sebus he gathers the scattered flocks and defends the servants against attackers with a sling and sword.","people":["Ammon","Lamoni"],"places":["Ishmael","Sebus"],"refs":[{"label":"Alma 17:19–39","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/17?lang=eng&id=p19#p19"}],"scene":"At the waters of Sebus, Ammon whirls his sling and releases a stone at raiders on the far bank, while the king's servants behind him gather the scattered flocks.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":1},{"id":"E03","title":"Persecution, work, and care for the poor","year":2,"dateLabel":"Years 2–4 · about 90–88 BC","category":"Faith","summary":"Religious persecution and contention trouble the Church, and some members leave. Those who remain share their resources with people in need, while priests and hearers return to their own labor after worship; peace continues until the fifth year.","people":["Alma the younger"],"places":["Zarahemla"],"refs":[{"label":"Alma 1:19–33","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/1?lang=eng&id=p19#p19"}],"scene":"In a narrow, muddy lane, a church member gently places a folded bundle of cotton cloth and maize cakes into the hands of a blind old beggar, while well-dressed men jeer from a doorway behind.","yearEnd":4},{"id":"M03","title":"Lamoni believes Ammon","year":null,"dateLabel":"About 90 BC · missionary period","category":"Faith","summary":"Ammon teaches Lamoni and his servants from the scriptures, explaining the Creation, the Fall, and redemption through Christ. Lamoni prays for mercy and falls as if dead; his family mourns while he lies upon a bed for two days and nights.","people":["Ammon","Lamoni"],"places":["Ishmael"],"refs":[{"label":"Alma 18:24–43","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/18?lang=eng&id=p24#p24"}],"scene":"King Lamoni cries out for mercy and collapses as if dead, and Ammon catches him before he strikes the floor.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":2},{"id":"M04","title":"Abish raises the queen","year":null,"dateLabel":"About 90 BC · missionary period","category":"Faith","summary":"After Lamoni awakens, he, the queen, Ammon, and the servants are overcome by the Spirit. Abish gathers the people and then takes the queen by the hand; the queen rises, Lamoni teaches the crowd, and many are baptized.","people":["Abish","Lamoni","Ammon","Lamoni’s wife"],"places":["Ishmael"],"refs":[{"label":"Alma 19:1–36","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/19?lang=eng&id=p1#p1"}],"scene":"The servant woman Abish takes the fallen queen by the hand and lifts her to her feet, while a quarreling crowd crams the doorway and the king, Ammon and servants lie still on the floor.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":2},{"id":"M05","title":"The prisoners of Middoni are freed","year":null,"dateLabel":"About 90 BC · missionary period","category":"Faith","summary":"Aaron and companions are rejected in Jerusalem and Ani-Anti and imprisoned in Middoni. Traveling to free them, Ammon protects Lamoni from his father and obtains the older king’s consent to their release and Lamoni’s independence. Lamoni then secures the prisoners’ release from Antiomno.","people":["Aaron","Muloki","Ammah","Ammon","Lamoni","Lamoni’s father","Antiomno"],"places":["Jerusalem","Ani-Anti","Middoni"],"refs":[{"label":"Alma 21:1–17","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/21?lang=eng&id=p1#p1"},{"label":"Alma 20:1–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/20?lang=eng&id=p1#p1"}],"scene":"Ammon kneels at the opening of a dark prison pit in Middoni and reaches down to his starved brother Aaron, who stretches up toward him, his wrists scarred by cords.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":2},{"id":"M06","title":"A king offers to give away his sins","year":null,"dateLabel":"About 90–77 BC · missionary period","category":"Faith","summary":"Aaron teaches Lamoni’s father in the land of Nephi. The king prays to know God and offers to give away his sins; after he falls as if dead, Aaron raises him, and the king’s household is converted.","people":["Aaron","Lamoni’s father","Lamoni’s father’s wife"],"places":["Nephi"],"refs":[{"label":"Alma 22:1–26","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/22?lang=eng&id=p1#p1"}],"scene":"Lamoni's father, the great Lamanite king, lies face down on the patterned floor of his palace, arms spread, offering to give away all his sins to know God, as Aaron stands over him.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":2},{"id":"M07","title":"The Anti-Nephi-Lehies take a new name","year":null,"dateLabel":"About 90–77 BC · missionary period","category":"Faith","summary":"A royal proclamation protects the missionaries, and many Lamanites are converted in several lands and cities. The converts take the name Anti-Nephi-Lehies; the king later transfers the kingdom to his son Anti-Nephi-Lehi and dies in the year preparations for war begin.","people":["Aaron","Ammon","Lamoni’s father","Anti-Nephi-Lehi"],"places":["Ishmael","Middoni","Nephi","Shilom","Shemlon","Lemuel","Shimnilom"],"refs":[{"label":"Alma 23:1–18","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/23?lang=eng&id=p1#p1"},{"label":"Alma 24:1–5","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/24?lang=eng&id=p1#p1"}],"scene":"On the terraces of a highland Lamanite village, converted families gather around a council circle where their leaders agree to take a new name, the Anti-Nephi-Lehies.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":3},{"id":"M08","title":"Weapons buried for peace","year":null,"dateLabel":"About 90–77 BC · before the first massacre","category":"Faith","summary":"Facing attack, the Anti-Nephi-Lehies refuse to prepare for war. They bury their swords and other weapons deep in the earth as a covenant that they will surrender their own lives rather than shed their brethren’s blood.","people":["Anti-Nephi-Lehi"],"places":["Nephi"],"refs":[{"label":"Alma 24:6–19","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/24?lang=eng&id=p6#p6"}],"scene":"The people of Anti-Nephi-Lehi drop their swords, clubs, bows and spears into a deep trench, burying them as a covenant never to shed blood again.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":4},{"id":"M09","title":"The unresisting people are attacked","year":null,"dateLabel":"About 90–77 BC · missionary period","category":"Warfare","summary":"The attackers kill 1,005 Anti-Nephi-Lehies who prostrate themselves and offer no resistance. Many attackers stop, repent, and lay down their own weapons; more people join the believers that day than were killed.","people":["Anti-Nephi-Lehi"],"places":["Nephi"],"refs":[{"label":"Alma 24:20–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/24?lang=eng&id=p20#p20"}],"scene":"A line of unarmed Anti-Nephi-Lehies lies prostrate on the earth praising God as Lamanite warriors charge at them, and the front warriors halt and throw down their weapons.","chronologyNote":"This episode belongs to the fourteen-year mission narrated retrospectively in Alma 17–27. The verses do not assign it an exact regnal year; the displayed BC date follows the chapter heading.","sortYear":4},{"id":"E04","title":"Amlici’s bid for a crown","year":5,"dateLabel":"Year 5 · about 87 BC","category":"Government","summary":"The people reject Amlici’s attempt to become king. His followers nevertheless consecrate him as their king, and he commands them to take up arms against the Nephites.","people":["Amlici"],"places":["Zarahemla"],"refs":[{"label":"Alma 2:1–14","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/2?lang=eng&id=p1#p1"}],"scene":"Amlici's followers raise him onto a timber platform at night and proclaim him their king, after the voice of the people has rejected him."},{"id":"E05","title":"Battle on the hill Amnihu","year":5,"dateLabel":"Year 5 · about 87 BC","category":"Warfare","summary":"Alma leads the Nephites against the Amlicites on a hill east of the Sidon. The Amlicites retreat after heavy losses; the Nephites camp in the valley of Gideon and send spies after them.","people":["Alma the younger","Amlici","Zeram","Amnor","Manti (spy)","Limher"],"places":["Hill Amnihu","River Sidon","Valley of Gideon"],"refs":[{"label":"Alma 2:15–22","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/2?lang=eng&id=p15#p15"}],"scene":"On the slopes of the hill Amnihu, east of the river Sidon, Alma's Nephite army breaks the Amlicite ranks, which begin to flee down toward the river."},{"id":"E06","title":"The battle at the Sidon crossing","year":5,"dateLabel":"Year 5 · about 87 BC","category":"Warfare","summary":"Spies report that the Amlicites have joined a Lamanite army in Minon and threaten Zarahemla. Returning toward the city, Alma’s army is attacked while crossing the Sidon; Alma kills Amlici, and the defeated enemy flees toward Hermounts.","people":["Alma the younger","Amlici","Zeram","Amnor","Manti (spy)","Limher"],"places":["Minon","River Sidon","Zarahemla","Hermounts"],"refs":[{"label":"Alma 2:23–38","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/2?lang=eng&id=p23#p23"}],"scene":"In the middle of the Sidon crossing, Alma raises his eyes in a desperate prayer as Amlici charges at him through waist-deep water, while Lamanite and Amlicite forces surge across the river behind."},{"id":"E07","title":"A second invasion is repelled","year":5,"dateLabel":"Year 5 · about 87 BC","category":"Warfare","summary":"Another Lamanite army enters the same region only days later. Alma remains behind because of a wound, while a Nephite army drives the invaders beyond their borders and restores a period of peace.","people":["Alma the younger"],"places":["Minon","Zarahemla"],"refs":[{"label":"Alma 3:20–27","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/3?lang=eng&id=p20#p20"}],"scene":"In the foreground, a field of grain lies trampled and broken, with a lost sandal and a cracked water jar; far behind, Nephite troops drive the second invading army back over a ridge.","chronologyNote":"Minon is the contextual location from Alma 2:24, not an independently named city in Alma 3:20."},{"id":"E08","title":"Mourning gives way to renewal","year":6,"dateLabel":"Years 6–7 · about 86–85 BC","category":"Faith","summary":"Loss of family members, livestock, and harvests leaves the people mourning after the war. Many are baptized in the Sidon; approximately 3,500 join the Church in the seventh year, during continued peace.","people":["Alma the younger"],"places":["River Sidon","Zarahemla"],"refs":[{"label":"Alma 4:1–5","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/4?lang=eng&id=p1#p1"}],"scene":"In the foreground, a mourning family kneels at fresh graves on the riverbank; beyond them, a long line of people waits in the misty river Sidon as Alma baptizes a man.","yearEnd":7},{"id":"E09","title":"Alma relinquishes the judgment seat","year":9,"dateLabel":"Year 9 · about 83 BC","category":"Government","summary":"Prosperity brings pride and inequality within the Church during the eighth year. At the beginning of the ninth, Alma transfers the chief judgeship to Nephihah, with the people’s voice, so he can devote himself to preaching; he retains the high priesthood.","people":["Alma the younger","Nephihah"],"places":["Zarahemla"],"refs":[{"label":"Alma 4:6–20","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/4?lang=eng&id=p6#p6"}],"scene":"Alma walks out of the judgment hall into the bright street to preach, leaving the stone judgment seat to Nephihah, who stands beside it with one hand resting on it.","chronologyNote":"The motivating social changes begin in year 8; the transfer is explicitly at the beginning of year 9."},{"id":"E10","title":"A call to change in Zarahemla","year":9,"dateLabel":"Year 9 · about 83 BC","category":"Faith","summary":"Alma asks the people whether they have experienced a change of heart and calls them to abandon pride, persecution, and neglect of the poor. He sets the Church in order, ordains leaders, and receives repentant people through baptism.","people":["Alma the younger"],"places":["Zarahemla"],"refs":[{"label":"Alma 5:1–62","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng&id=p1#p1"},{"label":"Alma 6:1–6","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/6?lang=eng&id=p1#p1"}],"scene":"In a Zarahemla street, Alma's call to repentance lands differently on two listeners: a proud man in costly clothing turns away, and a poor woman beside him weeps with her hand over her mouth."},{"id":"E11","title":"Alma teaches in Gideon","year":9,"dateLabel":"Year 9 · about 83 BC","category":"Faith","summary":"Across the Sidon in Gideon, Alma teaches of the coming Redeemer, who will bear his people’s afflictions and sins. He invites repentance and baptism and commends the people’s faith before returning home to Zarahemla.","people":["Alma the younger"],"places":["Gideon","River Sidon","Zarahemla"],"refs":[{"label":"Alma 6:7–8","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/6?lang=eng&id=p7#p7"},{"label":"Alma 7:1–27","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng&id=p1#p1"},{"label":"Alma 8:1–2","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/8?lang=eng&id=p1#p1"}],"scene":"In the valley of Gideon, Alma sits on the ground among a small group of faithful families in a shaded cacao orchard, gently teaching them."},{"id":"E12","title":"The ministry in Melek","year":10,"dateLabel":"Year 10 · about 82 BC","category":"Faith","summary":"Alma travels to Melek west of the Sidon, near the wilderness. People gather from the surrounding borders to hear him, and baptisms take place throughout the land before he travels north toward Ammonihah.","people":["Alma the younger"],"places":["Melek","Ammonihah"],"refs":[{"label":"Alma 8:3–6","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/8?lang=eng&id=p3#p3"}],"scene":"Families from the wilderness borders walk in a long line across open grassland toward a river, where Alma, a small figure in the distance, baptizes the first of them."},{"id":"E13","title":"An angel sends Alma back","year":10,"dateLabel":"Year 10 · about 82 BC","category":"Faith","summary":"Rejected and expelled from Ammonihah, Alma travels toward Aaron until an angel commands him to return. He enters from the south and is welcomed by Amulek, who has also received an angelic instruction; the two prepare to preach together.","people":["Alma the younger","Amulek"],"places":["Ammonihah","Aaron"],"refs":[{"label":"Alma 8:7–32","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/8?lang=eng&id=p7#p7"},{"label":"Alma 10:6–11","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/10?lang=eng&id=p6#p6"}],"scene":"On a muddy road in the rain, Alma, weighed down with sorrow after being cast out of Ammonihah, kneels with his head bowed, as a man in plain white clothing stands before him delivering God's command to return.","chronologyNote":"Amulek dates his own angelic encounter to day 4, month 7, year 10. Alma travels toward Aaron, but arrival there is not stated."},{"id":"E14","title":"Amulek refuses Zeezrom’s bribe","year":10,"dateLabel":"Year 10 · about 82 BC","category":"Faith","summary":"Alma and Amulek warn Ammonihah to repent. Zeezrom offers Amulek six onties of silver to deny God; Amulek refuses, exposes the deception, and teaches of redemption and resurrection.","people":["Alma the younger","Amulek","Zeezrom"],"places":["Ammonihah"],"refs":[{"label":"Alma 9:1–34","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/9?lang=eng&id=p1#p1"},{"label":"Alma 10:12–32","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/10?lang=eng&id=p12#p12"},{"label":"Alma 11:20–46","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/11?lang=eng&id=p20#p20"}],"scene":"In the crowded court of Ammonihah, Zeezrom holds out six pieces of silver on his open palm to Amulek, who pushes the hand away with his own raised palm."},{"id":"E15","title":"The plan of redemption is taught","year":10,"dateLabel":"Year 10 · about 82 BC","category":"Faith","summary":"Zeezrom begins sincerely questioning Alma, and Antionah raises a question about immortality. Alma explains resurrection, judgment, repentance, and the plan of redemption, then teaches about the holy priesthood and urges the people not to delay repentance.","people":["Alma the younger","Amulek","Zeezrom","Antionah"],"places":["Ammonihah"],"refs":[{"label":"Alma 12:1–37","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12?lang=eng&id=p1#p1"},{"label":"Alma 13:1–31","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/13?lang=eng&id=p1#p1"}],"scene":"As Alma speaks, the lawyer Zeezrom begins to tremble, sweating and clutching the edge of a table, the realization of his own guilt breaking through his pride."},{"id":"E16","title":"The martyrs of Ammonihah","year":10,"dateLabel":"Year 10 · about 82 BC","category":"Faith","summary":"Alma and Amulek are bound and accused; Zeezrom speaks in their defense but is expelled with other believers. Women, children, and their sacred records are burned, and Alma tells the anguished Amulek that the Spirit restrains him from intervening.","people":["Alma the younger","Amulek","Zeezrom"],"places":["Ammonihah"],"refs":[{"label":"Alma 14:1–17","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/14?lang=eng&id=p1#p1"}],"scene":"Alma and Amulek, bound with cords, are forced to watch the fire off-frame. Amulek strains forward to stop it, and Alma, bound beside him, lays his hand on Amulek's arm to hold him back."},{"id":"E17","title":"The prison falls","year":10,"dateLabel":"Year 10 · day 12, month 10 · about 82 BC","category":"Faith","summary":"After repeated abuse and deprivation, Alma prays for deliverance. Their bonds break, the earth shakes, and the prison collapses; Alma and Amulek emerge unharmed while those within the walls who had abused them perish.","people":["Alma the younger","Amulek"],"places":["Ammonihah"],"refs":[{"label":"Alma 14:18–29","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/14?lang=eng&id=p18#p18"}],"scene":"The walls of Ammonihah's prison crack and collapse in a towering cloud of dust, and Alma and Amulek walk calmly out through the rubble as terrified townspeople flee toward the viewer.","chronologyNote":"The passage explicitly gives day 12, month 10, year 10 (verse 23). The chapter heading spans about 82–81 BC."},{"id":"E18","title":"Zeezrom is healed in Sidom","year":10,"dateLabel":"End of year 10 · about 82–81 BC","category":"Faith","summary":"Alma and Amulek join the expelled believers in Sidom and tell them what happened in Ammonihah. Alma prays for the fever-stricken Zeezrom, who rises, is baptized, and begins preaching; a church is established.","people":["Alma the younger","Amulek","Zeezrom"],"places":["Sidom","Zarahemla"],"refs":[{"label":"Alma 15:1–19","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/15?lang=eng&id=p1#p1"}],"scene":"In a small house in Sidom, Zeezrom, burning with fever, grips Alma's hand and leaps up from his sleeping mat, suddenly whole, as his household gasps.","chronologyNote":"Alma 15:19 places this before the close of year 10; its editorial heading reads about 81 BC. Retain the textual regnal year rather than forcing an exact BC conversion."},{"id":"N01","title":"Amulek finds a home with Alma","year":10,"dateLabel":"End of year 10 · about 82–81 BC","category":"Faith","summary":"Amulek has given up his gold, silver and precious things and been rejected by his former friends, his father and his kindred. Alma takes him from Sidom to his own house in Zarahemla, ministers to him in his tribulations and strengthens him in the Lord.","people":["Alma the younger","Amulek"],"places":["Zarahemla"],"refs":[{"label":"Alma 15:16–18","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/15?lang=eng&id=p16-p18#p16"}],"scene":"At dusk, Alma leads the weary Amulek, rejected by his father and kin, through the doorway of his own house in Zarahemla, where his household waits with a lamp."},{"id":"E19","title":"Ammonihah is destroyed","year":11,"dateLabel":"Year 11 · day 5, month 2 · about 81 BC","category":"Warfare","summary":"A Lamanite army strikes from the wilderness before the Nephites can assemble a sufficient defense. Ammonihah is destroyed in one day, people near Noah are also killed, and other inhabitants are carried captive into the wilderness.","people":[],"places":["Ammonihah","Noah"],"refs":[{"label":"Alma 16:1–3, 9–11","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/16?lang=eng&id=p1#p1"}],"scene":"The city of Ammonihah lies empty and destroyed in a single day, its streets silent, its roofs burned away."},{"id":"E20","title":"Zoram rescues the captives","year":11,"dateLabel":"Year 11 · about 81 BC","category":"Warfare","summary":"Chief captain Zoram and his sons Lehi and Aha consult Alma about the captured people. Following the direction Alma receives, their army intercepts the Lamanites east of the Sidon beyond Manti and recovers every captive.","people":["Zoram (chief captain)","Lehi (son of Zoram)","Aha","Alma the younger"],"places":["Manti","River Sidon","South wilderness"],"refs":[{"label":"Alma 16:4–8","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/16?lang=eng&id=p4#p4"}],"scene":"At a jungle river ford in the south wilderness, rescued Nephite women and children run through the shallows into the arms of soldiers, as Zoram stands watch on a rock.","chronologyNote":"This Zoram is the chief captain in Alma 16, not Zoram from Lehi’s company. The text does not establish whether his son Lehi is the later commander Lehi."},{"id":"M10","title":"Persecution turns against the Amulonites","year":null,"dateLabel":"About 90–77 BC · after the attacks","category":"Faith","summary":"After attacking Ammonihah and suffering defeats against the Nephites, surviving descendants of Amulon put believing Lamanites to death by fire. Other Lamanites turn against these rulers; many survivors later join the Anti-Nephi-Lehies and bury their weapons.","people":["Aaron"],"places":["Ammonihah","Ishmael","Nephi"],"refs":[{"label":"Alma 25:1–17","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/25?lang=eng&id=p1#p1"}],"scene":"Painted Lamanite warriors cross a stream into an Anti-Nephi-Lehi village and lay their weapons on a pile before a village elder, choosing to join the people they had come to fight.","chronologyNote":"Alma 25 retrospectively connects this aftermath to Ammonihah’s destruction in Alma 16. Do not count the destruction as a second attack or infer a precise year for the later persecution.","sortYear":11},{"id":"E21","title":"The Church spreads through the land","year":12,"dateLabel":"Years 12–14 · about 80–78 BC","category":"Faith","summary":"During the years after the rescue, Alma, Amulek, and other teachers preach without excluding anyone willing to listen. They establish the Church widely and teach that Christ will appear to the people after his resurrection; the account closes with the fourteenth year.","people":["Alma the younger","Amulek"],"places":["Zarahemla"],"refs":[{"label":"Alma 16:12–21","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/16?lang=eng&id=p12#p12"}],"scene":"Alma and Amulek teach inside a synagogue built after the manner of the Jews, where farmers, merchants and elders sit together on benches around a raised reading platform, faces bright with joy.","chronologyNote":"This is a regional ministry, not an event fixed to one city. Verse 12 says renewed warfare begins in year 14; this entry does not claim uninterrupted peace through that entire year.","yearEnd":14},{"id":"M11","title":"Alma and the missionaries reunite","year":15,"dateLabel":"Year 15 · about 77 BC","category":"Faith","summary":"While the Anti-Nephi-Lehies wait near the border, Ammon and his brethren meet Alma on the journey toward Zarahemla. Ammon is overcome with joy, and Alma brings the missionaries to his house before they report to the chief judge.","people":["Alma","Ammon","Aaron","Omner","Himni"],"places":["Gideon","Manti","Zarahemla"],"refs":[{"label":"Alma 17:1–4","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/17?lang=eng&id=p1#p1"},{"label":"Alma 27:14–20","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/27?lang=eng&id=p14#p14"},{"label":"Alma 26:1–37","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng&id=p1#p1"},{"label":"Alma 29:1–17","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/29?lang=eng&id=p1#p1"}],"scene":"On a wilderness road near Manti, Ammon is so overcome with joy at meeting Alma that his strength leaves him and he sinks to his knees, as Alma catches him and the brothers crowd around, laughing and weeping.","chronologyNote":"The return is placed about 77 BC by the heading to Alma17 and before the close of year15 in Alma28. Gideon and Manti frame Alma’s journey; the exact meeting site is not named."},{"id":"M12","title":"Refuge in the land of Jershon","year":15,"dateLabel":"Year 15 · about 77 BC","category":"Migration","summary":"After renewed attacks, Ammon receives direction to lead the Anti-Nephi-Lehies out of the land of Nephi. By the voice of the people, the Nephites grant them Jershon and military protection in exchange for provisions to maintain the armies; they become known as the people of Ammon.","people":["Ammon","Alma","Anti-Nephi-Lehi"],"places":["Nephi","Zarahemla","Jershon"],"refs":[{"label":"Alma 27:1–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/27?lang=eng&id=p1#p1"}],"scene":"The people of Ammon, carrying their bundles and driving their flocks, walk into the land of Jershon by the sea, while a line of Nephite soldiers stands between them and the inland wilderness, facing outward to guard them.","chronologyNote":"Placed before the end of year15 by Alma28:1–9; the chapter27 heading gives the broader mission period."},{"id":"M13","title":"A tremendous battle and mourning","year":15,"dateLabel":"Year 15 · about 77 BC","category":"Warfare","summary":"Lamanite armies follow the refugees into the wilderness and fight a tremendous battle. The Nephites drive them back, but losses on both sides bring widespread mourning, fasting, and prayer.","people":["People of Ammon"],"places":["Jershon","Zarahemla"],"refs":[{"label":"Alma 28:1–14","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/28?lang=eng&id=p1#p1"},{"label":"Alma 30:1–4","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/30?lang=eng&id=p1#p1"}],"scene":"After a tremendous battle, the women and old men of Jershon mourn in the rain: a widow cries out to the sky with her torn mantle in her fists, and an old father holds his son's broken bow against his chest.","chronologyNote":"Alma28 closes year15; Alma30:2–4 places the ensuing peace in year16. The precise battlefield is not named."},{"id":"M14","title":"Korihor confronts Alma","year":17,"dateLabel":"Late year 17 · about 75–74 BC","category":"Faith","summary":"Korihor denies the coming of Christ and is brought before Alma and the chief judge after preaching in Zarahemla, Jershon, and Gideon. He demands a sign and loses his speech; he writes an acknowledgment and later dies after being trampled among the Zoramites.","people":["Korihor","Alma","Ammon","Giddonah","Zoram"],"places":["Zarahemla","Jershon","Gideon","Antionum"],"refs":[{"label":"Alma 30:5–60","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/30?lang=eng&id=p5#p5"}],"scene":"Struck dumb, Korihor kneels on the stone floor and writes with a trembling hand on a tablet that he cannot speak, while the chief judge and Alma look down at him.","chronologyNote":"Alma30:6 specifies the latter part of year17. The chapter heading spans approximately76–74BC; Antionum is identified as the Zoramite land in Alma31:3."},{"id":"M15","title":"Alma encounters the Rameumptom","year":17,"dateLabel":"Year 17 · about 74 BC","category":"Faith","summary":"Concerned that the Zoramites may join the Lamanites, Alma leads a mission to Antionum. They find worshippers offering identical prayers on a raised stand called the Rameumptom; Alma prays for strength and success for his companions.","people":["Alma","Ammon","Aaron","Omner","Amulek","Zeezrom","Shiblon","Corianton","Zoram"],"places":["Antionum"],"refs":[{"label":"Alma 31:1–38","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/31?lang=eng&id=p1#p1"},{"label":"Alma 35:12","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p12#p12"}],"scene":"A richly dressed Zoramite stands alone on top of the Rameumptom, a tall, narrow prayer stand, arms stretched toward the sky as he recites the same proud prayer, while Alma and his companions watch from below in grief.","chronologyNote":"The mission precedes the close of year17 in Alma35:12. Do not confuse this Zoram with the earlier servant of Laban."},{"id":"M16","title":"The word compared to a seed","year":17,"dateLabel":"Year 17 · about 74 BC","category":"Faith","summary":"On the hill Onidah, Alma teaches poor Zoramites who have been excluded from their synagogues, inviting them to exercise faith and nourish the word like a seed. He cites earlier prophets concerning Christ; Amulek follows with teachings on the Atonement, prayer, charity, and repentance.","people":["Alma","Amulek"],"places":["Onidah","Antionum"],"refs":[{"label":"Alma 32:1–43","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/32?lang=eng&id=p1#p1"},{"label":"Alma 33:1–23","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/33?lang=eng&id=p1#p1"},{"label":"Alma 34:1–41","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng&id=p1#p1"}],"scene":"On the rocky hill Onidah, the poor who were cast out of the synagogues for their coarse clothing crowd close around Alma, who kneels among them as a ragged man holds out his rough, work-scarred hands and asks what they should do.","chronologyNote":"The mission precedes the close of year17 in Alma35:12. Onidah here is a hill in the Zoramite mission; do not automatically equate it with the place of arms in Alma47."},{"id":"M17","title":"Jershon welcomes the expelled converts","year":17,"dateLabel":"End of year 17 · about 74 BC","category":"Migration","summary":"Zoramite rulers identify and expel those who believe the missionaries. The people of Ammon shelter, clothe, and give land to the refugees despite threats, while the hostile Zoramites join with the Lamanites and prepare for war.","people":["Alma","Amulek","People of Ammon"],"places":["Antionum","Jershon"],"refs":[{"label":"Alma 35:1–12","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p1#p1"}],"scene":"On a rainy night in Jershon, people of Ammon wrap their own mantles around exhausted, shivering Zoramite converts who have been cast out of their city, under a long thatched shelter lit by fires.","chronologyNote":"Alma35:12 explicitly closes year17 after these preparations."},{"id":"M18","title":"The people of Ammon move to Melek","year":18,"dateLabel":"Year 18 · about 74 BC","category":"Migration","summary":"The people of Ammon leave Jershon for Melek, making room for the Nephite armies as war begins. The expelled Zoramite converts have lands in Jershon and take up arms to defend their families and inheritance.","people":["People of Ammon"],"places":["Jershon","Melek"],"refs":[{"label":"Alma 35:13–14","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p13#p13"}],"scene":"At a river ford, the people of Ammon leave Jershon heading west with their bundles and flocks, while a Nephite army marches the other way to take up position in the land they are vacating.","chronologyNote":"Alma35:13 explicitly places the opening of the war in year18. The converts who take arms in verse14 are the expelled Zoramites, not the covenant-bound people of Ammon."},{"id":"M19","title":"Alma entrusts the sacred records to Helaman","year":null,"dateLabel":"About 74 BC · opening war period","category":"Faith","summary":"Alma recounts his conversion to Helaman and charges him to preserve the records, including the brass plates and twenty-four plates, and the interpreters. He uses the Liahona to teach trust in God and directs Helaman to withhold the secret oaths and plans of the destroyed people while teaching against their wickedness.","people":["Alma","Helaman"],"places":["Zarahemla"],"refs":[{"label":"Alma 35:14–16","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p14#p14"},{"label":"Alma 36:1–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?lang=eng&id=p1#p1"},{"label":"Alma 37:1–47","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/37?lang=eng&id=p1#p1"}],"scene":"By the light of one oil lamp, Alma's old hands place a stack of engraved metal plates into his son Helaman's hands; beside them on the table lie a plain round brass director and two stones set in a frame.","chronologyNote":"Alma35 introduces the separate charges after the mission; chapters36–42 are dated about74BC in their headings, rather than assigned a separate exact regnal year. Year18 is the surrounding narrative anchor.","sortYear":18},{"id":"M20","title":"Alma counsels faithful Shiblon","year":null,"dateLabel":"About 74 BC · opening war period","category":"Faith","summary":"Alma commends Shiblon for enduring bonds and stoning during the Zoramite mission. He urges humility, restraint, and continued service, teaching that salvation is through Christ.","people":["Alma","Shiblon"],"places":["Zarahemla"],"refs":[{"label":"Alma 35:14–16","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p14#p14"},{"label":"Alma 38:1–15","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/38?lang=eng&id=p1#p1"}],"scene":"At dawn, Alma and his son Shiblon walk slowly together along a city wall above Zarahemla, and Alma rests his hand on his son's shoulder as he speaks.","chronologyNote":"Chapter38 recounts earlier persecution; the counsel belongs to the charges introduced in Alma35. Year18 is the surrounding narrative anchor, not an explicit date in chapter38.","sortYear":18},{"id":"M21","title":"Alma calls Corianton back to his ministry","year":null,"dateLabel":"About 74 BC · opening war period","category":"Faith","summary":"Alma rebukes Corianton for abandoning his ministry to follow Isabel in Siron and for conduct that hindered belief among the Zoramites. He teaches him about resurrection, restoration, justice, mercy, and repentance, then commands him to preach truthfully and soberly.","people":["Alma","Corianton","Isabel"],"places":["Zarahemla","Siron","Antionum"],"refs":[{"label":"Alma 35:14–16","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/35?lang=eng&id=p14#p14"},{"label":"Alma 39:1–19","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/39?lang=eng&id=p1#p1"},{"label":"Alma 40:1–26","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/40?lang=eng&id=p1#p1"},{"label":"Alma 41:1–15","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/41?lang=eng&id=p1#p1"},{"label":"Alma 42:1–31","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42?lang=eng&id=p1#p1"}],"scene":"Late at night, Corianton sits on a stone bench with his head in his hands, and Alma stands at the far side of the room, about to cross toward him.","chronologyNote":"The counsel follows the Zoramite mission. Siron names the earlier misconduct’s location, not the location of this conversation; year18 is the surrounding narrative anchor.","sortYear":18},{"id":"W01","title":"The battle at the river Sidon","year":18,"dateLabel":"Year 18 of the judges · about 74 BC","category":"Warfare","summary":"Zerahemnah turns toward Manti after confronting Moroni’s armored forces near Jershon. Warned through Alma and informed by spies, Moroni and Lehi surround the invading army at the Sidon; after renewed fighting, the survivors surrender their weapons and covenant not to return to war.","people":["Moroni","Lehi","Zerahemnah","Alma"],"places":["Jershon","Antionum","Manti","River Sidon","Hill Riplah"],"refs":[{"label":"Alma 43:3–54","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/43?lang=eng&id=p3#p3"},{"label":"Alma 44:1–24","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/44?lang=eng&id=p1#p1"}],"scene":"On the banks of the river Sidon, Moroni raises his hand to stop his soldiers as the surrounded Lamanite army, pressed against the water, wavers in terror.","route":["Jershon","Manti"]},{"id":"N02","title":"Zerahemnah’s scalp","year":18,"dateLabel":"Year 18 of the judges · about 74 BC","category":"Warfare","summary":"Offered peace if his army gives up its weapons and covenants never to return, Zerahemnah refuses and rushes at Moroni. A Nephite soldier breaks his sword and cuts off his scalp, lifts it on the point of his sword and warns that the Lamanites will fall the same way unless they surrender and depart in peace. Many throw down their weapons.","people":["Moroni","Zerahemnah"],"places":["River Sidon","Manti"],"refs":[{"label":"Alma 44:1–15","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/44?lang=eng&id=p1-p15#p1"}],"scene":"A Nephite soldier lifts Zerahemnah's scalp, a dark tuft of hair, on the point of his sword and shouts a warning to the Lamanite army, while Zerahemnah stumbles back clutching his head and Lamanite warriors begin to drop their weapons."},{"id":"W02","title":"Alma’s last charge and departure","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Faith","summary":"Alma questions Helaman’s faith, entrusts him with a prophecy about the future destruction of the Nephites, and blesses his sons and the church. He then leaves Zarahemla as if going to Melek and is never heard from again; the record does not establish his death or burial.","people":["Alma","Helaman"],"places":["Zarahemla","Melek"],"refs":[{"label":"Alma 45:1–24","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/45?lang=eng&id=p1#p1"}],"scene":"Alma, now very old, walks away alone along a road from Zarahemla into the wilderness toward Melek, never to be seen again, while his son Helaman watches from the city wall.","chronologyNote":"The reported belief that Alma was taken by the Spirit is explicitly distinguished from known information in verses 18–19."},{"id":"W03","title":"Moroni raises the title of liberty","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Government","summary":"Amalickiah seeks kingship and attracts dissenters, including lower judges. Moroni raises a written piece of his torn coat and gathers a covenant-making people; Amalickiah escapes with a few followers, while captured followers are required to support freedom or face death.","people":["Moroni","Amalickiah","Helaman"],"places":["Zarahemla","Nephi"],"refs":[{"label":"Alma 46:1–37","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/46?lang=eng&id=p1#p1"}],"scene":"In a wind-whipped plaza, Moroni lifts a pole bearing a torn piece of his own red coat while the people run to him girding on their armor, tearing their garments and casting them at his feet as a covenant."},{"id":"W04","title":"Lehonti is betrayed at Antipas","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Government","summary":"Amalickiah persuades Lehonti to surround his army and appoint him second in command. He then has a servant administer poison by degrees until Lehonti dies, gaining command of the combined force.","people":["Amalickiah","Lehonti"],"places":["Onidah","Mount Antipas"],"refs":[{"label":"Alma 47:1–19","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/47?lang=eng&id=p1#p1"}],"scene":"At night on the slope of Mount Antipas, Amalickiah clasps Lehonti's forearm in a show of friendship, while behind him a servant waits in shadow holding a small clay vessel."},{"id":"W05","title":"Amalickiah takes the Lamanite throne","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Government","summary":"A servant of Amalickiah murders the Lamanite king during a greeting, and the conspirators blame the king’s fleeing servants. Amalickiah deceives the queen, marries her, and gains the kingdom; he then incites war against the Nephites.","people":["Amalickiah","Lamanite king","Lamanite queen"],"places":["Nephi"],"refs":[{"label":"Alma 47:20–36","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/47?lang=eng&id=p20#p20"},{"label":"Alma 48:1–6","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/48?lang=eng&id=p1#p1"}],"scene":"In the throne room of the city of Nephi, Amalickiah kneels in false sympathy before the grieving Lamanite queen, while his false witnesses point toward the doorway, blaming the king's fled servants.","chronologyNote":"The king and queen are unnamed in this passage. Neither is assigned a novel identity."},{"id":"W06","title":"The fortified cities hold","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Warfare","summary":"The invading army declines to attack rebuilt Ammonihah and marches to Noah, where Lehi commands unexpectedly strong defenses. Repeated assaults on the entrance and earthworks fail; more than a thousand attackers die, while no Nephite defender is killed.","people":["Lehi","Moroni","Amalickiah"],"places":["Ammonihah","Noah"],"refs":[{"label":"Alma 48:7–25","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/48?lang=eng&id=p7#p7"},{"label":"Alma 49:1–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/49?lang=eng&id=p1#p1"}],"scene":"From the top of the earth bank at the city of Noah, Lehi's defenders hurl stones and shoot arrows down into the ditch, where Lamanite soldiers try to dig at the bank with picks and climb it.","route":["Ammonihah","Noah"]},{"id":"N03","title":"Amalickiah swears an oath against Moroni","year":19,"dateLabel":"Year 19 of the judges · about 73 BC","category":"Warfare","summary":"When his armies return defeated from the fortified cities, Amalickiah is exceedingly angry. He curses God and Moroni and swears an oath that he will drink Moroni’s blood, because Moroni has kept the commandments of God in preparing for the safety of his people.","people":["Amalickiah","Moroni"],"places":["Land of Nephi"],"refs":[{"label":"Alma 49:25–30","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/49?lang=eng&id=p25-p30#p25"}],"scene":"In his throne room in the city of Nephi, Amalickiah, enraged by news of defeat, hurls a drinking cup to the floor and swears an oath against Moroni, while a messenger lies flat on the floor before him."},{"id":"W07","title":"Fortifications and new coastal cities","year":20,"dateLabel":"Years 20–23 · about 72–69 BC","category":"Government","summary":"Moroni strengthens cities with earth banks, timber works, pickets, and protected towers. After driving Lamanites from the east wilderness, the Nephites settle there and begin building Moroni, Nephihah, and Lehi; the following years bring prosperity and peace.","people":["Moroni"],"places":["Moroni","Nephihah","Lehi","Zarahemla"],"refs":[{"label":"Alma 50:1–24","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/50?lang=eng&id=p1#p1"}],"scene":"Moroni's people build a long line of earthworks topped with timber pickets and watchtowers stretching toward the east sea, as families arrive at the new city of Moroni with their goods.","yearEnd":23},{"id":"W08","title":"Morianton’s flight is stopped","year":24,"dateLabel":"Year 24 of the judges · about 68 BC","category":"Government","summary":"A land dispute between Morianton and Lehi leads Morianton’s people to plan a flight north. A mistreated maidservant warns Moroni; Teancum intercepts the dissenters near the narrow pass, kills Morianton in battle, and brings the survivors back to a peace settlement.","people":["Morianton","Teancum","Moroni","Morianton’s maidservant"],"places":["Morianton","Lehi","Desolation","Narrow pass"],"refs":[{"label":"Alma 50:25–36","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/50?lang=eng&id=p25#p25"}],"scene":"On a rainy night, a young maidservant who has fled Morianton bursts into Moroni's camp, soaked and breathless, and soldiers part as Moroni rises to hear her warning."},{"id":"W09","title":"Pahoran succeeds Nephihah","year":24,"dateLabel":"Year 24 of the judges · about 68 BC","category":"Government","summary":"Nephihah dies after serving as chief judge. His son Pahoran takes the judgment seat under an oath to judge righteously, preserve peace and freedom, and protect religious privileges.","people":["Nephihah","Pahoran"],"places":["Zarahemla"],"refs":[{"label":"Alma 50:37–40","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/50?lang=eng&id=p37#p37"}],"scene":"In the hall of judgment, the new chief judge Pahoran kneels as two elders lay the white judge's mantle over his shoulders, with Nephihah's empty seat before him.","chronologyNote":"The passage names the office but does not explicitly locate this ceremony; Zarahemla is used as the capital context, not an attested ceremony site."},{"id":"W10","title":"The king-men challenge the government","year":25,"dateLabel":"Year 25 of the judges · about 67 BC","category":"Government","summary":"The people uphold Pahoran and the free government against the king-men’s proposal for monarchy. When the king-men refuse to defend the country during an invasion, Moroni receives authority to compel them; four thousand dissenters are killed and surviving leaders are imprisoned.","people":["Pahoran","Moroni"],"places":["Zarahemla"],"refs":[{"label":"Alma 51:1–21","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/51?lang=eng&id=p1#p1"}],"scene":"In a Zarahemla plaza, the king-men in rich dress confront the freemen in plain dress, and Pahoran stands alone in the middle where the voice of the people will decide.","chronologyNote":"The text describes a national political conflict without naming one location for all its actions."},{"id":"W11","title":"Amalickiah captures the eastern cities","year":25,"dateLabel":"Year 25 of the judges · about 67 BC","category":"Warfare","summary":"While Moroni suppresses internal conflict, Amalickiah captures Moroni and advances along the eastern seashore, taking a chain of fortified cities. Teancum checks his advance at the borders of Bountiful.","people":["Amalickiah","Moroni","Teancum"],"places":["Moroni","Lehi","Morianton","Omner","Gid","Mulek","Bountiful","Nephihah"],"refs":[{"label":"Alma 51:22–32","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/51?lang=eng&id=p22#p22"}],"scene":"On the seashore at the borders of Bountiful, Teancum's warriors hold a line on the dunes against Amalickiah's advancing army as the sun sets, fighting until dark.","chronologyNote":"Alma 51:25 says Amalickiah avoided attacking Nephihah, but 51:26 includes it among captured cities; Alma 59 later narrates its fall in year 30. Preserve this textual tension rather than invent a recapture between them."},{"id":"W12","title":"Teancum kills Amalickiah","year":25,"dateLabel":"Year 25 of the judges · about 67 BC","category":"Warfare","summary":"After the day’s fighting, Teancum and his servant enter the enemy camp by night. Teancum kills the sleeping Amalickiah with a javelin and returns to prepare his own army; the Lamanites discover the death on the first morning of year 26.","people":["Teancum","Amalickiah","Teancum’s servant"],"places":["Bountiful"],"refs":[{"label":"Alma 51:33–37","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/51?lang=eng&id=p33#p33"},{"label":"Alma 52:1–2","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/52?lang=eng&id=p1#p1"}],"scene":"Inside a royal tent at night, Amalickiah sleeps in the foreground, and in the open tent flap behind him stands Teancum's silhouette, javelin raised, against the moonlit beach.","chronologyNote":"At the year 25–26 boundary. The camp is on the seashore at the borders of Bountiful, not in the city."},{"id":"W13","title":"Ammoron opens a western front","year":26,"dateLabel":"Years 26–27 · about 66–65 BC","category":"Warfare","summary":"Ammoron succeeds his brother Amalickiah and orders the eastern conquests held. He raises another army to attack near the west sea, while Moroni sends orders and reinforcements to Teancum in the east.","people":["Ammoron","Moroni","Teancum"],"places":["Mulek","Bountiful","Nephi"],"refs":[{"label":"Alma 52:1–18","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/52?lang=eng&id=p1#p1"}],"scene":"At dawn on the beach, Lamanite captains gather at the open royal tent and recoil in fear at finding Amalickiah dead, while far down the shore Teancum's army stands ready for battle.","yearEnd":27,"chronologyNote":"The western advance is near the west sea, without an exact route. Moroni arrives at Bountiful late in year 27."},{"id":"N04","title":"The mothers’ teaching","year":26,"dateLabel":"Year 26 of the judges · about 66 BC","category":"Faith","summary":"The young sons of the people of Ammon, whose fathers are bound by their covenant never to take up arms, go to war under Helaman. Their mothers had taught them that if they did not doubt, God would deliver them; when Helaman later asks whether they will fight, they answer, “We do not doubt our mothers knew it.”","people":["Helaman"],"places":["Melek"],"refs":[{"label":"Alma 53:16–21","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/53?lang=eng&id=p16-p21#p16"},{"label":"Alma 56:45–48","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/56?lang=eng&id=p45-p48#p45"}],"chronologyNote":"The young men’s answer comes in Helaman’s account of year 27 (Alma 56:47–48). The illustration sets the teaching on the night the sons leave home in year 26; placing that home in Melek follows Alma 35:13 and is an inference.","scene":"On the night before her son leaves for war, a mother of the people of Ammon kneels with him by the hearth, holding his face in her hands as she teaches him not to doubt, while his father, who has covenanted never to fight again, stands in the doorway."},{"id":"W14","title":"Two thousand sons join Helaman","year":26,"dateLabel":"Year 26 of the judges · about 66 BC","category":"Faith","summary":"The people of Ammon consider taking up arms, but Helaman urges them to keep their covenant. Two thousand sons who had not taken that oath covenant to defend the Nephites and ask Helaman to lead them; he brings them to strengthen Antipus at Judea.","people":["Helaman","Antipus"],"places":["Judea"],"refs":[{"label":"Alma 53:10–22","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/53?lang=eng&id=p10#p10"},{"label":"Alma 56:3–20","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/56?lang=eng&id=p3#p3"}],"scene":"At the half-built defenses of Judea, Antipus's weary, bandaged soldiers look up from their digging as Helaman leads a column of two thousand young men out of the morning fog toward them.","chronologyNote":"Alma 53 recounts this within a year-28 narrative; Helaman’s retrospective letter explicitly dates the enlistment and arrival to year 26 (Alma 56:7–9)."},{"id":"W15","title":"The young soldiers turn back to battle","year":27,"dateLabel":"Year 27 of the judges · about 65 BC","category":"Warfare","summary":"Helaman’s two thousand draw the army at Antiparah into a pursuit while Antipus follows behind. They return to aid Antipus’s hard-pressed force after he is killed; the enemy surrenders, and Helaman finds that none of his young soldiers has died.","people":["Helaman","Antipus"],"places":["Judea","Antiparah"],"refs":[{"label":"Alma 56:20–57","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/56?lang=eng&id=p20#p20"}],"scene":"On a jungle trail, Helaman's two thousand young soldiers stop their flight and turn around as one to go back to help the army of Antipus.","chronologyNote":"The pursuit culminates on the third day of the seventh month in the year-27 sequence; this is recounted in a letter received in year 30."},{"id":"W16","title":"Mulek is retaken by a feigned retreat","year":28,"dateLabel":"Year 28 of the judges · about 64 BC","category":"Warfare","summary":"Teancum draws Jacob’s army away from Mulek along the seashore while Moroni sends men into the city. Lehi meets the pursuers near Bountiful and drives them back toward Moroni; Jacob is killed, Moroni is wounded, and the surviving enemy is captured.","people":["Moroni","Teancum","Lehi","Jacob"],"places":["Mulek","Bountiful"],"refs":[{"label":"Alma 52:19–40","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/52?lang=eng&id=p19#p19"}],"scene":"Along the seashore, Teancum's small force retreats north, drawing a huge Lamanite army out of the fortified city of Mulek in pursuit, while behind them Moroni's men slip into the emptied city.","route":["Mulek","Bountiful"]},{"id":"W17","title":"Bountiful becomes a prison stronghold","year":28,"dateLabel":"Year 28 of the judges · about 64 BC","category":"Warfare","summary":"Lamanite prisoners bury the dead and are compelled to build a ditch and a high timber-and-earth wall around Bountiful. Moroni assigns Mulek to Lehi and spends the rest of the year strengthening defenses and securing food for soldiers and families.","people":["Moroni","Teancum","Lehi"],"places":["Bountiful","Mulek"],"refs":[{"label":"Alma 53:1–9","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/53?lang=eng&id=p1#p1"}],"scene":"Lamanite prisoners haul heavy timbers out of the deep ditch around Bountiful and raise them into a towering wall, under watch from guards on the bank above."},{"id":"W18","title":"Antiparah is abandoned","year":28,"dateLabel":"Year 28 of the judges · about 64 BC","category":"Warfare","summary":"Ammoron offers Antiparah in exchange for prisoners, but Helaman refuses to trade prisoners for a city he believes he can take. As Helaman prepares to attack, the occupying force withdraws to other cities and Antiparah falls into Nephite hands.","people":["Helaman","Ammoron"],"places":["Antiparah"],"refs":[{"label":"Alma 57:1–5","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/57?lang=eng&id=p1#p1"}],"scene":"Helaman's young soldiers walk warily into the deserted city of Antiparah, where doors hang open, pots are left on cold hearths and a single cooking fire still smokes."},{"id":"W19","title":"The prisoner exchange breaks down","year":29,"dateLabel":"Year 29 of the judges · about 63 BC","category":"Government","summary":"Moroni demands a captive man with his wife and children for each Lamanite prisoner. Ammoron accepts the exchange terms but insists on Nephite submission; Moroni rejects his continuing war aims and instead prepares to free the prisoners by stratagem.","people":["Moroni","Ammoron"],"places":["Gid"],"refs":[{"label":"Alma 54:1–24","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/54?lang=eng&id=p1#p1"},{"label":"Alma 55:1–7","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/55?lang=eng&id=p1#p1"}],"scene":"In his army tent, Moroni crushes Ammoron's insulting letter in his fist, his jaw tight with anger, while the Lamanite messenger waits stiffly at the tent door.","chronologyNote":"Gid is the prisoners’ location, not an explicitly established location for writing or receiving the letters."},{"id":"W20","title":"The prisoners of Gid are freed","year":29,"dateLabel":"Year 29 of the judges · about 63 BC","category":"Warfare","summary":"Laman, a former servant of the murdered Lamanite king, brings wine to Gid’s guards under a false claim of escape. Once the guards are drunk, Moroni arms the prisoners and surrounds the garrison; its morning surrender frees the captives without bloodshed.","people":["Moroni","Laman"],"places":["Gid","Bountiful"],"refs":[{"label":"Alma 55:4–35","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/55?lang=eng&id=p4#p4"}],"scene":"On a moonless night, bundles of swords and spears are lowered on cords over the wall of Gid into the reaching hands of Nephite prisoners below, while drunken Lamanite guards sleep slumped beside empty wine jars."},{"id":"W21","title":"Cumeni falls and survives a counterattack","year":29,"dateLabel":"Year 29 of the judges · about 63 BC","category":"Warfare","summary":"Helaman’s army intercepts Cumeni’s provisions until its garrison surrenders. Prisoner unrest and an enemy counterattack put the army in danger, but Gid’s returning escort and Helaman’s 2,060 young soldiers help hold the city; all the young men are wounded, yet none dies.","people":["Helaman","Gid","Ammoron"],"places":["Cumeni","Judea","Manti"],"refs":[{"label":"Alma 57:6–36","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/57?lang=eng&id=p6#p6"}],"scene":"As the Lamanites counterattack at Cumeni, Helaman's young soldiers hold their line without flinching, shields locked and atlatls drawn back, while older Nephite troops waver behind them."},{"id":"N05","title":"None were slain","year":29,"dateLabel":"Year 29 of the judges · about 63 BC","category":"Faith","summary":"After the fighting at Cumeni, Helaman finds that two hundred of his 2,060 young soldiers have fainted from loss of blood and every one has been wounded, yet not one has died. The whole army is astonished and ascribes their preservation to the miraculous power of God and their exceeding faith.","people":["Helaman"],"places":["Cumeni"],"refs":[{"label":"Alma 57:25–27","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/57?lang=eng&id=p25-p27#p25"}],"scene":"By torchlight after the battle of Cumeni, Helaman walks slowly along rows of wounded young soldiers lying on mats, counting them one by one and touching each head, astonished that not one has died."},{"id":"W22","title":"Prayer and stratagem recover Manti","year":29,"dateLabel":"Year 29 of the judges · about 63 BC","category":"Warfare","summary":"After months of scarce supplies, Helaman’s soldiers pray and receive assurance. Helaman draws the defenders into the wilderness while Gid and Teomner seize Manti; a night march brings Helaman back ahead of the enemy, which withdraws from that quarter.","people":["Helaman","Gid","Teomner"],"places":["Manti","Zarahemla","Nephi"],"refs":[{"label":"Alma 58:1–41","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/58?lang=eng&id=p1#p1"}],"scene":"On a hillside before dawn, Helaman's exhausted, hungry army kneels in prayer, and across the valley the watchfires of Manti burn on the opposite hill.","chronologyNote":"Late year 29, reported in a letter received at the start of year 30. Verse 21 describes guards being destroyed; verse 28’s phrase about taking Manti without bloodshed must not erase that detail."},{"id":"W23","title":"Nephihah falls as the armies await help","year":30,"dateLabel":"Year 30 of the judges · about 62 BC","category":"Warfare","summary":"Moroni receives Helaman’s report of western victories and requests reinforcements for him. Meanwhile, Lamanite forces reinforced by troops from the Manti region capture Nephihah; its survivors join Moroni, who becomes angry at the government’s failure to provide support.","people":["Moroni","Helaman","Pahoran","Ammoron"],"places":["Nephihah","Manti"],"refs":[{"label":"Alma 56:1","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/56?lang=eng&id=p1#p1"},{"label":"Alma 59:1–13","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/59?lang=eng&id=p1#p1"}],"scene":"At dusk on the road, Moroni listens to a soot-blackened captain report the fall of Nephihah, while a stream of refugees passes behind them and the city burns on the horizon.","chronologyNote":"Helaman’s letter is received on day 2 of month 1, year 30; the text gives no exact day for Nephihah’s fall. See the earlier Nephihah tension in W11."},{"id":"W24","title":"Pahoran reveals the rebellion","year":30,"dateLabel":"Year 30 of the judges · about 62 BC","category":"Government","summary":"Moroni accuses the government of neglecting the armies and threatens to intervene. Pahoran replies without anger: rebels have expelled him to Gideon, withheld supplies, and installed a king in Zarahemla allied with the Lamanites; he asks Moroni for help.","people":["Moroni","Pahoran"],"places":["Zarahemla","Gideon"],"refs":[{"label":"Alma 60:1–36","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/60?lang=eng&id=p1#p1"},{"label":"Alma 61:1–21","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/61?lang=eng&id=p1#p1"}],"scene":"Sitting on a rock outside his camp at morning, Moroni reads Pahoran's reply, and his hard, angry face softens into relief and joy as he learns that Pahoran was loyal all along.","chronologyNote":"The correspondence occurs in year 30. Pahoran describes a rebellion already underway; its beginning is not precisely dated."},{"id":"W25","title":"Pahoran is restored in Zarahemla","year":30,"dateLabel":"Year 30 of the judges · about 62 BC","category":"Government","summary":"Moroni gathers supporters on his march to Gideon and joins Pahoran. They defeat Pachus’s forces at Zarahemla, restore Pahoran to the judgment seat, and conduct trials of captured rebels and imprisoned king-men.","people":["Moroni","Pahoran","Pachus"],"places":["Gideon","Zarahemla"],"refs":[{"label":"Alma 62:1–11","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/62?lang=eng&id=p1#p1"}],"scene":"Moroni and Pahoran march side by side toward Zarahemla at the head of a swelling army of volunteers who have rallied to the standard of liberty, the torn red banner snapping above them.","route":["Gideon","Zarahemla"]},{"id":"W26","title":"Nephihah is recovered by night","year":31,"dateLabel":"Year 31 of the judges · about 61 BC","category":"Warfare","summary":"After supplies and reinforcements are dispatched to both fronts, Moroni and Pahoran march on Nephihah. Their men descend the unguarded western wall by cords and ladders at night; they retake the city without a Nephite death, and many captured Lamanites join the people of Ammon.","people":["Moroni","Pahoran"],"places":["Zarahemla","Nephihah"],"refs":[{"label":"Alma 62:12–29","url":"https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/62?lang=eng&id=p12#p12"}],"scene":"By moonlight, Moroni's soldiers climb strong cords and ladders up the outside of Nephihah's west wall, the first reaching the top, while the Lamanite army sleeps at the far east gate.","route":["Zarahemla","Nephihah"]},{"id":"W27","title":"Teancum’s final mission and the war’s end","year":31,"dateLabel":"Year 31 of the judges · about 61 BC","category":"Warfare","summary":"Moroni, Lehi, and Teancum drive the re function translate(pt, from, to) {
  const a = MAPS[from].cities, b = MAPS[to].cities, ks = Object.keys(a).filter((k) => b[k]);
  const solve = (axis) => { // least squares: out = c0*x + c1*y + c2
    const m = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], v = [0, 0, 0];
    for (const k of ks) { const r = [a[k][0], a[k][1], 1]; for (let i = 0; i < 3; i++) { v[i] += r[i] * b[k][axis]; for (let j = 0; j < 3; j++) m[i][j] += r[i] * r[j]; } }
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) { const f = m[j][i] / m[i][i]; for (let c = i; c < 3; c++) m[j][c] -= f * m[i][c]; v[j] -= f * v[i]; }
    const c = [0, 0, 0]; for (let i = 2; i >= 0; i--) { let t = v[i]; for (let j = i + 1; j < 3; j++) t -= m[i][j] * c[j]; c[i] = t / m[i][i]; }
    return c[0] * pt.x + c[1] * pt.y + c[2];
