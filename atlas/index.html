/* Keeper's Codex: a timeline first. The colours and type are Just Write's (near-black navy, warm cream, gold for what is
   active); the one Nephite element is the cut-stone corner, two small steps where a rounded corner would be. */
:root {

  --serif: 'Literata', 'Iowan Old Style', Palatino, Georgia, serif; --ui: 'Inter', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
  --top: calc(54px + env(safe-area-inset-top)); --step: 7px; --list-w: 400px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { overflow: hidden; -webkit-tap-highlight-color: transparent; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

  calc(100% - var(--step) * 2) 0, calc(100% - var(--step) * 2) var(--step), calc(100% - var(--step)) var(--step), calc(100% - var(--step)) calc(var(--step) * 2), 100% calc(var(--step) * 2),
  100% calc(100% - var(--step) * 2), calc(100% - var(--step)) calc(100% - var(--step) * 2), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step) * 2) calc(100% - var(--step)), calc(100% - var(--step) * 2) 100%,
  calc(var(--step) * 2) 100%, calc(var(--step) * 2) calc(100% - var(--step)), var(--step) calc(100% - var(--step)), var(--step) calc(100% - var(--step) * 2), 0 calc(100% - var(--step) * 2)); }

/* ---------- top bar ---------- */

/* ---------- the two panes: the timeline, and one event ---------- */

<body data-view="timeline">

<script>
'use strict';
/* =====================================================================
   Keeper's Codex: the timeline of events, one event at a time, and the map.
   Everything shown comes from two files: data/register.json (the events) and data/atlas.json (the maps: where each
   city sits on each map, routes, and which side the text last reports holding a city). Add eras there and they appear here.
   The address after the # says what is open: #W03 an event, #map the map, #map/W03 that event on the map.
   ===================================================================== */
const VERSION = 'Nov 13 · c7a';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CATS = [['War of the Judges', 'War of the Judges', 'var(--judges)'], ['Earlier wars', 'Earlier wars', 'var(--wars)'], ['Church', 'Church', 'var(--church)'], ['Mission', 'Sons of Mosiah', 'var(--mission)'], ['Political', 'Political', 'var(--political)'], ['Migration', 'Migration', 'var(--migration)']];
// the three ways to look at the timeline: scripture only, the novel only, or both together
const STORY = 'The Book of Coriantumr', TAG = 'Coriantumr', LENSES = [['canon', 'Canon'], ['story', STORY], ['mixed', 'Mixed']];
const CAT = Object.fromEntries(CATS.map(([k, l, c]) => [k, [l, c]]));
const cat = (e) => CAT[e.category] || [e.category, 'var(--muted)'];
const imgs = new Map();   // pictures added on this device while editing, by event
const art = (e, size) => imgs.get(e.id) || `assets/scenes/${size ? size + '/' : ''}${e.id}.${e.artExt || 'webp'}${e.artV ? '?v=' + e.artV : ''}`;
const GLYPH = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2h4v4h4v4h4v4h2v4h-2v4h-4v4h-4v4h-8v-4H8v-4H4v-4H2v-4h2v-4h4V6h4V2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const hasArt = (e) => imgs.has(e.id) || e.art !== false;
const isStory = (e) => e.source === 'story';
// a small picture of the event, or the empty frame that holds its place until an illustration exists
const thumb = (e, w, h, lazy) => (hasArt(e) ? `<img class="stone" ${lazy ? 'loading="lazy" decoding="async" ' : ''}width="${w}" height="${h}" src="${art(e, 'sm')}" alt="">` : `<span class="ph stone">${GLYPH}</span>`);
const wide = () => matchMedia('(min-width: 900px)').matches;
const keep = { get(k, d) { try { const v = localStorage.getItem('codex_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('codex_' + k, JSON.stringify(v)); } catch (e) {} } };
const PLAY = '<svg class="ic" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg>', PAUSE = '<svg class="ic" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="2.2"/></svg>';
const LEFT = '<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>', RIGHT = '<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>', CLOSE = '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

let ALL = [], lens = keep.get('lens', 'canon'), EVENTS = [], ATLAS = { maps: {}, changes: [] }, byId = new Map(), hay = new Map();
let view = 'timeline', cur = null, who = '', kind = '', query = '', playT = 0, city = '';

/* ---------- what the timeline is showing: a kind of event, a person, a search ---------- */
function shown() {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  return EVENTS.filter((e) => (!kind || e.category === kind) && (!who || e.people.includes(who)) && words.every((w) => hay.get(e).includes(w)));
}
const narrowed = () => !!(kind || who || query.trim());
// the events the chosen view holds; events past the end of the timeline stay in the file and are never shown
const live = (e) => !e.hidden && (author || (!e.removed && !e.draft));
function reindex() {
  byId = new Map(ALL.filter(live).map((e) => [e.id, e])); hay = new Map();
  for (const e of ALL) hay.set(e, [e.title, e.summary, e.dateLabel, cat(e)[0], ...e.people, ...e.places, ...e.refs.map((x) => x.label)].join(' ').toLowerCase());
  pick();
}
function pick() { EVENTS = ALL.filter((e) => live(e) && (lens === 'mixed' || (isStory(e) ? 'story' : 'canon') === lens)); }
function renderLens() { $('lens').innerHTML = LENSES.map(([k, l]) => `<button data-lens="${k}" aria-current="${lens === k}">${l}</button>`).join(''); }
$('lens').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-lens]'); if (!b || b.dataset.lens === lens) return;
  lens = b.dataset.lens; keep.set('lens', lens); pick(); renderLens();
  if (cur && !EVENTS.includes(cur)) { cur = null; city = ''; history.replaceState(history.state, '', addr(view, '')); }   // the open event isn't in this view
  narrow(); if (!cur) route();
});
function group(e) {
  if (e.year === null && !(e.sortYear > 0)) return ['Reign of Mosiah', 'about 124–91 BC'];
  if (e.year === null) return [`About year ${e.sortYear}`, 'mission account, undated'];
  return [e.yearEnd && e.yearEnd !== e.year ? `Years ${e.year}–${e.yearEnd}` : `Year ${e.year}`, (e.dateLabel.match(/about [^·]*/i) || [''])[0]];
}
function renderKinds() {
  $('kinds').innerHTML = (who ? `<button class="kind person" data-who="">${esc(who)}<i>✕</i></button>` : '')

    + CATS.map(([k, l, c]) => `<button class="kind" data-kind="${k}" aria-pressed="${kind === k}"><i class="dot" style="--c:${c}"></i>${l}</button>`).join('');

  }

}
function markTimeline(scroll) {
  const on = $('timeline').querySelector('.ev.on'); if (on) on.classList.remove('on');
  const el = cur && $('timeline').querySelector(`.ev[data-id="${cur.id}"]`); if (!el) return;
  el.classList.add('on');
  if (scroll) { const r = el.getBoundingClientRect(), t = $('timeline').getBoundingClientRect(); if (r.top < t.top + 60 || r.bottom > t.bottom - 20) $('timeline').scrollTop += r.top - t.top - t.height / 3; }
}
// the list changed: redraw it, and on a wide screen keep an event from the list open beside it
function narrow() {
  stop(); renderKinds(); renderTimeline(); $('timeline').scrollTop = 0;
  const list = shown();
  if (wide() && view === 'timeline' && list.length && !list.includes(cur)) { go(list[0].id, true); return; }
  if (cur) { if (view === 'timeline') paintNav(); else renderSheet(); markTimeline(true); }
}
$('timeline').addEventListener('click', (ev) => { const b = ev.target.closest('.ev'); if (b) go(b.dataset.id); });
$('kinds').addEventListener('click', (ev) => {
  const b = ev.target.closest('.kind'); if (!b) return;
  if (b.dataset.who != null) who = ''; else kind = b.dataset.kind;
  narrow();
});
let qT = 0;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { query = $('q').value; narrow(); }, 140); });
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { $('q').blur(); } else if (e.key === 'Escape' && $('q').value) { e.stopPropagation(); $('q').value = ''; query = ''; narrow(); } });
function setWho(name) {
  who = name || '';
  // on a phone, choosing a person goes back to the timeline to show their events
  if (who && !wide() && view === 'timeline' && document.body.classList.contains('reading')) { renderKinds(); renderTimeline(); $('timeline').scrollTop = 0; nav('timeline', null, true); return; }
  narrow(); if (cur && view === 'timeline') renderEvent();
}

/* ---------- one event ---------- */
const cities = () => (ATLAS.maps[mapKey] || { cities: {} }).cities;
const pinned = (e) => e.places.filter((p) => cities()[p]);
function renderEvent() {
  const e = cur, el = $('event'); if (!e) { el.innerHTML = ''; return; }
  if (author) { renderEdit(); return; }
  const [label, color] = cat(e), on = pinned(e);
  el.innerHTML = `<div class="page" style="--c:${color}">
    ${hasArt(e) ? `<div class="hero stone zoomable"><img class="lo" src="${art(e, 'sm')}" alt=""><img class="hi" alt="${esc(e.scene || e.title)}" src="${art(e, 'md')}" srcset="${art(e, 'md')} 900w, ${art(e)} 1536w" sizes="(min-width: 900px) min(820px, calc(100vw - 440px)), 100vw"></div>` : `<div class="hero stone"><div class="ph">${GLYPH}<span>Illustration to come</span></div></div>`}
    <div class="body">
      <div class="meta"><span class="cat"><i class="dot"></i>${esc(label)}</span><span>${esc(e.dateLabel)}</span>${isStory(e) ? `<span class="tag">${STORY} · not scripture</span>` : ''}</div>
      <h1>${esc(e.title)}</h1>
      <p class="sum">${esc(e.summary)}</p>
      ${e.chronologyNote ? `<p class="note">${esc(e.chronologyNote)}</p>` : ''}
      ${e.refs.length ? `<h2>Scripture</h2><div class="refs">${e.refs.map((r) => (r.url ? `<a class="stone" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}<small>Read ↗</small></a>` : `<span class="chip">${esc(r.label)}</span>`)).join('')}</div>` : ''}
      ${e.people.length ? `<h2>People</h2><div class="chips">${e.people.map((p) => `<button class="chip${p === who ? ' on' : ''}" data-who="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}
      ${e.places.length ? `<h2>Places</h2><div class="chips">${e.places.map((p) => cities()[p] ? `<button class="chip place" data-city="${esc(p)}" aria-label="${esc(p)}: show on the map">${esc(p)}</button>` : `<span class="chip">${esc(p)}</span>`).join('')}</div>` : ''}
      ${on.length ? '' : '<p class="offmap">Not on the map</p>'}
    </div></div>`;
  const hi = el.querySelector('.hi'); if (hi) { const done = () => hi.classList.add('in'); if (hi.complete && hi.naturalWidth) done(); else hi.addEventListener('load', done, { once: true }); }
  el.scrollTop = 0;
  paintNav();
  document.title = e.title + ' · Keeper’s Codex';
}
// previous and next follow the timeline as it is showing; an event outside it steps through every event
function around(e) { const s = shown(), list = s.includes(e) ? s : EVENTS, i = list.indexOf(e); return [list[i - 1], list[i + 1]]; }
function paintNav() {
  if (!cur) return; const [p, n] = around(cur);
  $('prev').disabled = !p; $('next').disabled = !n;
  $('prev').querySelector('span').textContent = p ? p.title : ''; $('next').querySelector('span').textContent = n ? n.title : '';
  if (n && hasArt(n)) { const im = new Image(); im.src = art(n, view === 'map' ? 'sm' : 'md'); }   // fetched ahead, so stepping forward doesn't wait
}
function step(d) { if (!cur) return false; const t = around(cur)[d < 0 ? 0 : 1]; if (t) go(t.id, true); return !!t; }
$('event').addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-act]'); if (a && author && cur) { editAct(a.dataset.act); return; }
  const c = ev.target.closest('[data-who]'); if (c) { setWho(c.dataset.who === who ? '' : c.dataset.who); return; }
  const p = ev.target.closest('[data-city]'); if (p && cur) { city = ''; nav('map', cur.id); focusOn([p.dataset.city]); }
});
$('prev').onclick = () => { stop(); step(-1); };
$('next').onclick = () => { stop(); step(1); };
$('back').onclick = () => { stop(); if (history.state && history.state.inApp) history.back(); else nav('timeline', null, true); };
(() => { let x = 0, y = 0, on = false;   // a sideways swipe on the event moves to the next or the previous one
  $('event').addEventListener('touchstart', (e) => { on = e.touches.length === 1; if (on) { x = e.touches[0].clientX; y = e.touches[0].clientY; } }, { passive: true });
  $('event').addEventListener('touchend', (e) => { if (!on || author) return; on = false; const t = e.changedTouches[0], dx = t.clientX - x, dy = t.clientY - y; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) { stop(); step(dx < 0 ? 1 : -1); } }, { passive: true });
})();
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if (!$('zoom').hidden) closeZoom(); else if (!$('about').hidden) closeAbout(); else if (view === 'map' && city) { city = ''; renderSheet(); drawPins(); } else if (!wide() && document.body.classList.contains('reading')) $('back').click(); return; }
  if (!$('about').hidden || !$('zoom').hidden) return;
  const typing = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  if (e.key === '/' && !typing) { e.preventDefault(); if (!wide() && view !== 'timeline') nav('timeline', null); $('q').focus(); return; }
  if (typing || !cur) return;
  if (e.key === 'ArrowRight') { stop(); step(1); } else if (e.key === 'ArrowLeft') { stop(); step(-1); }
});

/* ---------- playing through the events ---------- */
function paintPlay() { $('play').innerHTML = playT ? PAUSE : PLAY; $('play').classList.toggle('on', !!playT); $('play').setAttribute('aria-pressed', String(!!playT)); $('play').setAttribute('aria-label', playT ? 'Pause' : 'Play through the events'); }
function stop() { if (!playT) return; clearInterval(playT); playT = 0; paintPlay(); }
$('play').onclick = () => { if (playT) { stop(); return; } playT = setInterval(() => { if (document.hidden) return; if (!step(1)) stop(); }, 9000); paintPlay(); };
$('event').addEventListener('pointerdown', stop);

/* =====================================================================
   the map
   ===================================================================== */
let mapKey = keep.get('map', 'painted'), showCtrl = keep.get('control', true), W = 1, H = 1, mapShown = false;
const mv = { s: 1, x: 0, y: 0 };
const mapBox = () => $('map').getBoundingClientRect();
const fitS = () => { const b = mapBox(); return Math.max(b.width / W, b.height / H); };       // fills the pane
const minS = () => { const b = mapBox(); return Math.min(b.width / W, b.height / H) * .98; };  // the whole map
function clamp() {
  const b = mapBox();

function apply(anim) {

function zoomAt(cx, cy, k, anim) { const s0 = mv.s; mv.s *= k; clamp(); const r = mv.s / s0; mv.x = cx - (cx - mv.x) * r; mv.y = cy - (cy - mv.y) * r; clamp(); apply(anim); }
function wholeMap(anim) { const b = mapBox(); mv.s = fitS(); mv.x = (b.width - W * mv.s) / 2; mv.y = (b.height - H * mv.s) / 2; clamp(); apply(anim); }
// bring some cities into view, clear of the card at the bottom
function focusOn(names, force) {
  const c = cities(), pts = names.map((n) => c[n]).filter(Boolean); if (!pts.length || !mapShown) return;
  const b = mapBox(), sh = $('sheet'), under = sh.hidden ? 0 : wide() ? 0 : sh.getBoundingClientRect().height + 16, left = !sh.hidden && wide() ? Math.min(420, b.width * .45) : 0, pad = Math.min(120, b.width * .16);   // room for the painted name beside each city
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), x1 = Math.min(...xs), x2 = Math.max(...xs), y1 = Math.min(...ys), y2 = Math.max(...ys);

  if (inView && !force) return;
  const want = Math.min((aw - pad * 2) / Math.max(1, x2 - x1), (ah - pad * 2) / Math.max(1, y2 - y1));
  mv.s = Math.min(fitS() * 2, Math.max(fitS() * 1.15, want));
  mv.x = left + aw / 2 - ((x1 + x2) / 2) * mv.s; mv.y = ah / 2 - ((y1 + y2) / 2) * mv.s;

}
function loadMap() {
  const m = ATLAS.maps[mapKey] || ATLAS.maps[mapKey = Object.keys(ATLAS.maps)[0]]; if (!m) return;
  W = m.w; H = m.h; const land = $('land'); land.style.width = W + 'px'; land.style.height = H + 'px';

      <label for="eRefs">Scripture, one per line</label><textarea id="eRefs" data-f="refs" rows="2" placeholder="Alma 46:1–37">${v(e.refs.map((r) => r.label).join('\n'))}</textarea>
      <label class="check"><input data-f="visible" type="checkbox"${e.draft ? '' : ' checked'}>Visitors can see this</label>
    </div></div>`;
  painting = false; el.scrollTop = 0; paintNav(); document.title = e.title + ' · Keeper’s Codex';
}
// the event a field on the page belongs to (the page can be on its way out when a field reports its last change)
let painting = false;
const fieldEvent = (t) => { const pg = t.closest && t.closest('.page.editing'); return pg ? ALL.find((x) => x.id === pg.dataset.id) : null; };
// typing goes straight into the event
$('event').addEventListener('input', (ev) => {
  const t = ev.target, f = t.dataset && t.dataset.f, e = fieldEvent(t); if (!author || !f || !e || t.type === 'checkbox' || t.type === 'file' || t.tagName === 'SELECT' || f === 'year') return;
  const text = t.isContentEditable ? t.innerText : t.value;
  if (f === 'title') e.title = text.replace(/\s+/g, ' ').trim(); else if (f === 'people' || f === 'places') e[f] = listOf(text);
  else if (f === 'refs') e.refs = text.split('\n').map((x) => x.trim()).filter(Boolean).map((l) => refFrom(l, e.refs)); else e[f] = text.trim();
  soon();
});
$('event').addEventListener('change', (ev) => {
  const t = ev.target, f = t.dataset && t.dataset.f, e = fieldEvent(t); if (!author || !e) return;
  if (t.id === 'fImg') { if (t.files[0]) setImage(e, t.files[0]); return; }
  if (!f || !(t.type === 'checkbox' || t.tagName === 'SELECT' || f === 'year')) return;
  if (f === 'visible') { if (t.checked) delete e.draft; else e.draft = true; }
  else if (f === 'year') {
    e.year = t.value.trim() === '' ? null : +t.value; delete e.yearEnd;
    if (e.year !== null) { if (!e.dateLabel || /^(about year|years? )\d/i.test(e.dateLabel) || /^about \d+ BC/i.test(e.dateLabel)) e.dateLabel = `Year ${e.year} · about ${92 - e.year} BC`; relocate(e); }
  } else e[f] = t.value;
  touch(); if (painting || e !== cur) return;
  if (!EVENTS.includes(e)) { lens = 'mixed'; keep.set('lens', lens); pick(); renderLens(); renderTimeline(); }
  renderEdit(); markTimeline(true);
});
async function setImage(e, file) {
  try {
    const src = URL.createObjectURL(file), im = new Image(); im.src = src; await im.decode();
    const k = Math.min(1, 1600 / im.naturalWidth), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(src);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', .86));
    await idb.put('img:' + e.id, blob);
    if (imgs.has(e.id)) URL.revokeObjectURL(imgs.get(e.id)); imgs.set(e.id, URL.createObjectURL(blob));
    touch(); if (cur === e) renderEdit(); markTimeline(false);
  } catch (err) { toast('That picture couldn’t be added'); }
}
function editAct(k) {
  const e = cur;
  if (k === 'add') addAfter(e); else if (k === 'up' || k === 'down') move(e, k === 'up' ? -1 : 1);
  else {
    if (k === 'gone') { if (e.removed) delete e.removed; else e.removed = true; }
    else if (k === 'noimg') { if (imgs.has(e.id)) { URL.revokeObjectURL(imgs.get(e.id)); imgs.delete(e.id); idb.del('img:' + e.id).catch(() => {}); } else { e.artWas = true; e.art = false; } }
    else if (k === 'origimg') { delete e.art; delete e.artWas; }
    touch(); renderEdit(); markTimeline(false);
  }
}
/* ---------- one file holding all the work: the events and the pictures added ---------- */
const asDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function backup() {
  flush(); const images = {};
  try { for (const id of imgs.keys()) images[id] = await asDataURL(await idb.get('img:' + id)); } catch (e) { toast('Couldn’t read the pictures for the backup'); return; }
  const file = new File([JSON.stringify({ codexBackup: 1, at: new Date().toISOString(), data: ALL, images })], `keepers-codex-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); toast('Backup file saved');
}
async function restore(file) {
  try {
    const b = JSON.parse(await file.text()); if (!b || !b.codexBackup || !Array.isArray(b.data)) throw new Error('not a backup');
    await idb.put('draft-before-restore', { data: ALL, at: Date.now() });   // what was here is kept aside, not thrown away
    for (const k of await idb.keys()) if (String(k).startsWith('img:')) await idb.put('old-' + k, await idb.get(k)), await idb.del(k);
    for (const [id, url] of Object.entries(b.images || {})) await idb.put('img:' + id, await (await fetch(url)).blob());
    await idb.put('draft', { data: b.data, at: Date.now() }); location.reload();
  } catch (e) { toast('That file isn’t a Keeper’s Codex backup'); }
}

/* ---------- start ---------- */
(async () => {
  try {
    const [r, a] = await Promise.all([fetch('data/register.json?v=c7a'), fetch('data/atlas.json?v=c7a')]);
    if (!r.ok) throw new Error(r.status);
    ALL = await r.json(); if (a.ok) ATLAS = await a.json();
    if (!LENSES.some(([k]) => k === lens)) lens = 'canon';
    await authorStart(); reindex();
    if (!ATLAS.maps[mapKey]) mapKey = Object.keys(ATLAS.maps)[0] || '';
  } catch (e) { $('load').textContent = 'The codex couldn’t load. Check the connection and open it again.'; return; }
  renderLens(); renderAuthor(); renderKinds(); renderTimeline(); paintPlay();
  route(); $('load').remove();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}); });
</script>
