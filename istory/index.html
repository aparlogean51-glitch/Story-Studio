<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iStory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iStory">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#121316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* iStory: a quiet desk at night. Story content is set in a book serif; the few controls are small and grey until touched.
   Colour is kept for meaning only: BUT is warm, THEREFORE is cool, AND THEN is a faint amber flag. */
:root {
  --bg: #121316; --raise: #191a1e; --card: #1e2025; --card-hi: #262830; --line: #2a2c33; --line-hi: #3a3d46;
  --ink: #e9e6df; --muted: #9a9890; --faint: #64625c; --accent: #9db7e6;
  --but: #e39a7c; --therefore: #8fb2e6; --and: #c9a35e; --done: #7fbf9a;
  --desk: #121316; --paper: #1a1c21; --rule: #262a33; --stroke: #c9d6f7; --hover: #23252b; --shadow: rgba(0,0,0,.55);
  --serif: 'Literata', 'Iowan Old Style', Palatino, Georgia, serif; --ui: 'Inter', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
  --doc-size: 21px; --top: 52px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); position: fixed; inset: 0; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.noselect, .card, .lcard, .beat .tick, #top { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* ---------- top bar ---------- */
#top { position: absolute; left: 0; right: 0; top: 0; height: var(--top); display: flex; align-items: center; gap: 4px; padding: 0 10px 0 14px; z-index: 20; background: var(--bg); }
.tab { height: 40px; padding: 0 12px; border-radius: 10px; color: var(--faint); font-weight: 500; font-size: 15px; }
.tab[aria-current="true"] { color: var(--ink); }
.tab .n { color: var(--faint); font-size: 13px; margin-left: 4px; font-variant-numeric: tabular-nums; }
#back { height: 40px; padding: 0 10px 0 6px; border-radius: 10px; color: var(--muted); display: flex; align-items: center; gap: 2px; font-size: 15px; }
#titleBtn { flex: 0 1 auto; min-width: 60px; max-width: 46vw; height: 40px; display: flex; align-items: center; gap: 6px; font: 500 18px var(--serif); padding: 0 8px; border-radius: 10px; }
#titleBtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#titleBtn.empty span { color: var(--faint); font-style: italic; }
#titleBtn svg.i { width: 16px; height: 16px; color: var(--faint); }
#titleBtn:active { background: var(--hover); }
.steps { display: flex; background: var(--raise); border-radius: 11px; padding: 3px; gap: 2px; margin-right: 6px; }
.steps button { height: 34px; padding: 0 16px; border-radius: 8px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
.steps button[aria-selected="true"] { background: var(--card-hi); color: var(--ink); }
.spacer { flex: 1; }
.tb { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; position: relative; white-space: nowrap; }
.tb:active, .tb.on { background: var(--hover); color: var(--ink); }
.tb[aria-pressed="true"] { color: var(--ink); background: var(--hover); }
.pill { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-hi); color: var(--muted); font-size: 13px; }
#menuBtn .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
#menuBtn .dot.warn { background: var(--and); } #menuBtn .dot.bad { background: #e5675e; }

/* ---------- views ---------- */
.view { position: absolute; left: 0; right: 0; top: var(--top); bottom: 0; }
#banner { position: absolute; z-index: 30; top: calc(var(--top) + 6px); left: 50%; transform: translateX(-50%); max-width: min(620px, calc(100% - 24px)); display: flex; align-items: center; gap: 12px;
  background: #3a2622; color: #f2c3b4; border-radius: 12px; padding: 10px 10px 10px 16px; font-size: 14px; box-shadow: 0 8px 26px var(--shadow); }
#banner button { color: #f2c3b4; height: 32px; padding: 0 10px; border-radius: 8px; }

/* ---------- the timeline board ---------- */
#board { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 18px 0 120px; }
.part { padding: 0 0 18px; }
.part-head { position: sticky; left: 0; display: inline-block; padding: 14px 24px 8px; }
.lbl-btn { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 4px 0; text-align: left; }
.lbl-btn b { color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: stretch; min-height: 210px; }
.act-lbl { position: sticky; left: 0; z-index: 3; flex: none; width: 150px; padding: 16px 14px 0 24px; background: linear-gradient(90deg, var(--bg) 82%, rgba(18,19,22,0)); display: flex; flex-direction: column; gap: 4px; }
.act-lbl .no { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.act-lbl .nm { font: 500 15px/1.3 var(--serif); color: var(--muted); text-align: left; padding: 0; }
.act-lbl .nm.empty { color: var(--faint); font-style: italic; }
.track { display: flex; align-items: flex-start; gap: 16px; padding: 10px 40px 18px 4px; border-bottom: 1px solid var(--line); flex: 1; }
.seq { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; border-radius: 16px; background: var(--raise); min-width: 240px; }
.seq.drop { box-shadow: 0 0 0 2px var(--accent) inset; }
.seq-head { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 2px; }
.seq-no { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--faint); }
.seq-name { font: 500 16px/1.3 var(--serif); text-align: left; padding: 2px 4px; border-radius: 6px; min-width: 40px; }
.seq-name.empty { color: var(--faint); font-style: italic; }
.seq-idea { font: italic 13.5px/1.4 var(--serif); color: var(--muted); text-align: left; padding: 0 6px; max-width: 520px; min-height: 18px; }
.seq-idea.empty { color: var(--faint); opacity: .0; min-height: 4px; height: 4px; overflow: hidden; }
.seq:hover .seq-idea.empty, .seq.editing .seq-idea.empty { opacity: 1; height: auto; }
.seq-tools { margin-left: auto; display: flex; gap: 2px; }
.seq-tools .tb { height: 30px; min-width: 32px; padding: 0 6px; color: var(--faint); }
.cards { display: flex; gap: 10px; align-items: stretch; position: relative; min-height: 120px; }
.ins { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.card { width: 196px; flex: none; min-height: 120px; border-radius: 12px; background: var(--card); padding: 11px 13px 10px; display: flex; flex-direction: column; gap: 4px; position: relative; cursor: pointer; touch-action: pan-x pan-y; }
.card:active { background: var(--card-hi); }
.card .no { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.card .t { font: 500 15.5px/1.3 var(--serif); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .t.empty { color: var(--faint); font-style: italic; }
.card .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .f { margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 6px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.card .bdots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 120px; }
.card .bdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-hi); }
.card .bdots i.on { background: var(--done); }
.card .f .w { margin-left: auto; }
.card.target { box-shadow: 0 0 0 2px var(--accent); }
.card .gap { display: none; position: absolute; top: 9px; right: 10px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; }
body.gaps .card.g-nobeats { box-shadow: 0 0 0 1.5px var(--line-hi) inset; background: transparent; }
body.gaps .card.g-nobeats .gap, body.gaps .card.g-nopages .gap, body.gaps .card.g-weak .gap { display: block; }
body.gaps .card.g-nobeats .gap { color: var(--muted); background: var(--hover); }
body.gaps .card.g-nopages .gap { color: var(--therefore); background: rgba(143,178,230,.12); }
body.gaps .card.g-weak .gap { color: var(--and); background: rgba(201,163,94,.14); }
.add-card { width: 46px; flex: none; border-radius: 12px; color: var(--faint); font-size: 22px; border: 1.5px dashed var(--line-hi); }
.add-card:active { color: var(--ink); }
.add-seq { flex: none; align-self: center; height: 44px; padding: 0 16px; border-radius: 12px; color: var(--faint); font-size: 14px; border: 1.5px dashed var(--line); white-space: nowrap; }
.add-act, .add-part { margin: 8px 0 0 24px; height: 36px; padding: 0 12px; border-radius: 10px; color: var(--faint); font-size: 13px; position: sticky; left: 24px; }
.loose-row { margin-top: 10px; display: flex; align-items: flex-start; }
.loose-row .track { border: 0; flex-wrap: nowrap; }
.card.light { background: transparent; box-shadow: 0 0 0 1.5px var(--line-hi) inset; }
.card .kind { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.ghost { position: fixed; z-index: 60; pointer-events: none; opacity: .94; transform: rotate(-1.5deg) scale(1.03); box-shadow: 0 18px 40px var(--shadow); }
.lifted { opacity: .25; }

/* ---------- Loose Pages ---------- */
#loose { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.loose-wrap { max-width: 1180px; margin: 0 auto; padding: 18px 26px 120px; }
.loose-add { display: flex; gap: 8px; margin-bottom: 18px; }
.loose-add button { height: 40px; padding: 0 16px; border-radius: 10px; color: var(--muted); border: 1px solid var(--line); font-size: 14px; }
.loose-add button:active { background: var(--hover); color: var(--ink); }
#looseGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.lcard { min-height: 170px; border-radius: 14px; background: var(--raise); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; touch-action: pan-y; }
.lcard:active { background: var(--card); }
.lcard .kind { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.lcard .kind.beats { color: var(--but); } .lcard .kind.scene { color: var(--therefore); }
.lcard .t { font: 500 16px/1.3 var(--serif); }
.lcard .p { font: 14px/1.5 var(--serif); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.lcard .p .lk { font: 600 10px var(--ui); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; padding: 0; }
.lcard .p.beats { white-space: normal; -webkit-line-clamp: 6; }
.lcard .p.beats .lk.and { color: var(--and); } .lcard .p.beats .lk.but { color: var(--but); } .lcard .p.beats .lk.therefore { color: var(--therefore); }
.empty-note { color: var(--faint); font: italic 15px var(--serif); padding: 40px 0; text-align: center; }

/* ---------- a scene / loose item ---------- */
/* the beats are one list: the whole screen in the Beats step, a peek from the left edge in the Pages step */
#beatPanel { position: absolute; top: 0; bottom: 0; left: 0; width: min(380px, 88%); background: var(--raise); display: flex; flex-direction: column; z-index: 9; }
body.step-beats #beatPanel { left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); background: transparent; }
body.step-pages #beatPanel { transform: translateX(-105%); transition: transform .2s ease; }
body.step-pages.peek #beatPanel { transform: none; box-shadow: 12px 0 40px var(--shadow); }
#peekTab { position: absolute; z-index: 8; left: 0; top: 50%; width: 28px; height: 150px; transform: translateY(-50%); touch-action: none; }
#peekTab::after { content: ""; position: absolute; left: 7px; top: 50%; width: 4px; height: 48px; margin-top: -24px; border-radius: 2px; background: var(--line-hi); }
#peekTab:active::after { background: var(--muted); }
body.peek #peekTab { visibility: hidden; }
.bp-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px 20px; }
.bp-head span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.bp-head .cnt { letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.bp-head .tb { margin-left: auto; height: 32px; color: var(--faint); }
#chain { list-style: none; overflow-y: auto; flex: 1; padding: 6px 12px 60px 10px; -webkit-overflow-scrolling: touch; }
.beat { display: grid; grid-template-columns: 34px 1fr 34px; gap: 4px; align-items: start; border-radius: 12px; padding: 4px 2px; position: relative; }
.beat.cur { background: var(--card); }
.beat .tick { width: 26px; height: 26px; margin: 8px 0 0 4px; border-radius: 50%; border: 1.5px solid var(--line-hi); display: grid; place-items: center; color: transparent; font-size: 13px; }
.beat.done .tick { background: var(--done); border-color: var(--done); color: #0d1f15; }
.beat textarea { width: 100%; resize: none; border: 0; background: none; font: 16px/1.5 var(--serif); padding: 8px 4px; min-height: 40px; overflow: hidden; -webkit-user-select: text; user-select: text; }
.beat textarea:focus { outline: none; }
.beat.done textarea { color: var(--muted); }
.beat textarea::placeholder { color: var(--faint); font-style: italic; }
.beat .nb { width: 32px; height: 36px; margin-top: 4px; border-radius: 8px; color: var(--faint); display: grid; place-items: center; position: relative; }
.beat .nb.has::after { content: ""; position: absolute; top: 9px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.beat .nb svg { width: 18px; height: 18px; }
.lk-row { padding: 0 0 0 42px; height: 28px; display: flex; align-items: center; }
.lk { font: 600 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.lk.but { color: var(--but); } .lk.therefore { color: var(--therefore); }
.lk.and { color: var(--and); opacity: .75; text-decoration: underline dotted; text-underline-offset: 3px; }
.lk:active { background: var(--hover); }
.beat.new .tick, .beat.new .nb { visibility: hidden; }
body.step-beats .bp-head { padding-top: 22px; }
body.step-beats .beat textarea { font-size: 19px; padding: 12px 6px; min-height: 54px; }
body.step-beats .beat .tick { margin-top: 13px; }
body.step-beats .beat .nb { margin-top: 9px; }
body.step-beats .beat.new textarea { min-height: 110px; }
body.step-beats .lk-row { height: 34px; }

#desk { position: absolute; inset: 0; }
#doc { position: absolute; left: 0; right: 0; top: 0; bottom: 50%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
#doc .col { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 44px 22px 10px; }
#msHead { font: 600 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
#text { font: 400 var(--doc-size)/1.62 var(--serif); -webkit-user-select: text; user-select: text; }
#text p { overflow-wrap: anywhere; }
#text p.ind { text-indent: 1.6em; }
#text p.center { text-align: center; }
#text p.blank { min-height: 1.62em; }
#text mark.fix { background: rgba(157,183,230,.3); color: inherit; border-radius: 5px; padding: 1px 3px; margin: -1px -3px; box-shadow: 0 0 0 1.5px rgba(157,183,230,.55); }
.para { font: 500 13px var(--ui); color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; text-indent: 0; margin-left: .3em; font: 500 13px/1 var(--ui); border-radius: 999px; padding: 6px 10px; background: #232c3d; color: var(--accent); }
.dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin: 0 1.5px; animation: blink 1.1s infinite both; }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chip.err { background: #3a2622; color: #f2c3b4; padding: 4px 4px 4px 8px; }
.chip.err img { height: 26px; max-width: 120px; border-radius: 4px; background: #fff; }
.chip.err button { background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 10px; font: 600 12px var(--ui); }
#viewing { position: absolute; z-index: 7; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 4px 4px 4px 14px; font-size: 13px; color: var(--muted); }
#viewing button { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--hover); color: var(--ink); font-weight: 500; }

#box { position: absolute; left: 0; top: 0; width: 600px; height: 300px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 22px 48px -30px var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
#padbar { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0; border-bottom: 1px solid var(--line); touch-action: none; }
.pb { height: 36px; min-width: 40px; border-radius: 9px; color: var(--faint); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px; font: 500 13px var(--ui); }
.pb svg.i { width: 19px; height: 19px; }
.pb:active, .pb.on { background: var(--hover); color: var(--ink); }
.pb.mode { border: 1px solid var(--line-hi); height: 30px; font-weight: 600; }
.pb.mode.auto { color: var(--accent); border-color: rgba(157,183,230,.5); }
#padStatus { flex: 1; min-width: 0; text-align: center; font: 500 12px var(--ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#padStatus.warn { color: var(--but); }
#padFix { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font: 500 13px var(--ui); color: var(--muted); white-space: nowrap; }
#padFix b { font: 500 15px var(--serif); color: var(--accent); margin: 0 6px 0 4px; overflow: hidden; text-overflow: ellipsis; }
/* the pad's top corners: drag to resize */
.grip { width: 34px; height: 44px; flex: none; position: relative; touch-action: none; }
.grip::before { content: ""; position: absolute; top: 9px; width: 11px; height: 11px; border-top: 2px solid var(--line-hi); }
.grip.l::before { left: 7px; border-left: 2px solid var(--line-hi); border-top-left-radius: 5px; }
.grip.r::before { right: 7px; border-right: 2px solid var(--line-hi); border-top-right-radius: 5px; }
.grip.on::before { border-color: var(--accent); }
#inkWrap { position: relative; flex: 1; --gap: 76px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--gap) - 1px), var(--rule) calc(var(--gap) - 1px), var(--rule) var(--gap)); }
body.no-rules #inkWrap { background-image: none; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#scribble { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); caret-color: var(--accent);
  font: 400 30px/76px var(--serif); padding: 2px 22px 0; overflow-y: auto; -webkit-user-select: text; user-select: text; touch-action: manipulation; }
body.mode-scribble #ink { display: none; }
body:not(.mode-scribble) #scribble { display: none; }

/* ---------- sheets, menus, dialogs ---------- */
#scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.45); }
.sheet { position: absolute; z-index: 41; background: var(--raise); border-radius: 18px; box-shadow: 0 24px 70px var(--shadow); display: flex; flex-direction: column; max-height: calc(100% - 40px); }
.sheet.center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); }
.sheet.top { left: 50%; top: calc(var(--top) + 8px); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); }
.sheet.side { top: calc(var(--top) + 8px); bottom: 12px; right: 12px; width: min(420px, calc(100% - 24px)); }
.sh-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 20px; }
.sh-head h2 { flex: 1; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.sh-body { overflow-y: auto; padding: 4px 20px 20px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 14px; }
.btn { height: 42px; padding: 0 16px; border-radius: 11px; background: var(--card); color: var(--ink); font-weight: 500; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:active { background: var(--card-hi); }
.btn.primary { background: var(--accent); color: #0f1726; font-weight: 600; }
.btn.danger { color: #f0a090; }
.btn.armed { background: #8a3a2e; color: #fff; }
.btn.quiet { background: none; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.field input, .field textarea { background: var(--card); border: 0; border-radius: 10px; padding: 11px 13px; font: 16px/1.45 var(--serif); width: 100%; resize: none; -webkit-user-select: text; user-select: text; }
.field input:focus, .field textarea:focus { outline: none; background: var(--card-hi); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { flex: 1; height: 36px; border-radius: 8px; color: var(--muted); font-size: 13.5px; padding: 0 8px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card-hi); color: var(--ink); }
.dl { display: grid; grid-template-columns: 130px 1fr 36px; gap: 8px; align-items: start; }
.dl input, .dl textarea { background: var(--card); border: 0; border-radius: 9px; padding: 9px 11px; font: 15px/1.4 var(--serif); width: 100%; resize: none; }
.dl button { height: 38px; color: var(--faint); font-size: 20px; }
.menu { position: absolute; z-index: 41; min-width: 250px; max-width: min(380px, calc(100% - 20px)); max-height: calc(100% - 70px); overflow-y: auto; background: var(--raise); border-radius: 14px; box-shadow: 0 18px 50px var(--shadow); padding: 6px; display: flex; flex-direction: column; }
.menu button { text-align: left; padding: 12px 14px; border-radius: 9px; font-size: 15px; min-height: 44px; display: flex; align-items: center; gap: 10px; }
.menu button small { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu button:active { background: var(--hover); }
.menu button[aria-checked="true"]::after { content: "✓"; margin-left: auto; color: var(--accent); }
.menu button.armed { background: #8a3a2e; color: #fff; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .head { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 14px 4px; }
.menu .note { font-size: 12.5px; color: var(--muted); padding: 2px 14px 8px; line-height: 1.45; }
.menu .note.bad { color: #f0a090; }
.menu .ver { font-size: 11px; color: var(--faint); padding: 8px 14px 6px; }
.pick-list { display: flex; flex-direction: column; }
.pick-grp { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 14px 4px 4px; }
.pick { text-align: left; padding: 11px 10px; border-radius: 10px; display: flex; gap: 10px; align-items: baseline; font: 15.5px var(--serif); }
.pick:active { background: var(--hover); }
.pick .no { width: 28px; text-align: right; color: var(--faint); font: 12px var(--ui); flex: none; }
.pick.seqpick { font: italic 15px var(--serif); color: var(--muted); }
#capText { min-height: 200px; font: 18px/1.55 var(--serif); }
.rec { display: flex; align-items: center; gap: 10px; }
.rec .lvl { width: 80px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rec .lvl i { display: block; height: 100%; width: 0; background: var(--but); }
.rec .tm { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn.rec-on { background: #8a3a2e; color: #fff; }
audio { width: 100%; height: 36px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; }
.set-row span { font-size: 15px; }
.set-row output { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.set-row input[type=range] { width: 50%; accent-color: var(--accent); }
.sw { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line-hi); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #e9edf4; transition: transform .15s; }
.sw:checked { background: var(--accent); } .sw:checked::after { transform: translateX(20px); }
.ask p { color: var(--muted); font-size: 15px; line-height: 1.55; white-space: pre-line; }
.ask .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
#loading { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--bg); font: italic 500 30px var(--serif); color: var(--muted); }
#loading b { color: var(--accent); font-style: normal; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } .sw::after { transition: none; } }

/* typing on the page: the draft as plain text, in the same place and the same letters */
#editArea { display: block; width: 100%; border: 0; background: none; resize: none; overflow: hidden; color: var(--ink); font: 400 var(--doc-size)/1.62 var(--serif); padding: 0; -webkit-user-select: text; user-select: text; caret-color: var(--accent); }
#editArea:focus { outline: none; }
/* board card: POV · place */
.card .m { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* labels on a scene */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip2 { height: 34px; padding: 0 12px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.chip2 i { font-style: normal; color: var(--faint); font-size: 16px; }
.chip2.sug { background: none; box-shadow: 0 0 0 1px var(--line-hi) inset; color: var(--muted); }
.vers { display: flex; flex-direction: column; }
.vers button { text-align: left; padding: 11px 4px; display: flex; justify-content: space-between; font: 15px var(--serif); color: var(--muted); border-top: 1px solid var(--line); }
.vers button small { font: 12.5px var(--ui); color: var(--faint); }
@media (prefers-reduced-motion: reduce) { #beatPanel { transition: none !important; } }
</style>
</head>
<body class="mode-scribble">
<header id="top">
  <button id="back" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="backLbl">Story</span></button>
  <nav id="tabs"><button class="tab" data-go="story">Story</button><button class="tab" data-go="loose">Loose<span class="n" id="looseN"></span></button></nav>
  <button id="titleBtn" hidden aria-label="Details"><span id="titleTxt"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <span class="spacer"></span>
  <div class="steps" id="stepSeg" role="tablist" hidden><button role="tab" data-step="beats">Beats</button><button role="tab" data-step="pages">Pages</button></div>
  <button class="tb" id="gapsBtn" aria-pressed="false" hidden>Gaps</button>
  <button class="tb" id="captureBtn" title="Capture an idea" aria-label="Capture an idea"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" id="menuBtn" title="More" aria-label="More"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><i class="dot" id="syncDot"></i></button>
</header>

<section class="view" id="story"><div id="board"></div></section>
<section class="view" id="loose" hidden><div class="loose-wrap"><div class="loose-add"><button data-new="beats">+ Beats</button><button data-new="scene">+ Scene</button><button data-new="writing">+ Writing</button></div><div id="looseGrid"></div></div></section>
<section class="view" id="item" hidden>
  <aside id="beatPanel">
    <div class="bp-head"><span>Beats</span><span class="cnt" id="beatCnt"></span></div>
    <ol id="chain"></ol>
  </aside>
  <button id="peekTab" aria-label="Show the beats" hidden></button>
  <section id="desk">
    <div id="viewing" hidden><span id="viewingLbl"></span><button id="viewingBack">Back to the draft</button></div>
    <div id="doc"><div class="col"><div id="msHead"></div><div id="text"></div></div></div>
    <div id="box">
      <div id="padbar">
        <span class="grip l" id="gripL"></span>
        <button class="pb" id="padUndo" title="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>Undo</button>
        <button class="pb" id="padPara" title="New paragraph">New ¶</button>
        <div id="padStatus" role="status"></div>
        <div id="padFix" hidden><span>Rewrite</span><b id="padFixLbl"></b><button class="pb" id="padFixDel">Remove</button><button class="pb" id="padFixX" aria-label="Leave the word as it is">✕</button></div>
        <button class="pb mode" id="padAuto"></button>
        <button class="pb" id="padSend" title="Send"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send</button>
        <span class="grip r" id="gripR"></span>
      </div>
      <div id="inkWrap"><canvas id="ink"></canvas><textarea id="scribble" aria-label="Writing pad" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" inputmode="none"></textarea></div>
    </div>
  </section>
</section>
<div id="banner" hidden role="alert"><span id="bannerMsg"></span><button id="bannerX" aria-label="Dismiss">✕</button></div>
<div id="layer"></div>
<div id="loading"><div><b>i</b>Story</div></div>
