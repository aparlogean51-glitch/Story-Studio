<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500&display=swap">
<style>
/* Sheets: the beat sheet workshop. A shelf of sheets on the left, the open sheet on the right as a numbered thread of beats.
   Same dark slate as the Board and Beats rooms; the numbered thread echoes the beat room so a sheet looks like what it will become. */
:root {
  --bg: #0c0e14; --surface: #161922; --card: #1e222e; --card-hi: #252a38;
  --border: rgba(255,255,255,0.08); --border-hi: rgba(255,255,255,0.22);
  --text: #f1f3f9; --muted: #9aa2b6; --faint: #636b80; --accent: #38bdf8; --accent-soft: rgba(56,189,248,0.13);
  --written: #34d399; --danger: #f43f5e; --primary: #e11d48;
  --ui: 'Inter', -apple-system, system-ui, sans-serif; --serif: 'Literata', Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:active { background: var(--card-hi); }
.btn.primary { background: var(--primary); border-color: #be123c; color: #fff; }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); }
.btn.danger { color: #fb7185; border-color: rgba(225,29,72,0.35); background: rgba(225,29,72,0.1); }
.btn.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .4; }

#top { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--border); background: #0b0d13; }
#top h1 { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); flex: 1; }
#app { display: grid; grid-template-columns: minmax(250px, 300px) 1fr; height: calc(100% - 64px); }

/* the shelf */
#shelf { border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0 40px; -webkit-overflow-scrolling: touch; }
.shelf-h { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 16px 18px 6px; display: flex; justify-content: space-between; }
.item { width: 100%; text-align: left; background: none; border: 0; padding: 12px 18px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; border-left: 3px solid transparent; }
.item:active { background: rgba(255,255,255,0.04); }
.item[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.item b { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.item small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shelf-empty { margin: 4px 18px 6px; padding: 12px; border: 1px dashed var(--border-hi); border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 1.45; }

/* the open sheet */
#main { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet { max-width: 820px; margin: 0 auto; padding: 26px 28px 120px; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.kind.yours { color: var(--accent); }
#name { width: 100%; background: none; border: 0; border-bottom: 1px solid transparent; font: 500 30px/1.25 var(--serif); padding: 2px 0 6px; }
#name:focus { outline: none; border-bottom-color: var(--border-hi); }
#desc { width: 100%; background: none; border: 0; resize: none; color: var(--muted); font-size: 15px; line-height: 1.5; padding: 4px 0; min-height: 30px; }
#desc:focus { outline: none; color: var(--text); }
#name[readonly], #desc[readonly] { pointer-events: none; }
.locked { margin: 16px 0 6px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 14px; }
.locked span { flex: 1; min-width: 220px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 8px; }
.used { font-size: 13px; color: var(--faint); margin: 6px 0 0; }
.used button { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }

/* beats as a numbered thread */
.thread { list-style: none; margin-top: 22px; position: relative; }
.beat { display: grid; grid-template-columns: 40px 44px 1fr 48px; align-items: start; gap: 0 8px; padding: 6px 0; position: relative; }
.beat::before { content: ""; position: absolute; left: 19px; top: 46px; bottom: -6px; width: 1.5px; background: var(--border-hi); }
.beat:last-child::before { display: none; }
.num { width: 38px; height: 38px; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--border-hi); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--bg); position: relative; z-index: 1; }
.grip { width: 44px; height: 50px; border: 0; background: none; color: var(--faint); display: grid; place-items: center; touch-action: none; cursor: grab; }
.grip svg { width: 20px; height: 20px; fill: currentColor; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px 10px; min-width: 0; }
.card input { width: 100%; background: none; border: 0; padding: 6px 0; }
.card input:focus { outline: none; }
.card .lab { font-weight: 600; font-size: 16px; color: var(--accent); }
.card .lab::placeholder { color: rgba(56,189,248,0.45); }
.card .pr { font-size: 15px; color: var(--muted); border-top: 1px solid var(--border); }
.card .pr:focus { color: var(--text); }
.card input[readonly] { pointer-events: none; }
.del { width: 44px; height: 50px; border: 0; background: none; color: var(--faint); font-size: 22px; line-height: 1; }
.del:active { color: #fb7185; }
.beat.dragging { opacity: .25; }
.ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .92; box-shadow: 0 18px 40px rgba(0,0,0,0.6); border-radius: 12px; }
.drop-line { height: 3px; border-radius: 2px; background: var(--accent); margin: 0 48px 0 92px; }
.add { margin: 14px 0 0 92px; }
.free-note { margin-top: 20px; padding: 16px; border-radius: 12px; border: 1px dashed var(--border-hi); color: var(--muted); font-size: 14px; line-height: 1.5; }
.hint { margin: 26px 0 0 92px; font-size: 13px; color: var(--faint); line-height: 1.5; max-width: 560px; }

/* picker (choose a scene) */
#pick { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
.pbox { width: min(620px, 100%); max-height: min(760px, calc(100% - 20px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-hi); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.phead { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.phead h2 { flex: 1; font-size: 17px; }
.plist { overflow-y: auto; padding: 6px 0 12px; -webkit-overflow-scrolling: touch; }
.pgrp { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 18px 4px; }
.prow { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline; padding: 12px 18px; }
.prow:active { background: rgba(255,255,255,0.05); }
.prow .no { color: var(--faint); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.prow .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .c { color: var(--faint); font-size: 12px; white-space: nowrap; }
.pfoot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.pmsg { padding: 18px; color: var(--muted); line-height: 1.5; }

#toast { position: fixed; z-index: 60; bottom: 24px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--border-hi); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: calc(100% - 40px); }
#toast.on { display: flex; }
#toast button { background: none; border: 0; color: var(--accent); font-weight: 600; min-height: 36px; padding: 0 6px; }

@media (max-width: 860px) {
  #app { grid-template-columns: 240px 1fr; }
  .sheet { padding: 22px 18px 120px; }
  .beat { grid-template-columns: 34px 40px 1fr 44px; }
  .beat::before { left: 16px; }
  .num { width: 32px; height: 32px; }
  .add, .hint { margin-left: 82px; } .drop-line { margin-left: 82px; }
}
</style>
</head>
<body>
<header id="top">
  <h1>Beat sheets</h1>
  <button class="btn quiet" id="fromScene">From a scene…</button>
  <button class="btn primary" id="newSheet">+ New sheet</button>
</header>
<div id="app">
  <nav id="shelf" aria-label="Beat sheets"></nav>
  <main id="main"></main>
</div>
<div id="pick" hidden role="dialog" aria-modal="true">
  <div class="pbox">
    <div class="phead"><h2 id="pTitle"></h2><button class="btn quiet" id="pClose">Cancel</button></div>
    <div class="plist" id="pList"></div>
    <div class="pfoot" id="pFoot" hidden></div>
  </div>
</div>
<div id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script>
/* =====================================================================
   Sheets: make the beat sheets the Beat room offers under "Scene type".
   Built-in sheets are the same ten the Beat room ships with; your own sheets live in the shared story
   (Story.data.templates: { id, name, desc, custom, beats: [{ label, prompt }] }), so the Beat room, the Board
   and the laptop studio all see them.
   ===================================================================== */
const Story = parent.Story, Shell = parent.Shell;
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

// the same built-in sheets as the Beat room (rooms/beats.html), same ids
const BUILT_IN = [
  { id: 'free', name: 'Free sheet', desc: 'Blank beats in whatever shape the scene needs.', beats: [] },
  { id: 'goal', name: 'Goal · Conflict · Disaster', desc: 'The classic scene: someone wants something, is opposed, and ends worse off.', beats: [
    ['Goal', 'What does the POV character want walking into this scene?'], ['Conflict', 'Who or what stands in the way?'],
    ['Escalation', 'How does the struggle get harder?'], ['Disaster', 'How does it end badly, or with a twist that forces a new choice?']] },
  { id: 'sequel', name: 'Reaction · Dilemma · Decision', desc: 'The aftermath scene that follows a disaster and sets the next goal.', beats: [
    ['Reaction', 'How does the POV feel right after the last blow?'], ['Dilemma', 'What are the options, and why are they all hard?'],
    ['Decision', 'What do they choose? That becomes the next goal.']] },
  { id: 'battle', name: 'Battle / action', desc: 'Armies, ambushes, sieges, duels.', beats: [
    ['Stakes and ground', 'What is being fought over, and what does the field look like?'], ['Opening move', 'Who strikes first, and how?'],
    ['Complication', 'What goes wrong or changes?'], ['Turning point', 'Who seizes the advantage, and how?'], ['Climax', 'The decisive moment.'],
    ['Cost', 'What was lost? Who is left standing?']] },
  { id: 'confrontation', name: 'Dialogue / confrontation', desc: 'Two or more people want different things from each other.', beats: [
    ['Positions', 'What does each side want from the other?'], ['Opening', 'Who speaks first, and what is the first move?'],
    ['Pushback', 'How does the other side resist?'], ['Escalation', 'What gets said that can’t be unsaid?'], ['Turn', 'What is revealed or conceded?'],
    ['New footing', 'Where do they stand with each other now?']] },
  { id: 'council', name: 'Council / planning', desc: 'Leaders deciding what to do next.', beats: [
    ['The problem', 'What threat or need brings them together?'], ['Proposals', 'What courses of action are put forward?'],
    ['Dissent', 'Who objects, and why?'], ['Decision', 'What is decided, and by whom?'], ['Assignment', 'Who must do what, and what does it cost them?']] },
  { id: 'discovery', name: 'Discovery / revelation', desc: 'A character learns something that changes things.', beats: [
    ['Before', 'What does the POV believe going in?'], ['Clue', 'What first hints that something is off?'], ['Search', 'How do they dig for the truth?'],
    ['Reveal', 'What do they find out?'], ['Reaction', 'How do they take it?'], ['Consequence', 'What must change now?']] },
  { id: 'chase', name: 'Chase / escape', desc: 'Pursuit, flight, or a narrow getaway.', beats: [
    ['Trigger', 'What sets the chase off?'], ['Flight', 'Where do they run, and how?'], ['Obstacle', 'What blocks the way?'],
    ['Near miss', 'How close does the pursuer get?'], ['Gambit', 'What risky choice breaks them free, or doesn’t?'], ['Outcome', 'Where does it leave them?']] },
  { id: 'character', name: 'Emotional / character moment', desc: 'An inner shift: grief, doubt, love, resolve.', beats: [
    ['Trigger', 'What stirs the feeling?'], ['Resistance', 'How do they avoid facing it?'], ['Crack', 'What breaks through?'],
    ['Vulnerability', 'What do they finally let show?'], ['Shift', 'What do they understand or decide now?']] },
  { id: 'spiritual', name: 'Prayer / vision / spiritual experience', desc: 'Seeking and receiving: a prayer answered, a vision, a visitation.', beats: [
    ['Need', 'What drives them to seek?'], ['Wrestle', 'The struggle, doubt, or long waiting.'], ['Manifestation', 'What do they see, hear, or feel?'],
    ['Message', 'What is made known to them?'], ['Response', 'How do they answer, and what will it cost?']] },
  { id: 'journey', name: 'Travel / transition', desc: 'Moving the story from one place to another.', beats: [
    ['Departure', 'Who leaves, from where, and why now?'], ['The way', 'The land, the weather, the company.'], ['Encounter', 'What happens on the road?'],
    ['Arrival', 'What is waiting at the end?']] }
].map(t => ({ ...t, beats: t.beats.map(([label, prompt]) => ({ label, prompt })) }));

const mine = () => Story.data.templates;
const all = () => [...mine(), ...BUILT_IN];
const find = (id) => all().find(t => t.id === id) || null;
let currentId = (() => { try { return localStorage.getItem('istory_sheet') || null; } catch (e) { return null; } })();
const setCurrent = (id) => { currentId = id; try { localStorage.setItem('istory_sheet', id || ''); } catch (e) {} };
const current = () => find(currentId) || mine()[0] || BUILT_IN[1];
const usedBy = (t) => Story.data.scenes.filter(s => s.type === t.id && !s.archived);

/* ---------- saving: one quiet save shortly after typing stops ---------- */
let saveT = 0;
function save(now) {
  clearTimeout(saveT);
  const go = () => { saveT = 0; Story.changed('sheets', { templates: true }); };
  if (now) go(); else saveT = setTimeout(go, 500);
}

/* ---------- the shelf ---------- */
function renderShelf() {
  const cur = current(), sh = $('shelf');
  const row = (t) => `<button class="item" data-id="${esc(t.id)}" aria-current="${t.id === cur.id}"><b>${esc(t.name || 'Untitled sheet')}</b><span class="n">${t.beats.length || '–'}</span>
    <small>${(() => { const n = usedBy(t).length; return n ? `Used by ${plural(n, 'scene')}` : esc(t.desc || ''); })()}</small></button>`;
  sh.innerHTML = `<div class="shelf-h"><span>Your sheets</span><span>${mine().length || ''}</span></div>` +
    (mine().length ? mine().map(row).join('') : `<div class="shelf-empty">Sheets you make show up here and in the Beat room under “Scene type”. Start with <b>+ New sheet</b>, or copy a built-in one.</div>`) +
    `<div class="shelf-h"><span>Built in</span></div>` + BUILT_IN.map(row).join('');
}
$('shelf').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) open(b.dataset.id); });

/* ---------- the open sheet ---------- */
const GRIP = '<svg viewBox="0 0 20 20"><circle cx="7" cy="5" r="1.6"/><circle cx="13" cy="5" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/><circle cx="7" cy="15" r="1.6"/><circle cx="13" cy="15" r="1.6"/></svg>';
function renderMain() {
  const t = current(), own = !!t.custom, ro = own ? '' : 'readonly';
  const n = usedBy(t).length;
  $('main').innerHTML = `<div class="sheet">
    <div class="kind ${own ? 'yours' : ''}">${own ? 'Your sheet' : 'Built-in sheet'} · ${plural(t.beats.length, 'beat')}</div>
    <input id="name" value="${esc(t.name)}" placeholder="Name this sheet" aria-label="Sheet name" autocomplete="off" ${ro}>
    <textarea id="desc" rows="1" placeholder="What kind of scene is it for?" aria-label="Description" ${ro}>${esc(t.desc)}</textarea>
    ${own ? '' : `<div class="locked"><span>Built-in sheets stay as they are. Make a copy to change the beats or the wording.</span><button class="btn" data-act="copy">Make a copy to edit</button></div>`}
    <div class="actions">
      <button class="btn primary" data-act="use">Use on a scene…</button>
      ${own ? '<button class="btn" data-act="copy">Duplicate</button><button class="btn danger" data-act="delete" id="delBtn">Delete sheet</button>' : ''}
    </div>
    <p class="used">${n ? `Used by ${plural(n, 'scene')}: ${usedBy(t).slice(0, 6).map(s => `<button data-open="${esc(s.id)}">${esc(s.title)}</button>`).join(', ')}${n > 6 ? ' and more' : ''}` : 'Not used by any scene yet.'}</p>
    ${t.beats.length || own ? `<ol class="thread" id="thread">${t.beats.map((b, i) => beatRow(b, i, own)).join('')}</ol>` : `<div class="free-note">The free sheet starts a scene with blank beats, so you can shape it however the scene needs.</div>`}
    ${own ? `<button class="btn add" data-act="add">+ Add beat</button>
      <p class="hint">Each beat has a name and a question to answer when you fill it in for a scene. Drag the dots to reorder. Write with Apple Pencil in any field and it turns into text.</p>` : ''}
  </div>`;
  autoGrow($('desc'));
}
function beatRow(b, i, own) {
  const ro = own ? '' : 'readonly';
  return `<li class="beat" data-i="${i}">
    <span class="num">${i + 1}</span>
    ${own ? `<button class="grip" aria-label="Drag to move beat ${i + 1}">${GRIP}</button>` : '<span></span>'}
    <div class="card"><input class="lab" value="${esc(b.label)}" placeholder="Beat ${i + 1}" aria-label="Beat name" autocomplete="off" ${ro}>
      <input class="pr" value="${esc(b.prompt)}" placeholder="The question this beat answers" aria-label="Beat question" autocomplete="off" ${ro}></div>
    ${own ? `<button class="del" data-act="remove" aria-label="Remove beat ${i + 1}">×</button>` : '<span></span>'}
  </li>`;
}
function autoGrow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function render() { renderShelf(); renderMain(); }
function open(id) { setCurrent(id); render(); $('main').scrollTop = 0; }

// typing
$('main').addEventListener('input', (e) => {
  const t = current(); if (!t.custom) return;
  if (e.target.id === 'name') { t.name = e.target.value; save(); renderShelfSoon(); return; }
  if (e.target.id === 'desc') { t.desc = e.target.value; autoGrow(e.target); save(); return; }
  const li = e.target.closest('.beat'); if (!li) return;
  const b = t.beats[+li.dataset.i]; if (!b) return;
  if (e.target.classList.contains('lab')) b.label = e.target.value; else b.prompt = e.target.value;
  save();
});
// Return in a beat name goes to its question; Return in a question adds the next beat
$('main').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const li = e.target.closest('.beat'); if (!li || !current().custom) return;
  e.preventDefault();
  if (e.target.classList.contains('lab')) li.querySelector('.pr').focus();
  else addBeat(+li.dataset.i + 1);
});
let shelfT = 0; function renderShelfSoon() { clearTimeout(shelfT); shelfT = setTimeout(renderShelf, 300); }

$('main').addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) { Shell.beats(o.dataset.open); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const t = current(), act = a.dataset.act;
  if (act === 'copy') copySheet(t);
  else if (act === 'add') addBeat(t.beats.length);
  else if (act === 'remove') removeBeat(+a.closest('.beat').dataset.i);
  else if (act === 'delete') deleteSheet(t, a);
  else if (act === 'use') pickScene('use');
});

function newSheet(beats, name, desc) {
  const t = { id: 'tpl-' + uid(), name: name || '', desc: desc || '', custom: true, beats: beats || [{ label: '', prompt: '' }] };
  mine().unshift(t);
  save(true); open(t.id);
  setTimeout(() => { const n = $('name'); if (n) { n.focus(); n.select(); } }, 60);
  return t;
}
function copySheet(t) {
  const c = newSheet(t.beats.map(b => ({ label: b.label, prompt: b.prompt })), t.name ? t.name + ' (copy)' : '', t.desc);
  toast(`Copied “${t.name}”. This copy is yours to change.`);
  return c;
}
function addBeat(at) {
  const t = current(); if (!t.custom) return;
  t.beats.splice(at, 0, { label: '', prompt: '' });
  save(true); render();
  setTimeout(() => { const li = document.querySelector(`.beat[data-i="${at}"] .lab`); if (li) { li.focus(); li.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 30);
}
function removeBeat(i) {
  const t = current(); const b = t.beats[i]; if (!b) return;
  t.beats.splice(i, 1); save(true); render();
  toast(`Removed ${b.label ? '“' + b.label + '”' : 'beat ' + (i + 1)}.`, 'Undo', () => { t.beats.splice(i, 0, b); save(true); render(); });
}
let armT = 0;
function deleteSheet(t, btn) {
  if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Tap again to delete'; clearTimeout(armT); armT = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Delete sheet'; }, 4000); return; }
  const i = mine().indexOf(t); if (i < 0) return;
  mine().splice(i, 1); save(true);
  setCurrent(mine()[0]?.id || BUILT_IN[1].id); render();
  toast(`Deleted “${t.name || 'Untitled sheet'}”. Scenes keep their beats.`, 'Undo', () => { mine().splice(i, 0, t); save(true); open(t.id); });
}
$('newSheet').onclick = () => newSheet();
$('fromScene').onclick = () => pickScene('from');

/* ---------- drag to reorder (finger or Pencil on the dots) ---------- */
let drag = null;
$('main').addEventListener('pointerdown', (e) => {
  const g = e.target.closest('.grip'); if (!g || !current().custom) return;
  e.preventDefault();
  const li = g.closest('.beat'), r = li.getBoundingClientRect();
  const ghost = li.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  document.body.append(ghost); li.classList.add('dragging');
  const line = document.createElement('li'); line.className = 'drop-line';
  drag = { li, from: +li.dataset.i, ghost, line, dy: e.clientY - r.top, to: +li.dataset.i, id: e.pointerId };
  try { g.setPointerCapture(e.pointerId); } catch (err) {}
});
$('main').addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const rows = [...document.querySelectorAll('#thread .beat')];
  let to = rows.length;
  for (let k = 0; k < rows.length; k++) { const r = rows[k].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { to = k; break; } }
  drag.to = to;
  const th = $('thread'); if (rows[to]) th.insertBefore(drag.line, rows[to]); else th.append(drag.line);
  // keep scrolling when the finger nears an edge
  const m = $('main'), mr = m.getBoundingClientRect();
  if (e.clientY < mr.top + 60) m.scrollTop -= 12; else if (e.clientY > mr.bottom - 60) m.scrollTop += 12;
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const { from, to, ghost, line } = drag; drag = null;
  ghost.remove(); line.remove();
  const t = current(), dest = to > from ? to - 1 : to;
  if (dest !== from && t.beats[from]) { const [b] = t.beats.splice(from, 1); t.beats.splice(dest, 0, b); save(true); }
  renderMain();
}
$('main').addEventListener('pointerup', endDrag);
$('main').addEventListener('pointercancel', endDrag);

/* ---------- choose a scene: to use this sheet on, or to make a sheet from ---------- */
let pickMode = null;
function sceneGroups() {
  const T = Story.tree(Story.bookId), groups = [];
  for (const p of T.parts) for (const a of p.acts) for (const q of a.sequences)
    if (q.scenes.length) groups.push({ label: `Part ${p.no} · Act ${a.no}${a.act.name ? ': ' + a.act.name : ''} · ${q.no}. ${q.seq.name || 'Untitled sequence'}`, scenes: q.scenes });
  if (T.unfiled.length) groups.push({ label: 'Unfiled', scenes: T.unfiled });
  return groups;
}
function pickScene(mode) {
  pickMode = mode;
  const t = current(), N = Story.numbers().scene;
  $('pTitle').textContent = mode === 'use' ? `Use “${t.name || 'this sheet'}” on…` : 'Make a sheet from a scene’s beats';
  const groups = sceneGroups();
  const rows = groups.map(g => {
    const list = mode === 'from' ? g.scenes.filter(s => s.beats.length) : g.scenes;
    if (!list.length) return '';
    return `<div class="pgrp">${esc(g.label)}</div>` + list.map(s => `<button class="prow" data-scene="${esc(s.id)}"><span class="no">${N.get(s.id) || ''}</span><span class="t">${esc(s.title)}</span><span class="c">${s.beats.length ? plural(s.beats.length, 'beat') : 'no beats'}</span></button>`).join('');
  }).join('');
  $('pList').innerHTML = rows || `<div class="pmsg">${mode === 'from' ? 'No scene in this book has beats yet. Plan some in the Beat room, then come back.' : 'This book has no scenes yet. Add some on the Board.'}</div>`;
  $('pFoot').hidden = true;
  $('pick').hidden = false;
}
function closePick() { $('pick').hidden = true; pickMode = null; }
$('pClose').onclick = closePick;
$('pick').addEventListener('click', (e) => {
  if (e.target === $('pick')) { closePick(); return; }
  const r = e.target.closest('[data-scene]');
  if (r) { const s = Story.scene(r.dataset.scene); if (!s) return; if (pickMode === 'from') fromScene(s); else confirmUse(s); return; }
  const c = e.target.closest('[data-mode]');
  if (c) { const s = Story.scene(c.dataset.sid); closePick(); if (s && c.dataset.mode !== 'cancel') applyTo(s, c.dataset.mode); }
});
function fromScene(s) {
  closePick();
  const beats = s.beats.map((b, i) => ({ label: (b.label || '').trim() || (b.text || '').trim().slice(0, 40) || `Beat ${i + 1}`, prompt: b.prompt || '' }));
  newSheet(beats, s.title + ' (sheet)', `From the scene “${s.title}”.`);
  toast(`Made a sheet from “${s.title}”. Rename it and add questions for each beat.`);
}
function confirmUse(s) {
  const t = current();
  if (!s.beats.length || !t.beats.length) { closePick(); applyTo(s, 'replace'); return; }
  const has = s.beats.some(b => (b.text || '').trim() || (b.notes || '').trim() || (b.dialogue || []).length || (b.images || []).length);
  $('pTitle').textContent = `“${s.title}” already has ${plural(s.beats.length, 'beat')}`;
  $('pList').innerHTML = `<div class="pmsg">${has ? '<b>Replace</b> removes its current beats and anything written in them (you can undo right after). ' : ''}<b>Add after</b> keeps them and adds this sheet’s beats at the end.</div>`;
  $('pFoot').innerHTML = `<button class="btn quiet" data-mode="cancel" data-sid="${esc(s.id)}">Cancel</button><button class="btn" data-mode="append" data-sid="${esc(s.id)}">Add after</button><button class="btn ${has ? 'danger' : 'primary'}" data-mode="replace" data-sid="${esc(s.id)}">Replace</button>`;
  $('pFoot').hidden = false;
}
function applyTo(s, mode) {
  const t = current(), prevBeats = s.beats.slice(), prevType = s.type;
  const fresh = t.beats.map(b => Story.newBeat({ label: b.label, prompt: b.prompt }));
  s.type = t.id;
  if (mode === 'append') s.beats = [...s.beats, ...fresh];
  else s.beats = fresh.length ? fresh : (s.beats.length ? s.beats : [Story.newBeat()]);
  Story.changed('sheets', { beats: true, fields: true });
  render();
  if (mode === 'replace' && prevBeats.length && fresh.length)
    toast(`Replaced the beats on “${s.title}” with “${t.name}”.`, 'Undo', () => { s.beats = prevBeats; s.type = prevType; Story.changed('sheets', { beats: true, fields: true }); render(); });
  else toast(`“${t.name || 'Sheet'}” is on “${s.title}”.`, 'Open in Beats', () => Shell.beats(s.id));
}

/* ---------- toast ---------- */
let toastT = 0, toastFn = null;
function toast(msg, btn, fn) {
  $('toastMsg').textContent = msg;
  const b = $('toastBtn'); b.hidden = !btn; b.textContent = btn || ''; toastFn = fn || null;
  $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), btn ? 7000 : 4000);
}
$('toastBtn').onclick = () => { const f = toastFn; toastFn = null; $('toast').classList.remove('on'); f && f(); };

/* ---------- other rooms and devices ---------- */
Story.subscribe((src, info) => {
  if (src === 'sheets' || info.view || info.drafts && !info.structure) return;
  const typing = document.activeElement && document.activeElement.matches('input, textarea') && $('main').contains(document.activeElement);
  if (typing || drag) { renderShelfSoon(); return; }
  render();
});
window.__view = {
  shown(opts = {}) { if (opts.templateId && find(opts.templateId)) open(opts.templateId); else render(); },
  get templates() { return all(); }
};
render();
</script>
</body>
