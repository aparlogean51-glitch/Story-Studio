  const endLp = () => {
    if (!lp) return;
    clearTimeout(lp.timer); cancelAnimationFrame(lp.raf);
    lp.el.classList.remove('holding');
    if (lp.ghost) lp.ghost.g.remove();
    document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
    clearDrop(); dragItem = null; lp = null;
  };
  list.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || lp) return;
    const el = e.target.closest('.scene-item, .seq-head, .act-head, .part-head');
    if (!el || e.target.closest('button, input')) return;
    const t = e.touches[0];
    const kind = el.classList.contains('scene-item') ? 'scene' : el.classList.contains('seq-head') ? 'seq' : el.classList.contains('act-head') ? 'act' : 'part';
    lp = { el, kind, id: el.dataset.id, x: t.clientX, y: t.clientY, lx: t.clientX, ly: t.clientY, lifted: false, moved: false, canDrag: !!el.dataset.drag };
    lp.timer = setTimeout(() => { if (!lp) return; lp.lifted = true; el.classList.add('holding'); }, 420);
  }, { passive: true });
  list.addEventListener('touchmove', (e) => {
    if (!lp) return;
    const t = e.touches[0], far = Math.hypot(t.clientX - lp.x, t.clientY - lp.y) > 8;
    if (!lp.lifted) { if (far) endLp(); return; }
    e.preventDefault();
    lp.lx = t.clientX; lp.ly = t.clientY;
    if (!lp.canDrag) return;
    if (!lp.moved) {
      if (!far) return;
      lp.moved = true; dragItem = { kind: lp.kind, id: lp.id };
      lp.ghost = ghostOf(lp.el, lp.x, lp.y);
      (lp.kind === 'seq' ? lp.el.closest('.seq') : lp.el).classList.add('dragging');
      const loop = () => { if (!lp) return; edgeScroll(list, lp.ly); lp.raf = requestAnimationFrame(loop); }; loop();
    }
    lp.ghost.g.style.left = (t.clientX - lp.ghost.dx) + 'px'; lp.ghost.g.style.top = (t.clientY - lp.ghost.dy) + 'px';
    const tgt = dropTarget({ target: document.elementFromPoint(t.clientX, t.clientY) || list, clientY: t.clientY });
    clearDrop(); if (tgt) tgt.el.classList.add(tgt.cls);
  }, { passive: false });
  list.addEventListener('touchend', (e) => {
    if (!lp) return;
    const was = lp;
    if (!was.lifted) { endLp(); return; }
    e.preventDefault();   // no click after a hold
    if (!was.moved) {
      const items = was.kind === 'scene' ? sceneMenu(data.scenes.find(x => x.id === was.id)) : was.kind === 'seq' ? seqMenu(Story.seq(was.id)) : was.kind === 'act' ? actMenu(Story.act(was.id)) : partMenu(Story.part(was.id));
      endLp(); openMenu(items, was.lx, was.ly + 8); return;
    }
    const tgt = dropTarget({ target: document.elementFromPoint(was.lx, was.ly) || list, clientY: was.ly });
    const kind = was.kind, id = was.id;
    if (tgt) tgt.drop();
    endLp();
    if (tgt && kind === 'scene') { const s = data.scenes.find(x => x.id === id); if (s && s.seqId) openPathTo(s); }
    renderAll();
  }, { passive: false });
  list.addEventListener('touchcancel', endLp);

  // beats: drag the ⋮⋮ handle; the others make room as you go
  let bd = null;
  main.addEventListener('touchstart', (e) => {
    const g = e.target.closest('.grip'); if (!g || e.touches.length !== 1) return;
    e.preventDefault();
    const el = g.closest('.beat'), t = e.touches[0];
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    bd = { el, y: t.clientY, ghost: ghostOf(el, t.clientX, t.clientY) };
    el.classList.add('lifted');
    const loop = () => { if (!bd) return; edgeScroll($('main'), bd.y); bd.raf = requestAnimationFrame(loop); }; loop();
  }, { passive: false });
  main.addEventListener('touchmove', (e) => {
    if (!bd) return;
    e.preventDefault();
    const t = e.touches[0]; bd.y = t.clientY;
    bd.ghost.g.style.top = (t.clientY - bd.ghost.dy) + 'px';
    const others = [...document.querySelectorAll('#beats .beat')].filter(x => x !== bd.el);
    const before = others.find(x => { const r = x.getBoundingClientRect(); return t.clientY < r.top + r.height / 2; });
    if (before) { if (bd.el.nextElementSibling !== before) before.before(bd.el); }
    else if (others.length && others[others.length - 1].nextElementSibling !== bd.el) others[others.length - 1].after(bd.el);
  }, { passive: false });
  const endBeatDrag = () => {
    if (!bd) return;
    cancelAnimationFrame(bd.raf); bd.ghost.g.remove(); bd.el.classList.remove('lifted');
    const s = scene(), ids = [...document.querySelectorAll('#beats .beat')].map(x => x.dataset.id);
    const was = s.beats.map(b => b.id).join();
    s.beats.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    bd = null;
    renderMain();
    if (s.beats.map(b => b.id).join() !== was) save();
  };
  main.addEventListener('touchend', endBeatDrag); main.addEventListener('touchcancel', endBeatDrag);

  // a beat's number: tap = written; hold = everything else for that beat
  let nh = null;
  main.addEventListener('touchstart', (e) => {
    const n = e.target.closest('.node'); if (!n || e.touches.length !== 1) return;
    const t = e.touches[0];
    nh = { n, x: t.clientX, y: t.clientY, fired: false, timer: setTimeout(() => { if (!nh) return; nh.fired = true; const b = beatOf(n); if (b) openMenu(beatMenu(b), nh.x + 12, nh.y); }, 480) };
  }, { passive: true });
  main.addEventListener('touchmove', (e) => { if (nh && Math.hypot(e.touches[0].clientX - nh.x, e.touches[0].clientY - nh.y) > 8) { clearTimeout(nh.timer); nh = null; } }, { passive: true });
  main.addEventListener('touchend', (e) => { if (!nh) return; clearTimeout(nh.timer); if (nh.fired) e.preventDefault(); nh = null; }, { passive: false });

  // swipe a beat: right marks it written, left deletes it (with Undo). Apple Pencil is left alone for handwriting.
  let sw = null;
  main.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || bd) return;
    const t = e.touches[0]; if (t.touchType === 'stylus') return;
    const card = e.target.closest('.beat-card'); if (!card || e.target.closest('.grip, .node, .beat-body')) return;
    sw = { el: card.closest('.beat'), card, x: t.clientX, y: t.clientY, dx: 0, mode: null };
  }, { passive: true });
  main.addEventListener('touchmove', (e) => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.mode) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.6) { sw.mode = 'swipe'; sw.el.classList.add('swiping'); }
      else if (Math.abs(dy) > 10) { sw = null; return; }
      else return;
    }
    e.preventDefault();
    sw.dx = dx;
    const shown = Math.abs(dx) < 140 ? dx : Math.sign(dx) * (140 + (Math.abs(dx) - 140) * 0.35);
    sw.card.style.transform = `translateX(${shown}px)`;
    sw.el.classList.toggle('swipe-r', dx > 0); sw.el.classList.toggle('swipe-l', dx < 0);
  }, { passive: false });
  const endSwipe = () => {
    if (!sw) return;
    const s = sw; sw = null;
    if (s.mode !== 'swipe') return;
    const b = beatOf(s.card);
    s.el.classList.add('snap');
    if (s.dx < -110 && b) { s.card.style.transform = 'translateX(-110%)'; setTimeout(() => deleteBeatUndo(b), 200); return; }
    s.card.style.transform = '';
    setTimeout(() => { s.el.classList.remove('snap', 'swiping', 'swipe-r', 'swipe-l'); }, 260);
    if (s.dx > 110 && b) toggleDone(b);
  };
  main.addEventListener('touchend', endSwipe); main.addEventListener('touchcancel', endSwipe);
}

/* ---------- the scene list as a drawer (upright iPad), focus mode, and moving between scenes ---------- */
function drawerMode() { return TOUCH && innerWidth < 1000; }
function setDrawer(on) { document.body.classList.toggle('drawer', !!on && drawerMode()); }
function layout() { document.body.classList.toggle('drawer-mode', drawerMode()); if (!drawerMode()) document.body.classList.remove('drawer'); $('btnFocus').classList.toggle('on', document.body.classList.contains('focus')); }
addEventListener('resize', layout);
$('btnScenes').onclick = () => {
  if (drawerMode()) { setDrawer(!document.body.classList.contains('drawer')); return; }
  document.body.classList.remove('focus'); setPrefs({ focus: false }); layout();
};
$('btnFocus').onclick = () => { const on = !document.body.classList.contains('focus'); document.body.classList.toggle('focus', on); setPrefs({ focus: on }); layout(); };
$('scrim').onclick = () => setDrawer(false);
list.addEventListener('click', (e) => { if (e.target.closest('.scene-item') && document.body.classList.contains('drawer')) setTimeout(() => setDrawer(false), 120); });
function goScene(d) {
  const order = visibleOrder(), i = order.indexOf(scene()), n = order[i + d];
  if (!n) { toast(d > 0 ? 'That’s the last scene.' : 'That’s the first scene.'); return; }
  selectScene(n.id);
  const el = $('mainInner'); el.classList.remove('slide-l', 'slide-r'); void el.offsetWidth; el.classList.add(d > 0 ? 'slide-l' : 'slide-r');
}
main.addEventListener('click', (e) => { const n = e.target.closest('[data-nav]'); if (n) goScene(+n.dataset.nav); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey && (e.key === ']' || e.key === '[')) { e.preventDefault(); goScene(e.key === ']' ? 1 : -1); }
});
// swipe sideways on the scene (not on a beat) to go to the next or previous one
if (TOUCH) {
  let ss = null;
  $('main').addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || !(document.body.classList.contains('focus') || drawerMode())) return;
    const t = e.touches[0]; if (t.touchType === 'stylus') return;
    if (e.target.closest('.beat, input, textarea, select, button, .template-bar')) return;
    ss = { x: t.clientX, y: t.clientY, t: Date.now() };
  }, { passive: true });
  $('main').addEventListener('touchend', (e) => {
    if (!ss) return;
    const t = e.changedTouches[0], dx = t.clientX - ss.x, dy = t.clientY - ss.y, quick = Date.now() - ss.t < 700; ss = null;
    if (quick && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) goScene(dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* ---------- the bar above the iPad's on-screen keyboard ---------- */
const vv = (() => { try { return parent.visualViewport || window.visualViewport; } catch (e) { return window.visualViewport; } })();
function keyboardGap() {
  if (!vv) return 0;
  try { const fr = frameElement ? frameElement.getBoundingClientRect() : { bottom: innerHeight }; return Math.max(0, Math.round(fr.bottom - (vv.offsetTop + vv.height))); } catch (e) { return 0; }
}
const editingEl = () => { const a = document.activeElement; return a && a.closest && a.closest('#mainInner') && a.matches('input[type="text"], textarea') ? a : null; };
let kbT = 0;
function updateKbar() {
  if (!TOUCH) return;
  const a = editingEl(), gap = keyboardGap(), on = !!a && gap > 120;
  const bar = $('kbar');
  bar.classList.toggle('on', on);
  bar.style.bottom = gap + 'px';
  const b = a && beatOf(a);
  bar.querySelectorAll('[data-k="line"],[data-k="prev"],[data-k="next"],[data-k="done"],[data-k="open"]').forEach(x => x.disabled = !b);
  if (b) bar.querySelector('[data-k="done"]').textContent = b.done ? '○ Not written' : '✓ Written';
  // room to scroll the last beats up above the keyboard
  $('mainInner').style.paddingBottom = on ? (gap + bar.offsetHeight + 140) + 'px' : '';
  if (on) {
    // keep the field you're writing in above the keyboard and the bar
    const r = a.getBoundingClientRect(), limit = innerHeight - gap - bar.offsetHeight - 14, m = $('main');
    if (r.bottom > limit) m.scrollTop += r.bottom - limit;
    else if (r.top < 70) m.scrollTop -= 70 - r.top;
  }
}
const kbSoon = () => { clearTimeout(kbT); kbT = setTimeout(updateKbar, 60); };
if (TOUCH) {
  if (vv) { vv.addEventListener('resize', kbSoon); vv.addEventListener('scroll', kbSoon); }
  document.addEventListener('focusin', kbSoon); document.addEventListener('focusout', kbSoon);
  main.addEventListener('input', () => { if ($('kbar').classList.contains('on')) kbSoon(); });
}
// the bar's buttons must not take the focus away (that would close the keyboard)
$('kbar').addEventListener('pointerdown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
$('kbar').addEventListener('click', (e) => {
  const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
  const a = editingEl(), s = scene(); if (!s) return;
  const b = a && beatOf(a), i = b ? s.beats.indexOf(b) : s.beats.length - 1;
  if (k === 'hide') { a && a.blur(); return; }
  if (k === 'add') { addBeatAfter(i); return; }
  if (!b) return;
  if (k === 'line') return addLine(b);
  if (k === 'prev' && i > 0) return focusBeat(s.beats[i - 1].id);
  if (k === 'next' && i < s.beats.length - 1) return focusBeat(s.beats[i + 1].id, 'line', false);
  if (k === 'done') { toggleDone(b); kbSoon(); return; }
  if (k === 'open') { openBeats.has(b.id) ? openBeats.delete(b.id) : openBeats.add(b.id); renderMain(); focusBeat(b.id); }
});
layout();

/* ================= Modals / keys ================= */
function closeModals() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', (e) => { if (e.target === o && o.id !== 'choiceModal') closeModals(); }));
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); Shell.show(['board', 'beats', 'sheets', 'write'][+e.key - 1]); return; }
  if (e.key === 'Escape') { closeCtx(); setDrawer(false); $('lightbox').classList.remove('open'); if (!$('choiceModal').classList.contains('open')) closeModals(); }
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName);
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && lastUndo) { e.preventDefault(); runUndo(); $('toast').style.display = 'none'; }
});
/* ================= Start ================= */
if (TOUCH) document.body.classList.add('touch');
if (prefs().focus && TOUCH) document.body.classList.add('focus');
const inBook = () => scene() && scene().bookId === Story.bookId;
if (!inBook() || scene().archived) data.currentId = visibleOrder()[0]?.id || null;
renderAll();

// Changes made on the Board, in the writing room, or in another window
const typingHere = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#mainInner, #sceneList') && a.matches('input,textarea,select')); };
let raf = 0;
Story.subscribe((source, info) => {
  if (source === 'beats' || info.view || info.positions && !info.fields) return;
  if (info.drafts && !info.structure) {
    const el = document.querySelector('.draft-words'), s = scene();
    if (el && s) { const w = draftWords(s.id); el.textContent = w ? `${w.toLocaleString()} word${w === 1 ? '' : 's'} drafted` : 'Not drafted yet'; }
    return;
  }
  if (!inBook()) data.currentId = visibleOrder()[0]?.id || null;
  if (info.book) { $('search').value = ''; renderAll(); $('main').scrollTop = 0; return; }
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    if (typingHere() || $('choiceModal').classList.contains('open')) { renderSidebarSafe(); pendingRender = true; return; }
    renderAll();
  });
});
function renderSidebarSafe() { const a = document.activeElement; if (!(a && a.closest && a.closest('#sceneList'))) renderSidebar(); }
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !typingHere()) { pendingRender = false; renderAll(); } }, 0));

// Called by the studio when this view is shown
window.__view = {
  // used by Publish: the beat outline as a Word file in memory (nothing is downloaded)
  async buildDoc() {
    const title = `Keepers of the Word — ${Story.bookLabel(Story.book(Story.bookId))} — Beat Outline`;
    const list = bookScenes().filter(s => !s.archived && !s.wip);
    return { title, blob: await exportDocx(list, { title, details: true, images: true }, true) };
  },
  shown(opts = {}) {
    setDrawer(false); layout();
    if (opts.sceneId && data.scenes.some(x => x.id === opts.sceneId)) {
      const s = data.scenes.find(x => x.id === opts.sceneId);
      if (s.bookId !== Story.bookId) Story.setBook(s.bookId);
      if (s.archived) showArchived = true;
      openPathTo(s);
      selectScene(s.id);
      document.querySelector(`.scene-item[data-id="${CSS.escape(s.id)}"]`)?.scrollIntoView({ block: 'center' });
    } else if (pendingRender && !typingHere()) { pendingRender = false; renderAll(); }
  }
};
</script>
