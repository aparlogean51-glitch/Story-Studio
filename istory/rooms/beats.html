<!DOCTYPE html>
<!-- iStory room: carried over from Story Studio (board/index.html). It uses the shell's parent.Story, parent.Shell, parent.MediaStore and parent.CloudSync. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e14;
    --surface: #161922;
    --card: #1e222e;
    --card-hi: #252a38;
    --border: rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.22);
    --text: #f1f3f9;
    --muted: #9aa2b6;
    --faint: #636b80;
    --accent: #38bdf8;
    --written: #34d399;
    --wip: #f59e0b;
    --danger: #f43f5e;
    --prose: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow: hidden; }
  button { font: inherit; font-size: 0.78rem; font-weight: 500; cursor: pointer; padding: 6px 11px; border-radius: 6px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: background 0.15s, border-color 0.15s; }
  button:hover { background: var(--card); border-color: var(--border-hi); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: #e11d48; border-color: #be123c; color: #fff; }
  button.primary:hover { background: #f43f5e; }
  button.success { background: #059669; border-color: #047857; color: #fff; }
  button.success:hover { background: #10b981; }
  button.danger { background: rgba(225,29,72,0.15); border-color: rgba(225,29,72,0.4); color: #fb7185; }
  button.danger:hover { background: #e11d48; color: #fff; }
  button.synced { border-color: #10b981; background: rgba(16,185,129,0.15); color: #6ee7b7; }
  button.reconnect { border-color: #f59e0b; background: rgba(245,158,11,0.15); color: #fcd34d; }
  .icon { background: transparent; border: none; padding: 4px 7px; color: var(--muted); line-height: 1; }
  .icon:hover { background: rgba(255,255,255,0.08); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="text"], textarea, select {
    font: inherit; font-size: 0.86rem; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; outline: none;
  }
  input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; line-height: 1.5; }

  /* Toolbar */
  #toolbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); background: rgba(12,14,20,0.95); overflow-x: auto; }
  .brand { font-family: 'Cinzel', serif; font-size: 1.05rem; letter-spacing: 0.05em; white-space: nowrap; margin-right: 6px; }
  .brand small { font-family: 'Inter', sans-serif; font-size: 0.72rem; color: var(--faint); letter-spacing: 0; margin-left: 8px; font-weight: 500; }
  .divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
  .spacer { flex: 1; }
  .tb-note { font-size: 0.7rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--faint); white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
  .dot.saving { background: #f59e0b; }
  .dot.error { background: var(--danger); }

  /* Layout */
  #app { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 48px); }
  #sidebar { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; }
  #sceneList { overflow-y: auto; flex: 1; padding: 6px 0 20px; }
  .group-title { font-size: 0.72rem; font-weight: 600; color: var(--faint); padding: 14px 14px 6px; }
  .scene-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: start; padding: 8px 12px 8px 10px; cursor: pointer; border-left: 3px solid transparent; }
  .scene-item:hover { background: rgba(255,255,255,0.03); }
  .scene-item.active { background: rgba(56,189,248,0.08); border-left-color: var(--accent); }
  .scene-item .no { font-size: 0.7rem; font-weight: 700; color: var(--faint); text-align: right; padding-top: 2px; }
  .scene-item .no.wip { color: var(--wip); font-size: 0.6rem; padding-top: 3px; }
  .scene-item .t { font-size: 0.86rem; font-weight: 600; line-height: 1.3; }
  .scene-item .sub { font-size: 0.72rem; color: var(--faint); margin-top: 2px; }
  .scene-item .gone { color: var(--wip); }
  .mini { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 3px; }
  .mini-bar { width: 42px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .mini-bar span { display: block; height: 100%; background: var(--written); }
  .mini-n { font-size: 0.66rem; color: var(--faint); }
  .side-empty { padding: 20px 16px; color: var(--muted); font-size: 0.82rem; line-height: 1.55; }

  #main { overflow-y: auto; min-height: 0; }
  .main-inner { max-width: 860px; margin: 0 auto; padding: 28px 32px 120px; }
  .empty-main { max-width: 460px; margin: 18vh auto 0; text-align: center; color: var(--muted); line-height: 1.6; }
  .empty-main h2 { font-family: var(--prose); font-weight: normal; font-size: 1.6rem; color: var(--text); margin-bottom: 10px; }
  .empty-main .actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

  /* Scene header */
  .scene-head { margin-bottom: 22px; }
  .scene-kicker { font-size: 0.76rem; color: var(--faint); margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 0.72rem; color: #e2e8f0; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px; }
  .chip.wip { color: #fcd34d; background: rgba(245,158,11,0.14); }
  .chip.gone { color: #fcd34d; background: rgba(245,158,11,0.1); }
  .scene-title { font-family: var(--prose); font-size: 1.85rem; font-weight: normal; line-height: 1.2; }
  input.scene-title { width: 100%; background: transparent; border: 1px solid transparent; padding: 2px 6px; margin-left: -7px; color: var(--text); }
  input.scene-title:hover { border-color: var(--border); }
  .objective { margin-top: 12px; padding: 8px 12px; background: rgba(56,189,248,0.07); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 0.86rem; color: #e0f2fe; line-height: 1.45; display: flex; gap: 8px; }
  .scene-summary { margin-top: 10px; font-family: var(--prose); font-size: 0.95rem; color: var(--muted); line-height: 1.6; white-space: pre-wrap; }
  .manual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .manual-fields label, .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; font-weight: 600; color: var(--muted); }
  .manual-fields .full { grid-column: 1 / -1; }
  .linked-note { font-size: 0.72rem; color: var(--faint); margin-top: 8px; }
  .write-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .write-row button.primary { font-size: 0.84rem; padding: 8px 14px; }
  .draft-words { font-size: 0.78rem; color: var(--muted); }
  .arch-banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 10px 14px; margin-bottom: 18px; border: 1px dashed rgba(148,163,184,0.4); border-radius: 8px; font-size: 0.82rem; color: var(--muted); }
  button.group-title.arch-toggle { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 0; cursor: pointer; }
  button.group-title.arch-toggle:hover { color: var(--text); background: none; }
  .scene-item.archived .t, .scene-item.archived .no { color: var(--faint); }
  .restore-deleted { display: block; margin: 18px 12px 0; width: calc(100% - 24px); background: none; border: 1px dashed var(--border); color: var(--faint); font-size: 0.72rem; white-space: normal; text-align: left; }
  .restore-deleted:hover { color: var(--text); }
  #ctxMenu { position: fixed; z-index: 260; display: none; flex-direction: column; min-width: 170px; padding: 4px; background: var(--surface); border: 1px solid var(--border-hi); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #ctxMenu.open { display: flex; }
  #ctxMenu button { background: none; border: none; text-align: left; padding: 8px 10px; font-size: 0.82rem; }
  #ctxMenu button:hover { background: rgba(255,255,255,0.06); }
  #ctxMenu button.del { color: #fb7185; }
  #ctxMenu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }

  /* Filing tree: acts → sequences → scenes */
  .side-actions { display: flex; gap: 6px; }
  .side-actions button { flex: 1; }
  .part { margin: 4px 0 10px; }
  .part-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 8px 4px; border-top: 1px solid var(--border-hi); background: rgba(255,255,255,0.025); }
  .part:first-child .part-head { border-top: none; }
  .part-head .nm { flex: 1; min-width: 0; font-size: 0.86rem; font-weight: 700; color: #e0f2fe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.01em; }
  .part-head .nm i { font-style: normal; color: var(--muted); font-weight: 600; }
  .part-head:hover .more, .part-head:focus-within .more { opacity: 1; }
  .part-body { padding-left: 8px; }
  .add-act { margin: 2px 0 4px 26px; background: none; border: none; color: var(--faint); font-size: 0.74rem; padding: 4px 6px; }
  .add-act:hover { color: var(--accent); background: none; }
  .act { margin: 6px 0 2px; }
  .act-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 6px; border-top: 1px solid var(--border); }
  .act:first-child .act-head { border-top: none; }
  .act-head .nm { flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .act-head .nm i { font-style: normal; color: var(--muted); font-weight: 600; }
  .tw { background: none; border: none; padding: 2px 4px; color: var(--faint); font-size: 0.7rem; width: 20px; }
  .tw:hover { color: var(--text); background: none; }
  .count { font-size: 0.66rem; color: var(--faint); padding: 0 4px; }
  .more { opacity: 0; }
  .act-head:hover .more, .seq-head:hover .more, .act-head:focus-within .more, .seq-head:focus-within .more { opacity: 1; }
  .seq { margin: 0 0 2px 12px; border-left: 1px solid rgba(255,255,255,0.07); }
  .seq-head { display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 2px; cursor: grab; border-radius: 0 6px 6px 0; }
  .seq-head:active { cursor: grabbing; }
  .seq-head .no { font-size: 0.68rem; font-weight: 700; color: #7dd3fc; background: rgba(56,189,248,0.1); border-radius: 4px; padding: 1px 5px; }
  .seq-head .nm { flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seq .scene-item { padding-left: 14px; }
  .seq-empty { margin: 2px 10px 6px 26px; padding: 7px 10px; border: 1px dashed var(--border); border-radius: 6px; font-size: 0.72rem; color: var(--faint); }
  .add-seq { margin: 2px 0 6px 34px; background: none; border: none; color: var(--faint); font-size: 0.74rem; padding: 4px 6px; }
  .add-seq:hover { color: var(--accent); background: none; }
  .tray-head { display: flex; align-items: center; gap: 4px; padding: 12px 8px 6px 14px; font-size: 0.72rem; font-weight: 600; color: var(--faint); border-top: 1px solid var(--border); margin-top: 8px; }
  .tray-head .help-i { font-weight: 400; margin-left: auto; font-size: 0.68rem; }
  button.tray-head { display: flex; width: 100%; text-align: left; background: none; border-radius: 0; border: none; border-top: 1px solid var(--border); }
  button.tray-head:hover { color: var(--text); background: none; }
  .scene-item[draggable="true"] { cursor: grab; }
  .scene-item.dragging, .seq.dragging { opacity: 0.4; }
  .drop-before { box-shadow: inset 0 2px 0 0 var(--accent) !important; }
  .drop-after { box-shadow: inset 0 -2px 0 0 var(--accent) !important; }
  .drop-into { background: rgba(56,189,248,0.12) !important; outline: 1px dashed rgba(56,189,248,0.6); outline-offset: -1px; }
  .rename { width: 100%; font-size: 0.8rem; padding: 3px 6px; }
  .crumb { font-size: 0.66rem; color: var(--faint); padding: 10px 14px 2px; }
  .side-empty b { color: var(--text); }

  /* Scene header */
  .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .num-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .num-input { width: 64px; padding: 4px 6px !important; font-weight: 700; text-align: center; }
  .file-select { max-width: 340px; font-size: 0.8rem !important; padding: 5px 8px !important; }
  .scene-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .scene-fields .full { grid-column: 1 / -1; }
  .scene-fields textarea { min-height: 64px; font-family: var(--prose); font-size: 0.92rem; }
  input.scene-title[type="text"] { font-family: var(--prose); font-size: 1.85rem; font-weight: normal; line-height: 1.2; width: 100%; background: transparent; border: 1px solid transparent; padding: 2px 6px; margin-left: -7px; color: var(--text); }
  input.scene-title[type="text"]:hover { border-color: var(--border); }
  input.scene-title[type="text"]:focus { border-color: var(--accent); background: var(--card); }
  input[type="number"] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; outline: none; }
  input[type="number"]:focus { border-color: var(--accent); }
  .field input, .field textarea, .field select { font-weight: 400; }
  .ks-mark { display: inline-block; flex: none; width: 12px; height: 9px; margin-right: 6px; vertical-align: 1px; background: #f5c451; clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); }
  .ks-chip { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 600; color: #fde9b5; background: rgba(245,196,81,0.12); border: 1px solid rgba(245,196,81,0.35); border-radius: 10px; padding: 2px 9px; }
  .scene-item.keystone .t { color: #fde9b5; }
  .wip-check { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); margin-top: 10px; cursor: pointer; }

  /* Template bar */
  .template-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 22px; }
  .template-bar label { font-size: 0.76rem; font-weight: 600; color: var(--muted); }
  .template-bar select { min-width: 230px; }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--muted); }
  .bar { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--written); transition: width 0.3s; }
  .template-desc { width: 100%; font-size: 0.76rem; color: var(--faint); line-height: 1.45; }

  /* Beats: the thread */
  #beats { position: relative; }
  .beat { position: relative; display: grid; grid-template-columns: 36px 1fr; }
  .beat::before { content: ''; position: absolute; left: 17px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.08); }
  .beat:first-child::before { top: 18px; }
  .beat:last-child::before { bottom: calc(100% - 18px); }
  .node {
    position: relative; z-index: 1; width: 24px; height: 24px; margin: 7px 0 0 6px; border-radius: 50%;
    background: var(--bg); border: 2px solid #475569; color: var(--muted);
    font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .node:hover { border-color: var(--written); }
  .beat.done .node { background: var(--written); border-color: var(--written); color: #052e1f; }
  .beat-card { margin: 0 0 10px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.15s; }
  .beat-card:focus-within { border-color: rgba(56,189,248,0.45); }
  .beat.drop-before .beat-card { box-shadow: 0 -3px 0 0 var(--accent); }
  .beat.drop-after .beat-card { box-shadow: 0 3px 0 0 var(--accent); }
  .beat.dragging { opacity: 0.4; }
  .beat.file-over .beat-card { border-color: var(--accent); background: var(--card-hi); }
  .beat-row { display: flex; align-items: flex-start; gap: 6px; padding: 6px 6px 6px 8px; }
  .grip { cursor: grab; color: var(--faint); padding: 8px 2px; font-size: 0.8rem; line-height: 1; user-select: none; }
  .grip:active { cursor: grabbing; }
  .beat-texts { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  input.b-label { background: transparent; border: none; padding: 3px 4px; font-size: 0.72rem; font-weight: 600; color: var(--accent); width: 100%; }
  input.b-label::placeholder { color: var(--faint); font-weight: 500; }
  textarea.b-line {
    background: transparent; border: none; padding: 2px 4px 4px; resize: none; overflow: hidden;
    font-family: var(--prose); font-size: 1.02rem; line-height: 1.45; color: var(--text); min-height: 28px;
  }
  textarea.b-line::placeholder { color: var(--faint); font-style: italic; }
  .beat.done textarea.b-line { color: #c7d2e0; }
  .badges { display: flex; gap: 4px; padding-top: 6px; }
  .badge { font-size: 0.68rem; color: var(--muted); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
  .expand { font-size: 0.8rem; padding-top: 7px; }
  .beat.open .expand { color: var(--accent); }
  .b-del { opacity: 0; padding-top: 7px; }
  .beat-card:hover .b-del, .beat-card:focus-within .b-del { opacity: 1; }
  .b-del:hover { color: #fb7185; }

  .beat-body { border-top: 1px solid var(--border); padding: 12px 14px 14px 30px; display: none; flex-direction: column; gap: 14px; }
  .beat.open .beat-body { display: flex; }
  .prompt-hint { font-size: 0.78rem; color: var(--faint); font-style: italic; }
  .sec-title { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  textarea.b-notes { width: 100%; min-height: 70px; font-family: var(--prose); font-size: 0.92rem; }
  .dlg-row { display: grid; grid-template-columns: 150px 1fr 28px; gap: 6px; align-items: start; margin-bottom: 6px; }
  .dlg-row textarea { min-height: 36px; font-family: var(--prose); font-size: 0.92rem; resize: vertical; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .img-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .img-card img { width: 100%; height: 110px; object-fit: cover; cursor: zoom-in; display: block; }
  .img-card .cap-row { display: flex; gap: 2px; padding: 4px; }
  .img-card input { flex: 1; min-width: 0; font-size: 0.74rem; padding: 4px 6px; }
  .drop-hint { font-size: 0.74rem; color: var(--faint); }
  .add-row { display: flex; gap: 8px; align-items: center; }

  .add-beat { margin-left: 44px; margin-top: 2px; }
  .beat-tip { margin: 10px 0 0 44px; font-size: 0.72rem; color: var(--faint); line-height: 1.5; }

  /* Modals, toast, lightbox */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; }
  .overlay.open { display: flex; }
  .modal { width: 480px; max-width: 94vw; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 1.02rem; }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow-y: auto; font-size: 0.86rem; line-height: 1.5; }
  .modal-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  .seg button.on { border-color: var(--accent); background: rgba(56,189,248,0.15); color: #7dd3fc; }
  .help { font-size: 0.76rem; color: var(--muted); line-height: 1.5; }

  /* ================= iPad and touch ================= */

    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* lifted while dragging, and the copy that follows your finger */

  #ghost { position: fixed; z-index: 280; pointer-events: none; transform: scale(1.03); box-shadow: 0 18px 40px rgba(0,0,0,0.55); border-radius: 8px; opacity: 0.95; background: var(--card); }

  /* swipe a beat: right = written, left = delete */

  /* the scene list as a drawer (iPad held upright), and focus mode */

  .scene-nav .where { flex: 1; min-width: 0; text-align: center; font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  body.focus .scene-nav, body.drawer-mode .scene-nav { display: flex; }
  body.focus #app { grid-template-columns: 1fr; }

  body.focus .main-inner { max-width: 980px; }

  #scrim { position: fixed; inset: 0; z-index: 140; background: rgba(0,0,0,0.5); display: none; }

  #recLive { min-height: 60px; max-height: 160px; overflow-y: auto; font-family: var(--prose); color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

  .sk-bar .sw.on, .sk-bar .tool.on { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sk-bar label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  #skWrap { flex: 1; position: relative; min-height: 0; margin: 10px; border-radius: 6px; overflow: hidden; background: #fbf8f1; }
  #skCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .img-card.sketch img { object-fit: contain; background: #fbf8f1; }
  .img-card .sk-tag { font-size: 0.66rem; color: var(--accent); padding: 0 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header id="toolbar">
  <button id="btnScenes" title="Show the list of scenes">☰ Scenes</button>
  <button id="btnAddPart" title="Add a part to this book">+ Part</button>
  <button id="btnAddAct" title="Add an act to the last part">+ Act</button>
  <button id="btnAddScene" title="Add a scene after the one you're viewing">+ Scene</button>
  <span class="divider"></span>
  <button class="success" id="btnExport">Export</button>
  <button id="btnFocus" title="Hide the scene list and work on one scene; swipe sideways for the next one">Focus</button>
  <span class="spacer"></span>
  <span class="tb-note">Drag scenes and sequences to reorder. Numbers run through the whole book.</span>
  <input type="file" id="imageInput" accept="image/*" multiple hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
</header>

<div id="app">
  <aside id="sidebar">
    <div class="side-top"><input type="text" id="search" placeholder="Find a scene (type “keystone” for keystones)" autocomplete="off"></div>
    <div id="sceneList"></div>
  </aside>
  <main id="main"><div class="main-inner" id="mainInner"></div></main>
</div>

<datalist id="speakers"></datalist>
<div id="toast"></div>
<div id="scrim"></div>
<div id="kbar" role="toolbar" aria-label="Beat tools">
  <button data-k="add">+ Beat</button><button data-k="line">💬 Line</button><button data-k="prev" aria-label="Previous beat">↑</button><button data-k="next" aria-label="Next beat">↓</button>
  <button data-k="done">✓ Written</button><button data-k="open">Details</button><span class="spacer"></span><button data-k="hide">Done</button>
</div>
<div id="recSheet" role="dialog" aria-modal="true" aria-label="Record a voice memo">
  <div class="box">
    <h3 id="recTitle">Voice memo</h3>
    <div id="recTime">0:00</div>
    <div class="lvl"><span id="recLevel"></span></div>
    <div id="recLive"></div>
    <div id="recNote"></div>
    <div class="row"><button id="btnRecCancel">Cancel</button><button id="btnRecStop">■ Stop and save</button></div>
  </div>
</div>
<div id="sketch" role="dialog" aria-modal="true" aria-label="Sketch">
  <div class="sk-bar">
    <button id="skCancel">Cancel</button>
    <span class="divider"></span>
    <button class="sw on" data-c="#1f2937" style="background:#1f2937" aria-label="Ink"></button>
    <button class="sw" data-c="#b91c1c" style="background:#b91c1c" aria-label="Red"></button>
    <button class="sw" data-c="#1d4ed8" style="background:#1d4ed8" aria-label="Blue"></button>
    <button class="sw" data-c="#15803d" style="background:#15803d" aria-label="Green"></button>
    <button class="sw" data-c="#b45309" style="background:#b45309" aria-label="Ochre"></button>
    <span class="divider"></span>
    <button class="tool on" data-w="2.2">Fine</button><button class="tool" data-w="5">Bold</button><button class="tool" data-w="eraser">Eraser</button>
    <span class="divider"></span>
    <button id="skUndo">↶ Undo</button><button id="skClear">Clear</button>
    <label><input type="checkbox" id="skPencil"> Pencil only</label>
    <span class="spacer"></span>
    <button class="primary" id="skSave">Save sketch</button>
  </div>
  <div id="skWrap"><canvas id="skCanvas"></canvas></div>
</div>
<div id="ctxMenu" role="menu"></div>
<div id="lightbox"><img alt=""><p></p></div>

<!-- Choice dialog -->
<div class="overlay" id="choiceModal">
  <div class="modal">
    <div class="modal-head"><h3 id="choiceTitle"></h3></div>
    <div class="modal-body" id="choiceBody"></div>
    <div class="modal-foot" id="choiceFoot"></div>
  </div>
</div>

<!-- Save template -->
<div class="overlay" id="templateModal">
  <div class="modal">
    <div class="modal-head"><h3>Save beats as a template</h3><button class="icon" data-close>✕</button></div>
    <div class="modal-body">
      <p class="help">Saves this scene's beat names as a template you can apply to other scenes. Beat text, notes and images aren't saved.</p>
      <label class="field">Template name<input type="text" id="tplName" placeholder="e.g. Nephite war council"></label>
    </div>
    <div class="modal-foot"><span class="spacer"></span><button data-close>Cancel</button><button class="primary" id="btnSaveTpl">Save template</button></div>
  </div>
</div>

<!-- Export -->
<div class="overlay" id="exportModal">
  <div class="modal">
    <div class="modal-head"><h3>Export beat outline</h3><button class="icon" data-close>✕</button></div>
    <div class="modal-body">
      <label class="field">Document title<input type="text" id="expTitle" value="Keepers of the Word — Beat Outline"></label>
      <div class="seg" id="expFormat"><button data-fmt="docx" class="on">Word (.docx)</button><button data-fmt="pdf">PDF</button></div>
      <div class="seg" id="expScope"><button data-scope="all" class="on">All scenes</button><button data-scope="current">This scene</button></div>
      <label class="check"><input type="checkbox" id="expDetails" checked> Include notes and dialogue</label>
      <label class="check"><input type="checkbox" id="expImages" checked> Include images</label>
      <label class="check"><input type="checkbox" id="expWip"> Include WIP scenes</label>
      <p class="help" id="expNote"></p>
    </div>
    <div class="modal-foot"><span class="spacer"></span><button data-close>Cancel</button><button class="success" id="btnDoExport">Export</button></div>
  </div>
</div>

<script>
/* ================= Templates ================= */
const BUILT_IN = [
  { id: 'free', name: 'Free sheet', desc: 'Blank beats in whatever shape the scene needs.', beats: [] },
  { id: 'goal', name: 'Goal · Conflict · Disaster', desc: 'The classic scene: someone wants something, is opposed, and ends worse off.', beats: [
    ['Goal', 'What does the POV character want walking into this scene?'],
    ['Conflict', 'Who or what stands in the way?'],
    ['Escalation', 'How does the struggle get harder?'],
    ['Disaster', 'How does it end badly, or with a twist that forces a new choice?']] },
  { id: 'sequel', name: 'Reaction · Dilemma · Decision', desc: 'The aftermath scene that follows a disaster and sets the next goal.', beats: [
    ['Reaction', 'How does the POV feel right after the last blow?'],
    ['Dilemma', 'What are the options, and why are they all hard?'],
    ['Decision', 'What do they choose? That becomes the next goal.']] },
  { id: 'battle', name: 'Battle / action', desc: 'Armies, ambushes, sieges, duels.', beats: [
    ['Stakes and ground', 'What is being fought over, and what does the field look like?'],
    ['Opening move', 'Who strikes first, and how?'],
    ['Complication', 'What goes wrong or changes?'],
    ['Turning point', 'Who seizes the advantage, and how?'],
    ['Climax', 'The decisive moment.'],
    ['Cost', 'What was lost? Who is left standing?']] },
  { id: 'confrontation', name: 'Dialogue / confrontation', desc: 'Two or more people want different things from each other.', beats: [
    ['Positions', 'What does each side want from the other?'],
    ['Opening', 'Who speaks first, and what is the first move?'],
    ['Pushback', 'How does the other side resist?'],
    ['Escalation', 'What gets said that can’t be unsaid?'],
    ['Turn', 'What is revealed or conceded?'],
    ['New footing', 'Where do they stand with each other now?']] },
  { id: 'council', name: 'Council / planning', desc: 'Leaders deciding what to do next.', beats: [
    ['The problem', 'What threat or need brings them together?'],
    ['Proposals', 'What courses of action are put forward?'],
    ['Dissent', 'Who objects, and why?'],
    ['Decision', 'What is decided, and by whom?'],
    ['Assignment', 'Who must do what, and what does it cost them?']] },
  { id: 'discovery', name: 'Discovery / revelation', desc: 'A character learns something that changes things.', beats: [
    ['Before', 'What does the POV believe going in?'],
    ['Clue', 'What first hints that something is off?'],
    ['Search', 'How do they dig for the truth?'],
    ['Reveal', 'What do they find out?'],
    ['Reaction', 'How do they take it?'],
    ['Consequence', 'What must change now?']] },
  { id: 'chase', name: 'Chase / escape', desc: 'Pursuit, flight, or a narrow getaway.', beats: [
    ['Trigger', 'What sets the chase off?'],
    ['Flight', 'Where do they run, and how?'],
    ['Obstacle', 'What blocks the way?'],
    ['Near miss', 'How close does the pursuer get?'],
    ['Gambit', 'What risky choice breaks them free, or doesn’t?'],
    ['Outcome', 'Where does it leave them?']] },
  { id: 'character', name: 'Emotional / character moment', desc: 'An inner shift: grief, doubt, love, resolve.', beats: [
    ['Trigger', 'What stirs the feeling?'],
    ['Resistance', 'How do they avoid facing it?'],
    ['Crack', 'What breaks through?'],
    ['Vulnerability', 'What do they finally let show?'],
    ['Shift', 'What do they understand or decide now?']] },
  { id: 'spiritual', name: 'Prayer / vision / spiritual experience', desc: 'Seeking and receiving: a prayer answered, a vision, a visitation.', beats: [
    ['Need', 'What drives them to seek?'],
    ['Wrestle', 'The struggle, doubt, or long waiting.'],
    ['Manifestation', 'What do they see, hear, or feel?'],
    ['Message', 'What is made known to them?'],
    ['Response', 'How do they answer, and what will it cost?']] },
  { id: 'journey', name: 'Travel / transition', desc: 'Moving the story from one place to another.', beats: [
    ['Departure', 'Who leaves, from where, and why now?'],
    ['The way', 'The land, the weather, the company.'],
    ['Encounter', 'What happens on the road?'],
    ['Arrival', 'What is waiting at the end?']] }
].map(t => ({ ...t, beats: t.beats.map(([label, prompt]) => ({ label, prompt })) }));

/* ================= State =================
   Scenes, acts, sequences and templates live in the studio's shared story. */
const Story = parent.Story, Shell = parent.Shell;
const PREFS_KEY = 'kotw_studio_beats';
function prefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch (e) { return {}; } }
function setPrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify({ ...prefs(), ...p })); } catch (e) {} }
const data = {
  get scenes() { return Story.data.scenes; },
  get templates() { return Story.data.templates; }, set templates(v) { Story.data.templates = v; },
  _current: prefs().currentId || null,
  get currentId() { return this._current; }, set currentId(v) { this._current = v; setPrefs({ currentId: v }); }
};
const collapsed = new Set(prefs().collapsed || []);
let showArchived = false;
let openBeats = new Set();
let lastUndo = null;
let exportFormat = 'docx', exportScope = 'all';
let imageTargetBeat = null;
let pendingRender = false;

const $ = (id) => document.getElementById(id);
const IPAD = parent.APP_MODE === 'ipad';
const TOUCH = IPAD || matchMedia('(pointer: coarse)').matches;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const fmtDur = (sec) => { sec = Math.max(0, Math.round(+sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const str = (v) => (v === null || v === undefined) ? '' : String(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
const scene = () => data.scenes.find(s => s.id === data.currentId) || null;
const allTemplates = () => [...BUILT_IN, ...data.templates];
const sceneNo = (s) => Story.numbers().scene.get(s.id);
// scenes of the book chosen in the top bar
const bookScenes = () => Story.scenesOf(Story.bookId);

function newBeat(f = {}) { return Story.newBeat(f); }

/* ================= Saving goes through the shared story ================= */
// beats only matter here and in the writing room's cabinet; fields and structure matter everywhere
function save(info = { beats: true }) { Story.changed('beats', info); }

function download(content, name, type = 'application/json') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  if (parent.shareFile && parent.shareFile(blob, name)) return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

let toastTimer = null;
function toast(msg, undoFn) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undoFn ? '<button id="toastUndo">Undo</button>' : '');
  t.style.display = 'flex';
  if (undoFn) { lastUndo = undoFn; $('toastUndo').onclick = () => { runUndo(); t.style.display = 'none'; }; }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
}
function runUndo() {
  if (!lastUndo) return;
  const f = lastUndo; lastUndo = null;
  f(); renderAll();
}

function showChoice(title, html, buttons) {
  return new Promise(resolve => {
    $('choiceTitle').textContent = title;
    $('choiceBody').innerHTML = html;
    const foot = $('choiceFoot');
    foot.innerHTML = '<span class="spacer"></span>';
    buttons.forEach(b => {
      const el = document.createElement('button');
      if (b.cls) el.className = b.cls;
      el.textContent = b.label;
      el.onclick = () => { $('choiceModal').classList.remove('open'); resolve(b.value); };
      foot.appendChild(el);
    });
    $('choiceModal').classList.add('open');
  });
}

/* ================= Drafts and the writing room ================= */
const draftWords = (id) => +(Story.data.drafts || {})[id] || 0;
function writeScene(s) { Shell.write(s.id); }

/* ================= Archive & delete ================= */
function visibleOrder() { return bookScenes().filter(s => !s.archived); }
function neighborOf(s) {
  const all = visibleOrder(), i = all.indexOf(s);
  return all[i + 1] || all[i - 1] || all.find(x => x !== s) || null;
}
function toggleArchive(s) {
  if (!s.archived) {
    const next = neighborOf(s);
    Story.setArchived(s.id, true, 'beats');
    if (data.currentId === s.id) data.currentId = next ? next.id : s.id;
    renderAll();
    toast(`Archived “${s.title}”.`, () => { Story.setArchived(s.id, false, 'beats'); data.currentId = s.id; });
  } else {
    Story.setArchived(s.id, false, 'beats');
    data.currentId = s.id;
    renderAll();
    toast(`Unarchived “${s.title}”. It's back in its place in the story.`);
  }
}
async function deleteScene(s) {
  const n = s.beats.length;
  const extras = s.beats.reduce((a, b) => a + b.dialogue.length + b.images.length + (b.notes.trim() ? 1 : 0), 0);
  const what = n ? `its ${n} beat${n === 1 ? '' : 's'}${extras ? ', with their notes, dialogue and images' : ''}` : 'it';
  const choice = await showChoice(`Delete “${s.title}”?`,
    `<p>This removes the scene and ${what} from the whole story, including its card on the Board.</p>
     ${draftWords(s.id) ? '<p class="help">Its draft in the writing room isn’t deleted.</p>' : ''}
     <p class="help">To hide it without losing anything, archive it instead.</p>`,
    [{ value: 'cancel', label: 'Cancel' }, ...(s.archived ? [] : [{ value: 'archive', label: 'Archive instead' }]), { value: 'delete', label: 'Delete', cls: 'danger' }]);
  if (choice === 'archive') return toggleArchive(s);
  if (choice !== 'delete') return;
  const next = neighborOf(s), wasCurrent = data.currentId === s.id;
  const undoFn = Story.deleteScenes([s.id], 'beats');
  if (wasCurrent) data.currentId = next ? next.id : null;
  renderAll();
  toast(`Deleted “${s.title}”.`, () => { undoFn && undoFn(); data.currentId = s.id; });
}

/* ---------- Menus (⋯ buttons and right-click) ---------- */
let menuItems = [];
function openMenu(items, x, y) {
  menuItems = items.filter(Boolean);
  const m = $('ctxMenu');
  m.innerHTML = menuItems.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}" role="menuitem" class="${it.cls || ''}" ${it.disabled ? 'disabled' : ''}>${esc(it.label)}</button>`).join('');
  m.classList.add('open');
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(4, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - h - 8)) + 'px';
  m.querySelector('button:not([disabled])')?.focus();
}
function closeCtx() { $('ctxMenu').classList.remove('open'); menuItems = []; }
$('ctxMenu').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const it = menuItems[+b.dataset.i];
  closeCtx();
  if (it && it.fn) it.fn();
});
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#ctxMenu')) closeCtx(); });
window.addEventListener('blur', closeCtx);

function partMenu(pt) {
  const parts = Story.data.parts.filter(x => x.bookId === pt.bookId), i = parts.indexOf(pt);
  return [
    { label: 'Rename part…', fn: () => startRename('part', pt.id) },
    { label: '+ Act in this part', fn: () => addAct(pt.id) },
    '-',
    { label: 'Move part up', fn: () => Story.movePart(pt.id, -1, 'beats') || renderAll(), disabled: i === 0 },
    { label: 'Move part down', fn: () => Story.movePart(pt.id, 1, 'beats') || renderAll(), disabled: i === parts.length - 1 },
    '-',
    { label: 'Delete part…', cls: 'del', fn: () => deletePart(pt) }
  ];
}
function actMenu(a) {
  const siblings = Story.data.acts.filter(x => x.partId === a.partId), i = siblings.indexOf(a);
  const pt = Story.part(a.partId), others = Story.data.parts.filter(x => x.bookId === pt.bookId && x.id !== pt.id);
  return [
    { label: 'Rename act…', fn: () => startRename('act', a.id) },
    { label: '+ Sequence in this act', fn: () => addSequence(a.id) },
    '-',
    { label: 'Move act up', fn: () => Story.moveAct(a.id, -1, 'beats') || renderAll(), disabled: i === 0 },
    { label: 'Move act down', fn: () => Story.moveAct(a.id, 1, 'beats') || renderAll(), disabled: i === siblings.length - 1 },
    ...others.map(o => ({ label: `Move to ${Story.partLabel(o)}`, fn: () => { Story.moveActToPart(a.id, o.id, 'beats'); collapsed.delete('p:' + o.id); saveCollapsed(); renderAll(); } })),
    '-',
    { label: 'Delete act…', cls: 'del', fn: () => deleteAct(a) }
  ];
}
function seqMenu(q) {
  return [
    { label: 'Rename sequence…', fn: () => startRename('seq', q.id) },
    { label: 'Change number…', fn: () => {
      const cur = Story.numbers().seq.get(q.id), max = Story.data.sequences.filter(x => Story.partOfAct(Story.act(x.actId))?.bookId === Story.bookId).length;
      const v = prompt(`Sequence number (1–${max}). It moves into that place, and the others renumber.`, cur);
      if (v && Number.isFinite(+v)) { Story.setSequenceNumber(q.id, +v, 'beats'); renderAll(); }
    } },
    { label: '+ Scene in this sequence', fn: () => addScene({ seqId: q.id }) },
    '-',
    { label: 'Delete sequence…', cls: 'del', fn: () => deleteSequence(q) }
  ];
}
function sceneMenu(s) {
  return [
    { label: 'Open', fn: () => selectScene(s.id) },
    { label: '✎ Write this scene', fn: () => writeScene(s) },
    { label: 'Show on the Board', fn: () => Shell.show('board', { sceneId: s.id }) },
    '-',
    { label: s.archived ? 'Unarchive' : 'Archive', fn: () => toggleArchive(s) },
    { label: 'Delete…', cls: 'del', fn: () => deleteScene(s) }
  ];
}

/* ---------- Acts and sequences ---------- */
function addPart() {
  const pt = Story.addPart(Story.bookId, '', 'beats');
  renderSidebar();
  startRename('part', pt.id);
}
// into the given part, or the book's last part (making Part 1 if there is none)
function addAct(partId) {
  if (!partId || typeof partId !== 'string') {
    const parts = Story.data.parts.filter(x => x.bookId === Story.bookId);
    partId = parts.length ? parts[parts.length - 1].id : Story.addPart(Story.bookId, '', 'beats').id;
  }
  collapsed.delete('p:' + partId); saveCollapsed();
  const a = Story.addAct(partId, '', 'beats');
  renderSidebar();
  startRename('act', a.id);
}
function addSequence(actId) {
  if (!actId) {
    const acts = Story.data.acts.filter(a => Story.part(a.partId)?.bookId === Story.bookId);
    if (!acts.length) { addAct(); return; }
    actId = acts[acts.length - 1].id;
  }
  collapsed.delete('a:' + actId); saveCollapsed();
  const q = Story.addSequence(actId, '', 'beats');
  renderSidebar();
  startRename('seq', q.id);
}
function addScene(opts = {}) {
  const cur = scene();
  const seqId = 'seqId' in opts ? opts.seqId : (cur && !cur.archived ? cur.seqId : null);
  let beforeId = null;
  if (!('seqId' in opts) && cur && !cur.archived) {
    const all = data.scenes, i = all.indexOf(cur), next = all.slice(i + 1).find(x => x.seqId === cur.seqId);
    beforeId = next ? next.id : null;
  }
  const s = Story.addScene({ title: 'New Scene', beats: [newBeat()] }, { seqId, beforeId }, 'beats');
  data.currentId = s.id;
  if (s.seqId) openPathTo(s);
  renderAll();
  const t = document.querySelector('input.scene-title'); if (t) { t.focus(); t.select(); }
}
function deletePart(pt) {
  const acts = Story.data.acts.filter(a => a.partId === pt.id), aIds = new Set(acts.map(a => a.id));
  const qs = Story.data.sequences.filter(q => aIds.has(q.actId));
  const n = data.scenes.filter(s => qs.some(q => q.id === s.seqId)).length;
  if (!confirm(`Delete ${Story.partLabel(pt)}?${acts.length ? ` Its ${acts.length} act${acts.length === 1 ? '' : 's'} and ${qs.length} sequence${qs.length === 1 ? '' : 's'} go too${n ? `, and its ${n} scene${n === 1 ? '' : 's'} move to Unfiled` : ''}.` : ''}`)) return;
  const undoFn = Story.deletePart(pt.id, 'beats');
  renderAll();
  toast(`Deleted ${pt.name ? '“' + pt.name + '”' : 'the part'}.`, undoFn);
}
function deleteAct(a) {
  const qs = Story.data.sequences.filter(q => q.actId === a.id);
  const scenes = data.scenes.filter(s => qs.some(q => q.id === s.seqId)).length;
  if (!confirm(`Delete ${Story.actLabel(a)}?${qs.length ? ` Its ${qs.length} sequence${qs.length === 1 ? '' : 's'} go too, and ${scenes ? `its ${scenes} scene${scenes === 1 ? '' : 's'} move to Unfiled` : 'no scenes are lost'}.` : ''}`)) return;
  const undoFn = Story.deleteAct(a.id, 'beats');
  renderAll();
  toast(`Deleted ${a.name ? '“' + a.name + '”' : 'the act'}.`, undoFn);
}
function deleteSequence(q) {
  const n = data.scenes.filter(s => s.seqId === q.id).length;
  if (n && !confirm(`Delete ${Story.seqLabel(q)}? Its ${n} scene${n === 1 ? '' : 's'} move to Unfiled.`)) return;
  const undoFn = Story.deleteSequence(q.id, 'beats');
  renderAll();
  toast(`Deleted the sequence${q.name ? ' “' + q.name + '”' : ''}.`, undoFn);
}
function startRename(kind, id) {
  const el = document.querySelector(`[data-rename="${kind}"][data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const item = kind === 'part' ? Story.part(id) : kind === 'act' ? Story.act(id) : Story.seq(id);
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'rename'; input.value = item.name;
  input.placeholder = kind === 'part' ? 'Part name (optional)' : kind === 'act' ? 'Act name (optional)' : 'Sequence name';
  el.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = (keep) => {
    if (done) return; done = true;
    if (keep && input.value.trim() !== item.name) (kind === 'part' ? Story.renamePart : kind === 'act' ? Story.renameAct : Story.renameSequence)(id, input.value, 'beats');
    renderAll();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); e.stopPropagation(); });
  input.addEventListener('blur', () => finish(true));
}
function saveCollapsed() { setPrefs({ collapsed: [...collapsed] }); }
// expand the part, act and sequence a scene is filed in
function openPathTo(s) {
  const w = Story.where(s);
  if (!w) return;
  ['p:' + w.part.id, 'a:' + w.act.id, 'q:' + w.seq.id].forEach(k => collapsed.delete(k));
  saveCollapsed();
}
function selectScene(id) {
  data.currentId = id;
  renderAll();
  $('main').scrollTop = 0;
}

/* ================= Rendering ================= */
function renderSidebar() {
  const q = $('search').value.trim().toLowerCase();
  const el = $('sceneList');
  const keep = el.scrollTop;
  if (!bookScenes().length && !Story.data.parts.some(x => x.bookId === Story.bookId)) {
    el.innerHTML = '<div class="side-empty">No scenes yet. Add scenes on the <b>Board</b> or with <b>+ Scene</b>, and file them into acts and sequences here.</div>';
    return;
  }
  if (q) { el.innerHTML = searchHTML(q); el.scrollTop = 0; return; }
  const t = Story.tree();
  let html = '';
  if (!t.parts.length) html += '<div class="side-empty">Add a part with <b>+ Part</b>, give it acts and sequences, then drag scenes into them.</div>';
  for (const pt of t.parts) {
    const pOpen = !collapsed.has('p:' + pt.part.id);
    const pn = pt.acts.reduce((x, a) => x + a.sequences.reduce((y, q) => y + q.scenes.length, 0), 0);
    html += `<div class="part" data-part-id="${esc(pt.part.id)}">
      <div class="part-head" data-id="${esc(pt.part.id)}">
        <button class="tw" data-act="toggle" data-key="p:${esc(pt.part.id)}" aria-expanded="${pOpen}" title="${pOpen ? 'Collapse' : 'Expand'}">${pOpen ? '▾' : '▸'}</button>
        <span class="nm" data-rename="part" data-id="${esc(pt.part.id)}" title="Double-click to rename">Part ${pt.no}${pt.part.name ? `<i>: ${esc(pt.part.name)}</i>` : ''}</span>
        <span class="count">${pn}</span>
        <button class="icon more" data-act="part-menu" data-id="${esc(pt.part.id)}" title="Part options" aria-label="Part options">⋯</button>
      </div>`;
    if (pOpen) {
      html += '<div class="part-body">';
      for (const a of pt.acts) {
        const open = !collapsed.has('a:' + a.act.id);
        const n = a.sequences.reduce((x, q) => x + q.scenes.length, 0);
        html += `<div class="act" data-act-id="${esc(a.act.id)}">
          <div class="act-head" data-drop="act" data-id="${esc(a.act.id)}">
            <button class="tw" data-act="toggle" data-key="a:${esc(a.act.id)}" aria-expanded="${open}" title="${open ? 'Collapse' : 'Expand'}">${open ? '▾' : '▸'}</button>
            <span class="nm" data-rename="act" data-id="${esc(a.act.id)}" title="Double-click to rename">Act ${a.no}${a.act.name ? `<i>: ${esc(a.act.name)}</i>` : ''}</span>
            <span class="count">${n}</span>
            <button class="icon more" data-act="act-menu" data-id="${esc(a.act.id)}" title="Act options" aria-label="Act options">⋯</button>
          </div>
          ${open ? a.sequences.map(seqHTML).join('') + `<button class="add-seq" data-act="add-seq" data-id="${esc(a.act.id)}" data-drop="act-end">+ Sequence</button>` : ''}
        </div>`;
      }
      html += `<button class="add-act" data-act="add-act" data-id="${esc(pt.part.id)}">+ Act</button></div>`;
    }
    html += '</div>';
  }
  html += `<div class="tray-head" data-drop="unfiled">Unfiled <span class="count">${t.unfiled.length}</span><span class="help-i">${t.unfiled.length ? 'Drag into a sequence' : ''}</span></div>`;
  html += t.unfiled.map(itemHTML).join('') || '<div class="seq-empty" data-drop="unfiled" style="margin-left:14px">Nothing unfiled.</div>';
  if (t.archived.length) {
    html += `<button class="tray-head" data-act="toggle-archived" aria-expanded="${showArchived}">${showArchived ? '▾' : '▸'} Archived <span class="count">${t.archived.length}</span></button>`;
    if (showArchived) html += t.archived.map(itemHTML).join('');
  }
  el.innerHTML = html;
  el.scrollTop = keep;
}
function seqHTML(q) {
  const open = !collapsed.has('q:' + q.seq.id);
  return `<div class="seq" data-seq-id="${esc(q.seq.id)}">
    <div class="seq-head" ${TOUCH ? '' : 'draggable="true" '}data-drag="seq" data-drop="seq" data-id="${esc(q.seq.id)}" title="${TOUCH ? 'Hold to move or for options' : 'Drag to move this sequence'}">
      <button class="tw" data-act="toggle" data-key="q:${esc(q.seq.id)}" aria-expanded="${open}">${open ? '▾' : '▸'}</button>
      <span class="no">${q.no}</span>
      <span class="nm" data-rename="seq" data-id="${esc(q.seq.id)}" title="Double-click to rename">${esc(q.seq.name) || '<i style="color:var(--faint)">Untitled sequence</i>'}</span>
      <span class="count">${q.scenes.length}</span>
      <button class="icon more" data-act="seq-menu" data-id="${esc(q.seq.id)}" title="Sequence options" aria-label="Sequence options">⋯</button>
    </div>
    ${open ? (q.scenes.map(itemHTML).join('') || `<div class="seq-empty" data-drop="seq" data-id="${esc(q.seq.id)}">Drag scenes here</div>`) : ''}
  </div>`;
}
function itemHTML(s) {
  const done = s.beats.filter(b => b.done).length, total = s.beats.length;
  const n = sceneNo(s);
  const no = s.archived ? '<span class="no">–</span>' : s.wip ? '<span class="no wip">WIP</span>' : `<span class="no">${n ?? ''}</span>`;
  const sub = [s.pov, s.location].filter(Boolean).join(', ');
  return `<div class="scene-item${s.id === data.currentId ? ' active' : ''}${s.archived ? ' archived' : ''}${s.keystone ? ' keystone' : ''}" data-id="${esc(s.id)}" tabindex="0" ${s.archived ? '' : (TOUCH ? '' : 'draggable="true" ') + 'data-drag="scene"'} title="${TOUCH ? 'Hold to move or for options' : 'Drag to move · right-click for options'}">
    ${no}
    <div><div class="t">${s.keystone ? '<span class="ks-mark" title="Keystone scene"></span>' : ''}${esc(s.title)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
    <div class="mini">${total ? `<div class="mini-bar"><span style="width:${Math.round(done / total * 100)}%"></span></div><span class="mini-n">${done}/${total}</span>` : '<span class="mini-n">no beats</span>'}</div>
  </div>`;
}
function searchHTML(q) {
  const hit = (s) => (s.keystone && 'keystone'.startsWith(q) && q.length >= 3) || [s.title, s.pov, s.location, s.objective, s.summary].some(v => String(v || '').toLowerCase().includes(q)) ||
    s.beats.some(b => [b.label, b.text, b.notes].some(v => String(v || '').toLowerCase().includes(q)) || b.dialogue.some(d => (d.line + ' ' + d.speaker).toLowerCase().includes(q)));
  const list = bookScenes().filter(hit);
  if (!list.length) return '<div class="side-empty">No scene matches that search.</div>';
  let html = '', last = null;
  for (const s of list) {
    const w = Story.where(s);
    const crumb = s.archived ? 'Archived' : w ? `Part ${w.partNo} › Act ${w.actNo} › Sequence ${w.seqNo}${w.seq.name ? ': ' + w.seq.name : ''}` : 'Unfiled';
    if (crumb !== last) { html += `<div class="crumb">${esc(crumb)}</div>`; last = crumb; }
    html += itemHTML(s).replace(' draggable="true" data-drag="scene"', '').replace(' data-drag="scene"', '');
  }
  return html;
}

function renderMain() {
  const s = scene();
  const el = $('mainInner');
  if (!s) {
    el.innerHTML = `<div class="empty-main"><h2>Every scene, beat by beat.</h2>
      <p>Pick a scene on the left, or add one. File scenes into acts and sequences, then break each into beats: the moments that make it work.</p>
      <div class="actions"><button class="primary" data-act="add-scene">+ Scene</button><button data-act="add-act">+ Act</button></div></div>`;
    return;
  }
  const tpl = allTemplates().find(t => t.id === s.type) || BUILT_IN[0];
  const done = s.beats.filter(b => b.done).length;
  const n = sceneNo(s), max = Story.numbers().scene.size;

  const numberBit = s.archived ? '<span class="chip gone">Archived</span>' : s.wip ? '<span class="chip wip" title="Work in progress scenes get no number">WIP</span>'
    : `<label class="num-wrap" title="Type a number to move the scene there; the others renumber">Scene <input type="number" class="num-input" data-num min="1" max="${max}" value="${n}"></label>`;

  const words = draftWords(s.id);
  const order = visibleOrder(), at = order.indexOf(s);
  el.innerHTML = `
    <div class="scene-nav"><button data-nav="-1" ${at <= 0 ? 'disabled' : ''} aria-label="Previous scene">‹</button>
      <span class="where">${at >= 0 ? `<b>${at + 1}</b> of ${order.length} · ` : ''}swipe sideways for the next scene</span>
      <button data-nav="1" ${at < 0 || at >= order.length - 1 ? 'disabled' : ''} aria-label="Next scene">›</button></div>
    ${s.archived ? `<div class="arch-banner"><span>This scene is archived. It's hidden from the story, the Board and exports.</span><button data-act="archive-scene">Unarchive</button></div>` : ''}
    <div class="scene-head">
      <div class="head-row">${numberBit}
        <select class="file-select" data-file aria-label="Filed in" ${s.archived ? 'disabled' : ''}>${fileOpts}</select>
        ${s.keystone ? '<span class="ks-chip"><span class="ks-mark"></span>Keystone</span>' : ''}
      </div>
      <input type="text" class="scene-title" data-field="title" value="${esc(s.title)}" aria-label="Scene title">
      <div class="scene-fields">
        <label class="field">POV character<input type="text" data-field="pov" value="${esc(s.pov)}" list="speakers"></label>
        <label class="field">Location<input type="text" data-field="location" value="${esc(s.location)}"></label>
        <label class="field full">Objective<input type="text" data-field="objective" value="${esc(s.objective)}" placeholder="What must this scene accomplish?"></label>
        <label class="field full">Summary<textarea data-field="summary" placeholder="What happens, what's in conflict, how it ends…">${esc(s.summary)}</textarea></label>
      </div>
      <label class="wip-check"><input type="checkbox" data-keystone ${s.keystone ? 'checked' : ''}> <span class="ks-mark"></span>Keystone (a scene the story is built around)</label>
      <label class="wip-check" style="margin-top:4px"><input type="checkbox" data-wip ${s.wip ? 'checked' : ''}> Work in progress (no number, left out of exports)</label>
      <div class="write-row">
        <button class="primary" data-act="write" title="Open this scene in the writing room">✎ Write this scene</button>
        <span class="draft-words">${words ? `${words.toLocaleString()} word${words === 1 ? '' : 's'} drafted` : 'Not drafted yet'}</span>
        <span class="spacer"></span>
        <button data-act="board" title="Show this scene's card on the Board">Board</button>
        <button data-act="archive-scene" title="${s.archived ? 'Put this scene back in the story' : 'Hide this scene without deleting anything'}">${s.archived ? 'Unarchive' : 'Archive'}</button>
        <button class="danger" data-act="delete-scene" title="Delete this scene and all its beats">Delete</button>
      </div>
    </div>
    <div class="template-bar">
      <label for="typeSelect">Scene type</label>
      <select id="typeSelect">${opts(BUILT_IN)}${data.templates.length ? `<optgroup label="Your templates">${opts(data.templates)}</optgroup>` : ''}</select>
      <button data-act="save-template" ${s.beats.length ? '' : 'disabled'}>Save as template</button>
      ${tpl.custom ? '<button data-act="delete-template">Delete template</button>' : ''}
      <div class="progress"><span>${done} of ${s.beats.length} written</span><div class="bar"><span style="width:${s.beats.length ? Math.round(done / s.beats.length * 100) : 0}%"></span></div></div>
      <div class="template-desc">${esc(tpl.desc)}</div>
    </div>

function autoGrow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

function updateSpeakers() {

function refreshProgress() {

/* ================= Beat helpers ================= */
const beatOf = (el) => { const s = scene(); const id = el.closest('.beat')?.dataset.id; return s && s.beats.find(b => b.id === id); };
function focusBeat(id, where = 'line', atEnd = true) {
  const el = document.querySelector(`.beat[data-id="${CSS.escape(id)}"] ${where === 'label' ? '.b-label' : '.b-line'}`);
  if (el) { el.focus(); if (atEnd) { const n = el.value.length; el.setSelectionRange(n, n); } }
}
function addBeatAfter(idx, focus = true) {
  const s = scene();
  const b = newBeat();
  s.beats.splice(idx + 1, 0, b);
  renderMain(); refreshProgress(); save();
  if (focus) focusBeat(b.id);
  return b;
}
function deleteBeat(b) {
  const s = scene(), i = s.beats.indexOf(b);
  if (i < 0) return;
  s.beats.splice(i, 1);
  openBeats.delete(b.id);
  renderMain(); refreshProgress(); save();
  const has = b.text.trim() || b.notes.trim() || b.dialogue.length || b.images.length;
  if (has) toast('Beat deleted.', () => { s.beats.splice(i, 0, b); });
  return i;
}
function moveBeat(b, delta) {
  const s = scene(), i = s.beats.indexOf(b), j = i + delta;
  if (i < 0 || j < 0 || j >= s.beats.length) return;
  s.beats.splice(i, 1); s.beats.splice(j, 0, b);
  renderMain(); save(); focusBeat(b.id);
}

async function applyTemplate(id) {
  const s = scene(), t = allTemplates().find(x => x.id === id);
  if (!s || !t) return;
  const hasContent = s.beats.some(b => b.text.trim() || b.notes.trim() || b.dialogue.length || b.images.length);
  let mode = 'replace';
  if (s.beats.length && t.beats.length) {
    mode = await showChoice(`Use “${t.name}”?`,
      `<p>This scene already has ${s.beats.length} beat${s.beats.length === 1 ? '' : 's'}.</p>
       <p class="help">${hasContent ? '<b>Replace</b> removes the current beats (you can undo it right after). ' : ''}<b>Add after</b> keeps them and adds the template's beats at the end.</p>`,
      [{ value: 'cancel', label: 'Cancel' }, { value: 'append', label: 'Add after' }, { value: 'replace', label: 'Replace', cls: hasContent ? 'danger' : 'primary' }]);
    if (mode === 'cancel') { renderMain(); return; }
  }
  const prevBeats = s.beats.slice(), prevType = s.type;
  const fresh = t.beats.map(b => newBeat(b));
  s.type = id;
  if (mode === 'append') s.beats = [...s.beats, ...fresh];
  else s.beats = fresh.length ? fresh : (s.beats.length ? s.beats : [newBeat()]);
  if (!s.beats.length) s.beats = [newBeat()];
  renderAll(); save();
  if (mode === 'replace' && prevBeats.length && fresh.length) toast(`Beats replaced with “${t.name}”.`, () => { s.beats = prevBeats; s.type = prevType; });
  if (s.beats[0]) focusBeat(s.beats[mode === 'append' ? prevBeats.length : 0]?.id || s.beats[0].id);
}

/* ================= Images ================= */
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('not an image'));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1400, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const x = c.getContext('2d');
        x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('could not open that image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function addImages(beat, files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  let added = 0;
  for (const f of list) {
    try { beat.images.push({ id: 'i-' + uid(), src: await readImage(f), caption: f.name && !/^image\.\w+$/i.test(f.name) ? f.name.replace(/\.[^.]+$/, '') : '' }); added++; }
    catch (e) { toast(`Couldn't add ${f.name || 'that image'}: ${e.message}.`); }
  }
  if (added) { openBeats.add(beat.id); renderMain(); refreshProgress(); save(); }
}

/* Drag scenes within and between sequences; drag sequences within and between acts */
let dragItem = null;
list.addEventListener('dragstart', (e) => {
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  const kind = el.dataset.drag;
  dragItem = { kind, id: kind === 'scene' ? el.dataset.id : el.dataset.id };
  (kind === 'seq' ? el.closest('.seq') : el).classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', kind);
});
list.addEventListener('dragend', () => { dragItem = null; clearDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
function clearDrop() { list.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into')); }
// where would this drop land?
function dropTarget(e) {
  if (!dragItem) return null;
  if (dragItem.kind === 'scene') {
    const item = e.target.closest('.scene-item');
    if (item && !item.classList.contains('archived') && item.dataset.id !== dragItem.id) {
      const r = item.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
      return { el: item, cls: before ? 'drop-before' : 'drop-after', drop: () => {
        const target = data.scenes.find(x => x.id === item.dataset.id);
        let beforeId = target.id;
        if (!before) { const all = data.scenes, i = all.indexOf(target); const next = all.slice(i + 1).find(x => x.seqId === target.seqId && x.id !== dragItem.id && !x.archived); beforeId = next ? next.id : null; }
        Story.moveScene(dragItem.id, target.seqId, beforeId, 'beats');
      } };
    }
    const into = e.target.closest('[data-drop="seq"],[data-drop="unfiled"]');
    if (into) return { el: into, cls: 'drop-into', drop: () => Story.moveScene(dragItem.id, into.dataset.drop === 'seq' ? into.dataset.id : null, null, 'beats') };
    return null;
  }
  // a sequence
  const head = e.target.closest('.seq-head');
  if (head && head.dataset.id !== dragItem.id) {
    const r = head.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
    return { el: head, cls: before ? 'drop-before' : 'drop-after', drop: () => {
      const target = Story.seq(head.dataset.id), all = Story.data.sequences, i = all.indexOf(target);
      const next = all.slice(i + 1).find(x => x.actId === target.actId && x.id !== dragItem.id);
      Story.moveSequence(dragItem.id, target.actId, before ? target.id : (next ? next.id : null), 'beats');
    } };
  }
  const actEl = e.target.closest('[data-drop="act"],[data-drop="act-end"]');
  if (actEl) return { el: actEl, cls: 'drop-into', drop: () => Story.moveSequence(dragItem.id, actEl.dataset.id, null, 'beats') };
  return null;
}
list.addEventListener('dragover', (e) => {
  const t = dropTarget(e);
  clearDrop();
  if (!t) return;
  e.preventDefault();
  t.el.classList.add(t.cls);
});
list.addEventListener('dragleave', (e) => { if (!list.contains(e.relatedTarget)) clearDrop(); });
list.addEventListener('drop', (e) => {
  const t = dropTarget(e);
  clearDrop();
  if (!t) return;
  e.preventDefault();
  const kind = dragItem.kind, id = dragItem.id;
  t.drop();
  dragItem = null;
  if (kind === 'scene') {
    const s = data.scenes.find(x => x.id === id);
    if (s && s.seqId) openPathTo(s);
  }
  renderAll();
});

  if (e.target.tagName === 'IMG' && e.target.closest('.img-card.sketch')) { const im = b.images.find(x => x.id === e.target.closest('.img-card').dataset.iid); if (im) return Sketch.open(b, im); }

});
main.addEventListener('keydown', (e) => {
  const t = e.target, s = scene();
  if (t.classList.contains('node') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); t.click(); return; }
  const b = beatOf(t);

  if (e.metaKey && e.key === 'Enter') { e.preventDefault(); toggleDone(b); return; }

  document.querySelectorAll('.beat').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  if (el.dataset.id !== dragBeatId) el.classList.add(before ? 'drop-before' : 'drop-after');

main.addEventListener('drop', (e) => {
  const el = e.target.closest('.beat');

  const s = scene();
  if (hasFiles(e)) { el.classList.remove('file-over'); const b = s.beats.find(x => x.id === el.dataset.id); if (b) addImages(b, e.dataTransfer.files); return; }
  if (!dragBeatId || el.dataset.id === dragBeatId) return;

  const r = el.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
  s.beats.splice(s.beats.indexOf(moving), 1);

});

// the act and sequence headings to print before each scene
function headingsFor(list) {
  const out = new Map();
  let lastPart = null, lastAct = null, lastSeq = null;
  const anyParts = Story.data.parts.some(x => x.bookId === Story.bookId);
  for (const s of list) {
    const w = Story.where(s);
    const partK = w ? w.part.id : 'unfiled', actK = w ? w.act.id : 'unfiled', seqK = w ? w.seq.id : '';
    const partH = w ? Story.partLabel(w.part) : (anyParts ? 'Unfiled' : '');
    out.set(s.id, {
      part: partK !== lastPart ? partH : '',
      act: w && actK !== lastAct ? Story.actLabel(w.act) : '',
